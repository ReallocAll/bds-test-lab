[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-spark-python-dependency-test"
version = "0.1.0"
description = "Real third-party dependency workload for Spark Python attribution E2E validation"
requires-python = ">=3.12"

[project.entry-points."endstone"]
spark-python-dependency-test = "endstone_spark_python_dependency_test:DependencyPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_spark_python_dependency_test"]
