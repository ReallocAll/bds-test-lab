name = "endstone-reload-diagnostic"
version = "0.1.0"
[project.entry-points.endstone]
reload-diagnostic = "endstone_reload_diagnostic:ReloadDiagnostic"
[tool.hatch.build.targets.wheel]
packages = ["src/endstone_reload_diagnostic"]
