[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-final-comparable-workload"
version = "0.1.0"
description = "Deterministic Endstone workload and per-tick metrics for Spark control comparisons"
requires-python = ">=3.11"

[project.entry-points."endstone"]
final-comparable-workload = "endstone_final_comparable_workload:ComparableWorkloadPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_final_comparable_workload"]
