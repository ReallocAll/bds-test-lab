[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-python-attribution-plugin-b"
version = "0.1.0"
description = "Second distinct Python plugin for Spark attribution coverage"
requires-python = ">=3.12"

[project.entry-points."endstone"]
spark-python-attribution-plugin-b = "endstone_spark_python_attribution_b:PluginB"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_spark_python_attribution_b"]
