name: Spark Chunk-Fly Fleet Load Test

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-fly-spark-test.yml"
      - "controller/chunk_fly_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/bot_validation.py"
      - "controller/run_test.py"
      - "providers/artifact_provider.py"
  pull_request:
    paths:
      - ".github/workflows/chunk-fly-spark-test.yml"
      - "controller/chunk_fly_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/bot_validation.py"
      - "controller/run_test.py"
      - "providers/artifact_provider.py"
  workflow_dispatch:
    inputs:
      bot_ref:
        description: "bds-test-bot commit/ref to profile"
        required: false
        default: "feat/chunk-fly-scenario"
      profile_seconds:
        description: "Seconds per Spark execution profile"
        required: false
        default: "30"

concurrency:
  group: spark-chunk-fly-fleet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BOT_REF: ${{ github.event.inputs.bot_ref || 'feat/chunk-fly-scenario' }}
  PROFILE_SECONDS: ${{ github.event.inputs.profile_seconds || '30' }}

jobs:
  chunk-fly-fleet:
    name: Chunk-fly fleet ${{ matrix.count }} bots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        count: [1]

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout bot diagnostic ref
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          token: ${{ secrets.REPO_PAT }}
          persist-credentials: true

      - name: Patch authoritative publisher spawn seed
        working-directory: bot-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bot = Path("internal/bot/bot.go")
          text = bot.read_text()
          old_line = "candidate := mgl32.Vec3{game.PlayerPosition[0], float32(y) + playerEyeHeight, game.PlayerPosition[2]}"
          new_line = "candidate := publisherEyePosition(p.Position)"
          if old_line in text:
              text = text.replace(old_line, new_line, 1)
              text = text.replace("\n\t\"github.com/go-gl/mathgl/mgl32\"", "", 1)
              text = text.replace("// without trusting StartGame's Y≈32768 placeholder. StartGame X/Z\n\t\t\t\t// remain precise, while the publisher block Y is converted back to\n\t\t\t\t// PlayerAuthInput eye-height coordinates.", "// without trusting StartGame's Y≈32768 placeholder. The publisher\n\t\t\t\t// is a server-owned BlockPos and may differ in X/Z after BDS resolves\n\t\t\t\t// the real spawn. Seed all axes from it: block centres for X/Z and\n\t\t\t\t// eye height for the PlayerAuthInput Y coordinate.", 1)
              bot.write_text(text)
          elif new_line not in text:
              raise SystemExit("bot.go publisher seed target not found")

          flight = Path("internal/bot/flight.go")
          text = flight.read_text()
          marker = "func horizontalDistance(start, end mgl32.Vec3) float64 {\n\treturn math.Hypot(float64(end[0]-start[0]), float64(end[2]-start[2]))\n}\n"
          helper = "func publisherEyePosition(position protocol.BlockPos) mgl32.Vec3 {\n\treturn mgl32.Vec3{\n\t\tfloat32(position[0]) + 0.5,\n\t\tfloat32(position[1]) + playerEyeHeight,\n\t\tfloat32(position[2]) + 0.5,\n\t}\n}\n\n" + marker
          if "func publisherEyePosition(" not in text:
              if marker not in text:
                  raise SystemExit("flight.go insertion target not found")
              flight.write_text(text.replace(marker, helper, 1))

          test = Path("internal/bot/flight_test.go")
          text = test.read_text()
          marker = "func TestChunkFlyClimbsThenTraversesAtSafeAltitude(t *testing.T) {\n"
          addition = "func TestPublisherEyePositionUsesAuthoritativeBlockPosition(t *testing.T) {\n\tgot := publisherEyePosition(protocol.BlockPos{266, 70, 159})\n\twant := mgl32.Vec3{266.5, 70 + playerEyeHeight, 159.5}\n\tif got != want {\n\t\tt.Fatalf(\"publisher eye position = %v, want %v\", got, want)\n\t}\n}\n\n" + marker
          if "TestPublisherEyePositionUsesAuthoritativeBlockPosition" not in text:
              if marker not in text:
                  raise SystemExit("flight_test.go insertion target not found")
              test.write_text(text.replace(marker, addition, 1))
          PY

          gofmt -w internal/bot/bot.go internal/bot/flight.go internal/bot/flight_test.go
          go test ./...

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/bot/bot.go internal/bot/flight.go internal/bot/flight_test.go
            git commit -m "fix: seed chunk-fly from authoritative publisher position"
            git push origin HEAD:feat/chunk-fly-scenario
          fi
          echo "BOT_TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build tested bot revision
        working-directory: bot-src
        shell: bash
        run: |
          go mod tidy
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot
          echo "Bot tested SHA: \`${BOT_TESTED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run real BDS chunk-fly fleet Spark load
        run: >-
          python -m controller.chunk_fly_validation
          --bot dist/bds-test-bot
          --count ${{ matrix.count }}
          --profile-seconds ${{ env.PROFILE_SECONDS }}

      - name: Add load metrics to summary
        if: always()
        shell: bash
        run: |
          if [[ -f fleet-spark-result.json ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet-spark-result.json").read_text())
          metrics = data.get("metrics") or {}
          mspt = metrics.get("mspt_10s") or {}
          tps = metrics.get("tps") or {}
          pcpu = metrics.get("process_cpu_percent") or {}
          scpu = metrics.get("system_cpu_percent") or {}
          mem = metrics.get("memory_rss_bytes") or {}
          shutdown = data.get("fleet_shutdown_event") or {}
          evidence = data.get("chunk_fly_evidence") or []
          min_late_chunks = min((e.get("late_chunk_growth", 0) for e in evidence), default=0)
          min_late_distance = min((e.get("late_horizontal_growth", 0) for e in evidence), default=0)
          print(f"## Chunk-fly fleet: {data.get('bot_count')} bots")
          print()
          print(f"Status: **{data.get('status')}**")
          print(f"BDS: `{data.get('bds_version')}`")
          print(f"Spark profile: {data.get('spark_profile_viewer_url')}")
          print(f"TPS 10s: {tps.get('10s')}")
          print(f"MSPT 10s mean/p95/max: {mspt.get('mean')} / {mspt.get('p95')} / {mspt.get('max')}")
          print(f"Process CPU 10s: {pcpu.get('10s')}%")
          print(f"System CPU 10s: {scpu.get('10s')}%")
          print(f"RSS mean/p95/max: {mem.get('mean')} / {mem.get('p95')} / {mem.get('max')} bytes")
          print(f"AuthInput: {shutdown.get('auth_inputs_sent')}")
          print(f"Movement PlayerAuthInput: {shutdown.get('movement_inputs_sent')}")
          print(f"Chunks received: {shutdown.get('chunks_received')}")
          print(f"Flying confirmed: {shutdown.get('flying_confirmed')}")
          print(f"Min horizontal distance: {shutdown.get('min_horizontal_distance')}")
          print(f"Min late-window chunk growth: {min_late_chunks}")
          print(f"Min late-window horizontal growth: {min_late_distance}")
          PY
          fi >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fleet evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-chunk-fly-fleet-${{ matrix.count }}-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            fleet-${{ matrix.count }}-chunk-fly.log
            test-results.json
            fleet-spark-result.json
            failure-diagnostics.txt
            work/linux/bedrock_server/server.properties
            work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 14
