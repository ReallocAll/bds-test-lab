name: Spark Chunk-Fly Fleet Load Test

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-fly-spark-test.yml"
      - "controller/chunk_fly_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/bot_validation.py"
      - "controller/run_test.py"
      - "providers/artifact_provider.py"
  pull_request:
    paths:
      - ".github/workflows/chunk-fly-spark-test.yml"
      - "controller/chunk_fly_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/bot_validation.py"
      - "controller/run_test.py"
      - "providers/artifact_provider.py"
  workflow_dispatch:
    inputs:
      bot_ref:
        description: "Exact bds-test-bot commit/ref to profile"
        required: false
        default: "cb329a123de56cb09e07466651d09a0ff06ab0d6"
      profile_seconds:
        description: "Seconds per Spark execution profile"
        required: false
        default: "30"

concurrency:
  group: spark-chunk-fly-fleet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BOT_REF: ${{ github.event.inputs.bot_ref || 'cb329a123de56cb09e07466651d09a0ff06ab0d6' }}
  PROFILE_SECONDS: ${{ github.event.inputs.profile_seconds || '30' }}
  ENDSTONE_RUN_ID: "32770415029"

jobs:
  chunk-fly-fleet:
    name: Chunk-fly fleet ${{ matrix.count }} bots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        count: [1]

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout bot at exact ref
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact bot revision
        working-directory: bot-src
        shell: bash
        run: |
          go mod tidy
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot
          echo "Bot ref: \`${BOT_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Endstone pinned run: \`${ENDSTONE_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run real BDS chunk-fly fleet Spark load
        run: >-
          python -m controller.chunk_fly_validation
          --bot dist/bds-test-bot
          --count ${{ matrix.count }}
          --profile-seconds ${{ env.PROFILE_SECONDS }}

      - name: Add load metrics to summary
        if: always()
        shell: bash
        run: |
          if [[ -f fleet-spark-result.json ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet-spark-result.json").read_text())
          metrics = data.get("metrics") or {}
          mspt = metrics.get("mspt_10s") or {}
          tps = metrics.get("tps") or {}
          pcpu = metrics.get("process_cpu_percent") or {}
          scpu = metrics.get("system_cpu_percent") or {}
          mem = metrics.get("memory_rss_bytes") or {}
          shutdown = data.get("fleet_shutdown_event") or {}
          evidence = data.get("chunk_fly_evidence") or []
          min_late_chunks = min((e.get("late_chunk_growth", 0) for e in evidence), default=0)
          min_late_distance = min((e.get("late_horizontal_growth", 0) for e in evidence), default=0)
          print(f"## Chunk-fly fleet: {data.get('bot_count')} bots")
          print()
          print(f"Status: **{data.get('status')}**")
          print(f"BDS: `{data.get('bds_version')}`")
          print(f"Spark profile: {data.get('spark_profile_viewer_url')}")
          print(f"TPS 10s: {tps.get('10s')}")
          print(f"MSPT 10s mean/p95/max: {mspt.get('mean')} / {mspt.get('p95')} / {mspt.get('max')}")
          print(f"Process CPU 10s: {pcpu.get('10s')}%")
          print(f"System CPU 10s: {scpu.get('10s')}%")
          print(f"RSS mean/p95/max: {mem.get('mean')} / {mem.get('p95')} / {mem.get('max')} bytes")
          print(f"AuthInput: {shutdown.get('auth_inputs_sent')}")
          print(f"Movement PlayerAuthInput: {shutdown.get('movement_inputs_sent')}")
          print(f"Chunks received: {shutdown.get('chunks_received')}")
          print(f"Flying confirmed: {shutdown.get('flying_confirmed')}")
          print(f"Min horizontal distance: {shutdown.get('min_horizontal_distance')}")
          print(f"Min late-window chunk growth: {min_late_chunks}")
          print(f"Min late-window horizontal growth: {min_late_distance}")
          PY
          fi >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fleet evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-chunk-fly-fleet-${{ matrix.count }}-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            fleet-${{ matrix.count }}-chunk-fly.log
            test-results.json
            fleet-spark-result.json
            failure-diagnostics.txt
            work/linux/bedrock_server/server.properties
            work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 14
