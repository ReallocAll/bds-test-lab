name: Apply strong Windows final contract

on:
  push:
    branches: [fix/combined-pack-state-oracle]
    paths:
      - ".github/workflows/apply-strong-final-contract.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/combined-pack-state-oracle

      - name: Apply focused source and check patch
        run: python .github/apply_strong_final_contract.py

      - name: Validate patched files
        run: |
          python -m py_compile controller/combined_pack_gamerule_fleet_exact_runner.py controller/combined_windows_final_runner.py tests/test_combined_windows_final_runner.py
          python -m pip install --disable-pip-version-check psutil packaging hatchling ruff
          python -m unittest tests.test_combined_windows_final_runner
          ruff check controller/combined_windows_final_runner.py tests/test_combined_windows_final_runner.py
          git diff --check

      - name: Commit source patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/combined_pack_gamerule_fleet_exact_runner.py .github/workflows/combined-pack-gamerule-20p-checks.yml
          git rm .github/apply_strong_final_contract.py .github/workflows/apply-strong-final-contract.yml
          git commit -m "test: keep full Windows public behavior proof"
          git push origin HEAD:fix/combined-pack-state-oracle
