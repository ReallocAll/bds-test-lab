name: Allocation Rate Evidence Check

on:
  push:
    branches:
      - test/allocation-rate-evidence-final
    paths:
      - ".github/workflows/allocation-rate-evidence-check.yml"

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "33065846585"
  EXPECTED_SPARK_SHA: "3fcbfc8dfe1561cbd20bc86a2b89d1b834ad89e3"

jobs:
  verify-health-protobuf:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Download release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh run download "${SOURCE_RUN_ID}" \
            --repo ReallocAll/bds-test-lab \
            --pattern 'allocation-rate-release-*' \
            --dir evidence

      - name: Checkout exact Spark schema
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ env.EXPECTED_SPARK_SHA }}
          path: spark-src
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests protobuf grpcio-tools

      - name: Generate Python protobuf bindings
        run: |
          mkdir -p generated/spark
          touch generated/spark/__init__.py
          python -m grpc_tools.protoc \
            -I spark-src/proto \
            --python_out=generated \
            spark-src/proto/spark/spark.proto

      - name: Verify allocation-rate fields in uploaded health data
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          from pathlib import Path
          import sys

          import requests
          from google.protobuf.message import DecodeError

          sys.path.insert(0, str(Path("generated").resolve()))
          from spark import spark_pb2

          expected_sha = os.environ["EXPECTED_SPARK_SHA"]
          result_paths = sorted(Path("evidence").rglob("test-results.json"))
          if len(result_paths) != 2:
              raise SystemExit(f"Expected two platform evidence results, found {len(result_paths)}")

          verified = []
          for result_path in result_paths:
              result = json.loads(result_path.read_text(encoding="utf-8"))
              platform = str(result.get("platform") or result_path.parent.name)
              if result.get("status") != "PASS":
                  raise SystemExit(f"{platform}: source release validation is not PASS")

              metadata_path = result_path.with_name("metadata.json")
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              actual_sha = (((metadata.get("components") or {}).get("spark") or {}).get("sha"))
              if actual_sha != expected_sha:
                  raise SystemExit(f"{platform}: Spark SHA mismatch: {actual_sha} != {expected_sha}")

              viewer_url = str(result.get("health_upload_viewer_url") or "").strip()
              if not viewer_url:
                  raise SystemExit(f"{platform}: missing health upload viewer URL")
              key = viewer_url.rstrip("/").rsplit("/", 1)[-1]
              response = requests.get(f"https://spark-usercontent.lucko.me/{key}", timeout=30)
              response.raise_for_status()
              content_type = response.headers.get("Content-Type", "").split(";", 1)[0].strip().lower()
              if content_type != "application/x-spark-health":
                  raise SystemExit(f"{platform}: unexpected health content type: {content_type!r}")

              payload = response.content
              health = spark_pb2.HealthData()
              try:
                  health.ParseFromString(payload)
              except DecodeError:
                  health.ParseFromString(gzip.decompress(payload))

              series = health.metadata.metrics.memory_allocation
              values = list(series.values)
              if not values or max(values) <= 0:
                  raise SystemExit(f"{platform}: Metrics.memory_allocation field 7 is absent or non-positive")

              memory = health.metadata.platform_statistics.memory
              rolling = {}
              for field in ("alloc_bps_last1m", "alloc_bps_last5m", "alloc_bps_last15m"):
                  if not memory.HasField(field):
                      raise SystemExit(f"{platform}: PlatformStatistics.Memory.{field} is absent")
                  distribution = getattr(memory, field)
                  if distribution.mean <= 0 or distribution.max <= 0:
                      raise SystemExit(f"{platform}: {field} is not positive: mean={distribution.mean}, max={distribution.max}")
                  rolling[field] = {
                      "mean": distribution.mean,
                      "max": distribution.max,
                      "min": distribution.min,
                      "median": distribution.median,
                      "p95": distribution.percentile95,
                  }

              verified.append({
                  "platform": platform,
                  "spark_sha": actual_sha,
                  "health_key": key,
                  "memory_allocation_samples": len(values),
                  "memory_allocation_latest": values[-1],
                  "rolling": rolling,
              })

          Path("allocation-rate-protobuf-evidence.json").write_text(
              json.dumps(verified, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(verified, indent=2, sort_keys=True))
          PY

      - name: Upload decoded evidence
        uses: actions/upload-artifact@v7
        with:
          name: allocation-rate-protobuf-evidence-${{ github.run_id }}
          path: allocation-rate-protobuf-evidence.json
          if-no-files-found: error
          retention-days: 30
