name: Python Native Callback Bridge Paired BDS

on:
  push:
    branches:
      - perf/python-native-bridge-ab
    paths:
      - ".github/workflows/python-native-bridge-paired.yml"
  workflow_dispatch:

concurrency:
  group: python-native-bridge-paired-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  PARENT_SHA: "78314038b67d506ec48da9a61181c0048fb3658e"
  CANDIDATE_SHA: "f214ace8c9014ebe776e5e307ea80209f994e992"
  ORIGINAL_BASELINE_SHA: "15b79e814ee6542f8a2382df09353e9c2009c8d1"
  BOT_REF: "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a"
  BDS_TEST_BOT_SCENARIO_FILE: bot-src/scenarios/mixed-actions.json
  DURATION_SECONDS: "180"

jobs:
  paired-python:
    name: Linux paired native callback bridge A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7

      - name: Wait for exact Spark CI and artifacts
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$PARENT_SHA" "$CANDIDATE_SHA"; do
            ready=0
            for attempt in $(seq 1 80); do
              json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${sha}&per_page=50")"
              build="$(jq -r '[.workflow_runs[] | select(.name == "Build")][0].conclusion // ""' <<<"$json")"
              python_ci="$(jq -r '[.workflow_runs[] | select(.name == "Python attribution")][0].conclusion // ""' <<<"$json")"
              echo "sha=$sha attempt=$attempt Build=${build:-pending} Python=${python_ci:-pending}"
              if [[ "$build" == success && "$python_ci" == success ]]; then
                ready=1
                break
              fi
              for conclusion in "$build" "$python_ci"; do
                if [[ "$conclusion" == failure || "$conclusion" == cancelled || "$conclusion" == timed_out ]]; then
                  echo "Exact Spark CI failed for $sha: Build=$build Python=$python_ci" >&2
                  exit 1
                fi
              done
              sleep 15
            done
            if [[ "$ready" -ne 1 ]]; then
              echo "Timed out waiting for exact Spark CI for $sha" >&2
              exit 1
            fi
            EXPECTED_SPARK_SHA="$sha" python -m controller.assert_spark_artifact \
              --platform linux --expected-sha "$sha"
          done

      - name: Checkout exact bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact bot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging hatchling

      - name: Run five interleaved parent/candidate pairs
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p evidence
          printf 'rep\tmode\ttarget\tsha\tlabel\tcontroller_exit_code\tstatus\n' > evidence/case-status.tsv
          overall=0
          modes=(off shadow full)

          copy_if_present() {
            local source="$1"
            local target="$2"
            [[ -e "$source" ]] || return 0
            cp -a "$source" "$target"
          }

          run_case() {
            local rep="$1" mode="$2" target="$3" sha="$4"
            local label="rep${rep}-${mode}-${target}"
            local case_dir="evidence/$label"
            echo "===== $label sha=$sha ====="
            mkdir -p "$case_dir"
            rm -rf downloads work hotspot-wheel
            rm -f metadata.json bds.log endstone.log spark.log test-results.json \
              python-attribution-result.json python-attribution-performance.json \
              python-attribution-tick-metrics.json python-attribution-performance.sparkprofile \
              python-attribution-bots-linux-5-chunk-walk.log failure-diagnostics.txt

            EXPECTED_SPARK_SHA="$sha" python -m controller.python_attribution_performance_runner \
              --platform linux \
              --bot dist/bds-test-bot \
              --count 5 \
              --mode "$mode" \
              --duration-seconds "$DURATION_SECONDS" 2>&1 | tee "$case_dir/controller-output.log"
            pipeline_status=("${PIPESTATUS[@]}")
            controller_exit="${pipeline_status[0]}"
            tee_exit="${pipeline_status[1]}"
            copy_failed=0
            for path in metadata.json bds.log endstone.log spark.log test-results.json \
              python-attribution-result.json python-attribution-performance.json \
              python-attribution-tick-metrics.json python-attribution-performance.sparkprofile \
              python-attribution-bots-linux-5-chunk-walk.log failure-diagnostics.txt; do
              if [[ -e "$path" ]] && ! copy_if_present "$path" "$case_dir/"; then
                copy_failed=1
              fi
            done
            if [[ -f work/linux/bedrock_server/version.txt ]]; then
              copy_if_present work/linux/bedrock_server/version.txt "$case_dir/bds-version.txt" || copy_failed=1
            fi
            if [[ -f work/linux/bedrock_server/server.properties ]]; then
              copy_if_present work/linux/bedrock_server/server.properties "$case_dir/server.properties" || copy_failed=1
            fi
            status=PASS
            if [[ "$controller_exit" -ne 0 || "$tee_exit" -ne 0 || "$copy_failed" -ne 0 ]]; then
              status=FAIL
              overall=1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$rep" "$mode" "$target" "$sha" "$label" "$controller_exit" "$status" >> evidence/case-status.tsv
          }

          for rep in 1 2 3 4 5; do
            for mode in "${modes[@]}"; do
              if (( rep % 2 == 1 )); then
                run_case "$rep" "$mode" parent "$PARENT_SHA"
                run_case "$rep" "$mode" candidate "$CANDIDATE_SHA"
              else
                run_case "$rep" "$mode" candidate "$CANDIDATE_SHA"
                run_case "$rep" "$mode" parent "$PARENT_SHA"
              fi
            done
          done
          exit "$overall"

      - name: Analyze paired evidence
        if: always()
        shell: bash
        run: >-
          python controller/paired_python_attribution_analysis.py
          --root evidence
          --parent-sha "$PARENT_SHA"
          --candidate-sha "$CANDIDATE_SHA"
          --repetitions 5
          --modes off shadow full

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-native-bridge-paired-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
