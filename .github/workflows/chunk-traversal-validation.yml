name: Chunk Traversal Validation

on:
  pull_request:
    paths:
      - ".github/workflows/chunk-traversal-validation.yml"
      - "controller/chunk_traversal_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/bot_validation.py"
      - "providers/artifact_provider.py"
      - "tests/test_chunk_traversal_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BOT_REF: "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a"
  EXPECTED_SPARK_SHA: "6a32a1d05ca50ddb106a0fdcfa0a1762de018acd"

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check psutil
      - run: python -m unittest discover -s tests -p 'test_chunk_traversal_validation.py'

  real-bds:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: chunk-fly
            count: 1
          - scenario: chunk-fly
            count: 5
          - scenario: chunk-fly
            count: 10
          - scenario: chunk-fly
            count: 20
          - scenario: chunk-walk
            count: 20

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout production bot exact merge
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build production bot
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          echo "BOT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          go mod download
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run authoritative traversal + Spark profile
        shell: bash
        run: >-
          python -m controller.chunk_traversal_validation
          --bot dist/bds-test-bot
          --count ${{ matrix.count }}
          --scenario ${{ matrix.scenario }}
          --profile-seconds 30

      - name: Record exact revisions
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("traversal-metadata.json")
          path.write_text(json.dumps({
              "bot_sha": os.environ.get("BOT_SHA"),
              "expected_bot_sha": os.environ.get("BOT_REF"),
              "expected_spark_sha": os.environ.get("EXPECTED_SPARK_SHA"),
              "lab_sha": os.environ.get("GITHUB_SHA"),
              "scenario": "${{ matrix.scenario }}",
              "count": ${{ matrix.count }},
          }, indent=2) + "\n")
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chunk-traversal-${{ matrix.scenario }}-${{ matrix.count }}-${{ github.run_id }}
          path: |
            fleet-${{ matrix.count }}-${{ matrix.scenario }}.log
            fleet-spark-result.json
            test-results.json
            failure-diagnostics.txt
            bds.log
            spark.log
            metadata.json
            traversal-metadata.json
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
