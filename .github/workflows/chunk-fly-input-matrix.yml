name: Chunk-Fly Input Matrix

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-fly-input-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "8f15c6f1bb48c20fe66e4ca9f84bb1e42beb1dc2"

jobs:
  diagnose:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant:
          - tick1-predicted
          - tick1-no-block

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Patch diagnostic input variant
        run: python3 controller/patch_chunk_fly_matrix_variant.py bot-src "${{ matrix.variant }}"

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build diagnostic bot
        working-directory: bot-src
        shell: bash
        run: |
          go mod tidy
          gofmt -w internal/bot/tick.go internal/bot/bot.go
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run real BDS diagnostic
        continue-on-error: true
        run: >-
          python -m controller.chunk_fly_validation
          --bot dist/bds-test-bot
          --count 1
          --profile-seconds 5

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chunk-fly-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            fleet-1-chunk-fly.log
            fleet-spark-result.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
