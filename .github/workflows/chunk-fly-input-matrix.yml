name: Chunk-Fly Input Matrix

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-fly-input-matrix.yml"
      - "controller/patch_chunk_fly_matrix_variant.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "8f15c6f1bb48c20fe66e4ca9f84bb1e42beb1dc2"

jobs:
  diagnose:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant:
          - coherent-baseline
          - coherent-no-block

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Patch diagnostic input variant
        run: python3 controller/patch_chunk_fly_matrix_variant.py bot-src "${{ matrix.variant }}"

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build diagnostic bot
        working-directory: bot-src
        shell: bash
        run: |
          go mod tidy
          gofmt -w internal/bot/tick.go internal/bot/bot.go
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run real BDS diagnostic
        continue-on-error: true
        run: >-
          python -m controller.chunk_fly_validation
          --bot dist/bds-test-bot
          --count 1
          --profile-seconds 5

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chunk-fly-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            fleet-1-chunk-fly.log
            fleet-spark-result.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
