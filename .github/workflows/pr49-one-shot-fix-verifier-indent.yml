name: PR49 One-shot Fix Verifier Indent

on:
  push:
    branches:
      - research/pr49-no-shim-windows-bds
    paths:
      - ".github/workflows/pr49-one-shot-fix-verifier-indent.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/pr49-no-shim-windows-bds
          fetch-depth: 0

      - name: Remove incorrect verifier indentation normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr49-one-shot-final-gates.yml')
          text = path.read_text(encoding='utf-8')
          needle = '          verifier = "\\n".join(line[10:] if line.startswith("          ") else line for line in verifier.splitlines()) + "\\n"\n'
          assert text.count(needle) == 1
          path.write_text(text.replace(needle, ''), encoding='utf-8')
          PY
          git diff --check

      - name: Commit fix and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr49-one-shot-fix-verifier-indent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr49-one-shot-final-gates.yml
          git diff --cached --check
          git commit -m "ci: fix PR49 verifier generator indentation"
          git push origin HEAD:research/pr49-no-shim-windows-bds
