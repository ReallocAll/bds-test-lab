name: Spark BlockActor Extended Real BDS Validation

on:
  push:
    branches:
      - test/extend-block-actor-validation
    paths:
      - "controller/block_actor_extended_validation.py"
      - ".github/workflows/spark-block-actor-extended-validation.yml"
  workflow_dispatch:

concurrency:
  group: spark-block-actor-extended-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: "5d19837d15aacfc93a72484c915f787630a3261d"
  BOT_REF: "a0a83240e9e8f12d4806ba31194fb1807d7b5dd1"

jobs:
  extended-block-actor-validation:
    name: Extended BlockActor lifecycle (Linux BDS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout Bot at exact ref
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact Bot revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging

      - name: Compile extended validator
        run: python -m py_compile controller/block_actor_extended_validation.py

      - name: Require exact Spark artifact
        run: >-
          python -m controller.assert_spark_artifact
          --platform linux
          --expected-sha ${{ env.EXPECTED_SPARK_SHA }}

      - name: Run extended real BDS BlockActor validation
        run: python -m controller.block_actor_extended_validation --bot dist/bds-test-bot

      - name: Add extended evidence to summary
        if: always()
        shell: bash
        run: |
          if [[ -f test-results.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("test-results.json").read_text())
          print("## Spark BlockActor extended real BDS validation")
          print()
          print(f"Status: **{data.get('status')}**")
          print(f"Spark SHA: `{data.get('spark_sha')}`")
          print(f"BDS: `{data.get('bds_version')}`")
          print(f"Second dimension: `{data.get('second_dimension')}`")
          print(f"Movement: `{json.dumps(data.get('movement') or {}, sort_keys=True)}`")
          print(f"Performance: `{json.dumps(data.get('performance_compare') or {}, sort_keys=True)}`")
          print("World-info lifecycle:")
          for sample in data.get("world_info_samples") or []:
              print(f"- `{sample.get('phase')}`: tile_entities={sample.get('tile_entities')}, present={sample.get('tile_entities_present')}, chunks={sample.get('chunks')}")
          PY
          fi >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extended BlockActor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-block-actor-extended-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            block-actor-bot.log
            test-results.json
            failure-diagnostics.txt
            health-captures/
            work/linux/bedrock_server/server.properties
            work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 30
