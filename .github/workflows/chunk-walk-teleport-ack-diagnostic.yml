name: Raw Spawn Movement BDS Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-walk-teleport-ack-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Resolve bot ref
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < controller/chunk_fly_bot_ref.txt)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "BOT_REF=$ref" >> "$GITHUB_ENV"

      - name: Pin known-good Endstone artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Verify unmodified bot
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go vet ./...
          go test ./...

      - name: Patch raw movement tracing and authoritative telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tick = Path("bot-src/internal/bot/tick.go")
          text = tick.read_text()
          old = "if cfg.Scenario == ScenarioChunkFly && !state.positionReadySnapshot() {"
          new = "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !state.positionReadySnapshot() {"
          if old not in text:
              raise SystemExit("tick readiness target not found")
          tick.write_text(text.replace(old, new, 1))

          bot = Path("bot-src/internal/bot/bot.go")
          text = bot.read_text()
          old = "\tstartGameSeen := make(chan struct{})\n\tvar startGameOnce sync.Once\n\tdialer := minecraft.Dialer{"
          new = "\tstartGameSeen := make(chan struct{})\n\tvar startGameOnce sync.Once\n\tvar rawMovePlayer atomic.Uint64\n\tvar rawCorrection atomic.Uint64\n\tvar rawPostMove atomic.Uint64\n\tdialer := minecraft.Dialer{"
          if old not in text:
              raise SystemExit("raw counter declaration target not found")
          text = text.replace(old, new, 1)
          old = "\t\tPacketFunc: func(header packet.Header, _ []byte, _, _ net.Addr) {\n\t\t\tif header.PacketID == packet.IDStartGame {\n\t\t\t\tstartGameOnce.Do(func() { close(startGameSeen) })\n\t\t\t}\n\t\t},"
          new = "\t\tPacketFunc: func(header packet.Header, _ []byte, _, _ net.Addr) {\n\t\t\tswitch header.PacketID {\n\t\t\tcase packet.IDStartGame:\n\t\t\t\tstartGameOnce.Do(func() { close(startGameSeen) })\n\t\t\tcase packet.IDMovePlayer:\n\t\t\t\trawMovePlayer.Add(1)\n\t\t\tcase packet.IDCorrectPlayerMovePrediction:\n\t\t\t\trawCorrection.Add(1)\n\t\t\tcase packet.IDServerPlayerPostMovePosition:\n\t\t\t\trawPostMove.Add(1)\n\t\t\t}\n\t\t},"
          if old not in text:
              raise SystemExit("PacketFunc tracing target not found")
          text = text.replace(old, new, 1)
          old = "\tgame := conn.GameData()\n"
          new = "\tif err := out.Emit(\"raw_spawn_movement\", map[string]any{\"move_player\": rawMovePlayer.Load(), \"corrections\": rawCorrection.Load(), \"post_move\": rawPostMove.Load()}); err != nil {\n\t\treturn stageError(ExitRuntime, \"output\", err)\n\t}\n\n\tgame := conn.GameData()\n"
          if old not in text:
              raise SystemExit("spawn raw summary target not found")
          text = text.replace(old, new, 1)
          for old, new in [
              ("if cfg.Scenario == ScenarioChunkFly && samePublisher {", "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && samePublisher {"),
              ("if cfg.Scenario == ScenarioChunkFly && changedChunk {", "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && changedChunk {"),
              ("if onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {", "if onlineState && (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !time.Now().Before(nextProgress) {"),
          ]:
              if old not in text:
                  raise SystemExit(f"telemetry target not found: {old}")
              text = text.replace(old, new, 1)
          old = "\t\t\t\t\"server_post_move_updates\": postMoveUpdates,\n"
          new = "\t\t\t\t\"server_post_move_updates\": postMoveUpdates,\n\t\t\t\t\"raw_move_player\":          rawMovePlayer.Load(),\n\t\t\t\t\"raw_corrections\":          rawCorrection.Load(),\n\t\t\t\t\"raw_post_move\":            rawPostMove.Load(),\n"
          if old not in text:
              raise SystemExit("progress raw counters target not found")
          bot.write_text(text.replace(old, new, 1))
          PY
          gofmt -w bot-src/internal/bot/bot.go bot-src/internal/bot/tick.go

      - name: Build diagnostic bot
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --disable-pip-version-check psutil

      - name: Run real BDS raw-packet diagnostic
        continue-on-error: true
        run: python -m controller.chunk_walk_validation --bot dist/bds-test-bot --count 1 --profile-seconds 10

      - name: Summarize raw server evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("fleet-1-chunk-walk.log")
          print("## Raw spawn movement packet evidence")
          if not p.exists():
              print("No fleet log")
              raise SystemExit
          spawn=[]
          rows=[]
          for line in p.read_text(errors="replace").splitlines():
              try: e=json.loads(line)
              except json.JSONDecodeError: continue
              if e.get("event") == "raw_spawn_movement": spawn.append(e)
              if e.get("event") == "bot_progress": rows.append(e)
          print(f"spawn_raw={spawn}")
          print(f"progress_samples={len(rows)}")
          if rows:
              a,b=rows[0],rows[-1]
              for k in ("raw_move_player","raw_corrections","raw_post_move","publisher_position","publisher_chunk","chunks_received","horizontal_distance"):
                  print(f"{k}: {a.get(k)} -> {b.get(k)}")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-spawn-movement-${{ github.run_id }}
          path: |
            fleet-1-chunk-walk.log
            fleet-spark-result.json
            test-results.json
            failure-diagnostics.txt
            bds.log
            endstone.log
            spark.log
          if-no-files-found: warn
          retention-days: 7
