name: Ground Collision BDS Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-walk-teleport-ack-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Resolve bot ref
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < controller/chunk_fly_bot_ref.txt)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "BOT_REF=$ref" >> "$GITHUB_ENV"

      - name: Pin known-good Endstone artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Verify unmodified bot
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go vet ./...
          go test ./...

      - name: Patch grounded collision input and telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tick = Path("bot-src/internal/bot/tick.go")
          text = tick.read_text()
          old = "if cfg.Scenario == ScenarioChunkFly && !state.positionReadySnapshot() {"
          new = "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !state.positionReadySnapshot() {"
          if old not in text:
              raise SystemExit("tick readiness target not found")
          text = text.replace(old, new, 1)
          old = "\tflags.Set(packet.InputFlagBlockBreakingDelayEnabled)\n"
          new = "\tflags.Set(packet.InputFlagBlockBreakingDelayEnabled)\n\tflags.Set(packet.InputFlagVerticalCollision)\n"
          if old not in text:
              raise SystemExit("vertical collision insertion target not found")
          tick.write_text(text.replace(old, new, 1))

          bot = Path("bot-src/internal/bot/bot.go")
          text = bot.read_text()
          for old, new in [
              ("if cfg.Scenario == ScenarioChunkFly && samePublisher {", "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && samePublisher {"),
              ("if cfg.Scenario == ScenarioChunkFly && changedChunk {", "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && changedChunk {"),
              ("if onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {", "if onlineState && (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !time.Now().Before(nextProgress) {"),
          ]:
              if old not in text:
                  raise SystemExit(f"telemetry target not found: {old}")
              text = text.replace(old, new, 1)
          old = "\tvar publisherUpdates uint64\n\tvar postMoveUpdates uint64\n"
          new = "\tvar publisherUpdates uint64\n\tvar movePlayerUpdates uint64\n\tvar postMoveUpdates uint64\n"
          if old not in text:
              raise SystemExit("MovePlayer counter insertion target not found")
          text = text.replace(old, new, 1)
          old = "\t\tcase *packet.MovePlayer:\n\t\t\tif p.EntityRuntimeID == game.EntityRuntimeID {\n\t\t\t\tstate.update(p.Position, p.Pitch, p.Yaw, p.HeadYaw, p.Mode == packet.MoveModeTeleport)\n\t\t\t\tstate.syncServerTick(p.Tick)\n\t\t\t}\n"
          new = "\t\tcase *packet.MovePlayer:\n\t\t\tif p.EntityRuntimeID == game.EntityRuntimeID {\n\t\t\t\tmovePlayerUpdates++\n\t\t\t\tif movePlayerUpdates <= 10 || movePlayerUpdates%100 == 0 {\n\t\t\t\t\tif err := out.Emit(\"move_player\", map[string]any{\"position\": []float32{p.Position[0], p.Position[1], p.Position[2]}, \"mode\": p.Mode, \"tick\": p.Tick, \"updates\": movePlayerUpdates}); err != nil {\n\t\t\t\t\t\treturn stageError(ExitRuntime, \"output\", err)\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tstate.update(p.Position, p.Pitch, p.Yaw, p.HeadYaw, p.Mode == packet.MoveModeTeleport)\n\t\t\t\tstate.syncServerTick(p.Tick)\n\t\t\t}\n"
          if old not in text:
              raise SystemExit("MovePlayer instrumentation target not found")
          bot.write_text(text.replace(old, new, 1))
          PY
          gofmt -w bot-src/internal/bot/bot.go bot-src/internal/bot/tick.go

      - name: Build diagnostic bot
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --disable-pip-version-check psutil

      - name: Run real BDS grounded-collision diagnostic
        continue-on-error: true
        run: python -m controller.chunk_walk_validation --bot dist/bds-test-bot --count 1 --profile-seconds 10

      - name: Summarize server evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("fleet-1-chunk-walk.log")
          print("## Grounded vertical-collision server evidence")
          if not p.exists():
              print("No fleet log")
              raise SystemExit
          rows=[]
          moves=[]
          for line in p.read_text(errors="replace").splitlines():
              try: e=json.loads(line)
              except json.JSONDecodeError: continue
              if e.get("event") == "bot_progress": rows.append(e)
              if e.get("event") == "move_player": moves.append(e)
          print(f"move_player_events={len(moves)}")
          for e in moves[:10]:
              print(f"MovePlayer mode={e.get('mode')} tick={e.get('tick')} pos={e.get('position')}")
          print(f"progress_samples={len(rows)}")
          if rows:
              a,b=rows[0],rows[-1]
              for k in ("publisher_position","publisher_chunk","chunks_received","server_post_move_updates","horizontal_distance","server_corrections","tick_synced"):
                  print(f"{k}: {a.get(k)} -> {b.get(k)}")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grounded-collision-${{ github.run_id }}
          path: |
            fleet-1-chunk-walk.log
            fleet-spark-result.json
            test-results.json
            failure-diagnostics.txt
            bds.log
            endstone.log
            spark.log
          if-no-files-found: warn
          retention-days: 7
