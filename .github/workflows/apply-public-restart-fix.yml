name: Apply Windows public restart fix

on:
  push:
    branches: [fix/combined-pack-state-oracle]
    paths:
      - ".github/workflows/apply-public-restart-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/combined-pack-state-oracle

      - name: Apply focused source patch
        run: python .github/apply_public_restart_patch.py

      - name: Validate patched controller
        run: |
          python -m py_compile controller/combined_pack_gamerule_fleet_exact_runner.py
          git diff --check

      - name: Commit source patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/combined_pack_gamerule_fleet_exact_runner.py
          git rm .github/apply_public_restart_patch.py .github/workflows/apply-public-restart-fix.yml
          git commit -m "fix: reuse local pack proof on Windows public restart"
          git push origin HEAD:fix/combined-pack-state-oracle
