name: Spark Python Attribution Windows Supplemental

on:
  push:
    branches:
      - test/python-attribution-validation
    paths:
      - ".github/workflows/python-attribution-windows-supplemental.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: "b10964200f8dc3ed64e434da8edac08eabb84c41"
  BOT_REF: "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a"
  PROFILE_SECONDS: "60"
  BDS_TEST_BOT_SCENARIO_FILE: bot-src/scenarios/mixed-actions.json
  SPARK_PYTHON_HOTSPOT_ITERATIONS: "24000"

jobs:
  windows-profile:
    name: windows / ${{ matrix.mode }} / supplemental / ${{ matrix.count }} bot(s)
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: nested
            count: 1
          - mode: mixed
            count: 1
          - mode: fleet
            count: 5

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Require exact Spark CI success
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${EXPECTED_SPARK_SHA}&per_page=30")"
          build="$(jq -r '[.workflow_runs[] | select(.name == "Build")][0].conclusion // ""' <<<"$json")"
          python_ci="$(jq -r '[.workflow_runs[] | select(.name == "Python attribution")][0].conclusion // ""' <<<"$json")"
          echo "Build=$build Python=$python_ci"
          test "$build" = success
          test "$python_ci" = success

      - name: Checkout Bot at exact ref
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact Bot revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot.exe ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging hatchling

      - name: Require exact Spark artifact
        run: >-
          python -m controller.assert_spark_artifact
          --platform windows
          --expected-sha ${{ env.EXPECTED_SPARK_SHA }}

      - name: Run Windows real BDS Python attribution profile
        run: >-
          python -m controller.python_attribution_validation
          --platform windows
          --bot dist/bds-test-bot.exe
          --count ${{ matrix.count }}
          --scenario chunk-walk
          --mode ${{ matrix.mode }}
          --profile-seconds ${{ env.PROFILE_SECONDS }}

      - name: Add evidence summary
        if: always()
        shell: bash
        run: |
          if [[ -f python-attribution-result.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('python-attribution-result.json').read_text())
          summary = data.get('profile_summary') or {}
          print(f"## Windows / {data.get('hotspot_mode')} / {data.get('bot_count')} bot(s)")
          print(f"Status: **{data.get('status')}**")
          print(f"Spark URL: {data.get('spark_profile_viewer_url')}")
          print(f"Duration: {summary.get('duration_seconds')}")
          print(f"Python nodes: {summary.get('python_node_count')}")
          print(f"Python threads: {summary.get('python_threads')}")
          print(f"Diagnostics: {summary.get('python_diagnostics')}")
          PY
          fi

      - name: Upload Windows supplemental evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-attribution-windows-${{ matrix.mode }}-supplemental-${{ matrix.count }}-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            test-results.json
            python-attribution-result.json
            python-attribution-profile-summary.json
            python-attribution.sparkprofile
            python-attribution-bots-windows-${{ matrix.count }}-chunk-walk.log
            failure-diagnostics.txt
            work/windows/bedrock_server/server.properties
            work/windows/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 30
