name: BDS Integration Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "reports/**"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Headless BDS soak duration per platform"
        required: false
        default: "30"

concurrency:
  group: bds-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BDS_SOAK_MINUTES: ${{ github.event.inputs.soak_minutes || '30' }}

jobs:
  integration:
    name: BDS integration (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022

    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run extended integration test
        run: >-
          python -m controller.extended_validation
          --platform ${{ matrix.platform }}
          --soak-minutes ${{ env.BDS_SOAK_MINUTES }}

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bds-test-${{ matrix.platform }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            test-results.json
            failure-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Publish latest report
    needs: integration
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout main with report push credential
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.REPO_PAT }}
          persist-credentials: true

      - name: Download integration evidence
        uses: actions/download-artifact@v8
        with:
          pattern: bds-test-*
          path: collected

      - name: Build report
        run: >-
          python3 controller/build_extended_report.py
          --lab-commit "${{ github.sha }}"
          --lab-run-id "${{ github.run_id }}"
          --lab-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --input-root collected

      - name: Add report to Actions summary
        if: always()
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit latest report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.json reports/latest.md
          if git diff --cached --quiet; then
            echo "Report unchanged."
            exit 0
          fi
          git commit -m "ci: update integration test report [skip ci]"
          git push origin HEAD:main
