name: Mark validation PR ready

on:
  push:
    branches:
      - test/python-attribution-validation
    paths:
      - ".github/workflows/pr19-ready.yml"

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 19 ready
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: gh pr ready 19 --repo ReallocAll/bds-test-lab
