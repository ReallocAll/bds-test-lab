name: Movement Control Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/movement-control-diagnostic.yml"
      - "controller/movement_bds_only_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "c2f55ed60a74b37d3cb206ca8ed4338acfde49b5"

jobs:
  movement-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Patch settled pre-flight horizontal correction probe
        working-directory: bot-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/bot/tick.go")
          text = path.read_text()

          old = '''\t} else if s.control.fly {\n\t\tswitch {\n\t\tcase !s.flyingConfirmed:\n\t\t\tsnapshot.moveVector = mgl32.Vec2{}\n\t\tcase !s.positionReady && !s.correctionProbeSent:\n'''
          new = '''\t} else if s.control.fly {\n\t\tswitch {\n\t\tcase !s.positionReady && !s.correctionProbeSent:\n'''
          if old not in text:
              raise SystemExit("probe-order target not found")
          text = text.replace(old, new, 1)

          old = '''\t\tcase !s.positionReady:\n\t\t\tsnapshot.moveVector = mgl32.Vec2{}\n\t\tdefault:\n'''
          new = '''\t\tcase !s.positionReady:\n\t\t\tsnapshot.moveVector = mgl32.Vec2{}\n\t\tcase !s.flyingConfirmed:\n\t\t\tsnapshot.moveVector = mgl32.Vec2{}\n\t\tdefault:\n'''
          if old not in text:
              raise SystemExit("probe-order fallback target not found")
          text = text.replace(old, new, 1)

          start = text.index("func runTickLoop(")
          replacement = r'''func runTickLoop(ctx context.Context, writer packetWriter, state *playerState, cfg Config, headingYaw float32, botName string, entityRuntimeID uint64) error {
              if cfg.Scenario == ScenarioChunkWalk || cfg.Scenario == ScenarioChunkFly {
                  timer := time.NewTimer(movementStartDelay)
                  select {
                  case <-ctx.Done():
                      if !timer.Stop() {
                          <-timer.C
                      }
                      return nil
                  case <-timer.C:
                  }
              }

              if cfg.Scenario == ScenarioChunkFly && !state.positionReadySnapshot() {
                  // Match the reference client's sequencing exactly on the
                  // remaining discriminator: wait for the post-spawn settle,
                  // then send the first coherent horizontal AuthInput before
                  // RequestAbility/StartFlying.
                  state.setFlightControl(mgl32.Vec2{0, 1}, chunkFlyStepPerTick, headingYaw, chunkFlyMinimumAltitude, chunkFlyVerticalStepPerTick)
                  tick := state.nextInputTick()
                  if err := writer.WritePacket(authInputPacket(state, tick)); err != nil {
                      if ctx.Err() != nil {
                          return nil
                      }
                      return err
                  }

                  deadline := time.NewTimer(2 * time.Second)
                  poll := time.NewTicker(10 * time.Millisecond)
                  for !state.positionReadySnapshot() {
                      select {
                      case <-ctx.Done():
                          deadline.Stop()
                          poll.Stop()
                          return nil
                      case <-deadline.C:
                          poll.Stop()
                          goto bootstrapDone
                      case <-poll.C:
                      }
                  }
                  if !deadline.Stop() {
                      select {
                      case <-deadline.C:
                      default:
                      }
                  }
                  poll.Stop()
              }

          bootstrapDone:
              ticker := time.NewTicker(time.Second / 20)
              defer ticker.Stop()

              scenarioAction, err := newScenarioAction(cfg, state, headingYaw, writer, botName, entityRuntimeID)
              if err != nil {
                  return err
              }
              runner := action.NewRunner(scenarioAction)
              if err := runner.Start(ctx); err != nil {
                  return err
              }

              for {
                  select {
                  case <-ctx.Done():
                      return nil
                  case <-ticker.C:
                      tick := state.nextInputTick()
                      if err := runner.Tick(ctx, action.TickContext{Tick: tick}); err != nil {
                          return err
                      }
                      if err := writer.WritePacket(authInputPacket(state, tick)); err != nil {
                          if ctx.Err() != nil {
                              return nil
                          }
                          return err
                      }
                  }
              }
          }
          '''
          path.write_text(text[:start] + replacement)
          PY
          gofmt -w internal/bot/tick.go

      - name: Build exact diagnostic bot
        working-directory: bot-src
        shell: bash
        run: |
          go mod download
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run BDS-only authoritative chunk-fly validation
        shell: bash
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-fly

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: movement-bds-only-chunk-fly-settled-preflight-probe-${{ github.run_id }}
          path: |
            bds-only-chunk-fly.log
            test-results.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
