name: Movement Control Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/movement-control-diagnostic.yml"
      - "controller/movement_bds_only_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "c2f55ed60a74b37d3cb206ca8ed4338acfde49b5"

jobs:
  movement-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Validate exact bot baseline
        working-directory: bot-src
        shell: bash
        run: |
          go mod download
          go vet ./...
          go test ./...

      - name: Patch prepare and correction coordinate convention
        working-directory: bot-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flight = Path("internal/bot/flight.go")
          text = flight.read_text()
          old = "\t\tfloat32(position[1]) + playerEyeHeight,\n"
          new = "\t\tfloat32(position[1]) + playerEyeHeight + 0.62,\n"
          if old not in text:
              raise SystemExit("publisher Y conversion target not found")
          flight.write_text(text.replace(old, new, 1))

          bot = Path("internal/bot/bot.go")
          text = bot.read_text()
          old = '"github.com/sandertv/gophertunnel/minecraft/protocol/login"\n'
          new = '"github.com/go-gl/mathgl/mgl32"\n\t"github.com/sandertv/gophertunnel/minecraft/protocol"\n\t"github.com/sandertv/gophertunnel/minecraft/protocol/login"\n'
          if old not in text:
              raise SystemExit("imports target not found")
          text = text.replace(old, new, 1)

          old = "\t\t\tif cfg.Scenario == ScenarioChunkFly && samePublisher {\n"
          new = "\t\t\tif samePublisher {\n"
          if old not in text:
              raise SystemExit("publisher scenario gate target not found")
          text = text.replace(old, new, 1)
          old = "\t\tif onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {\n"
          new = "\t\tif onlineState && !time.Now().Before(nextProgress) {\n"
          if old not in text:
              raise SystemExit("progress scenario gate target not found")
          text = text.replace(old, new, 1)

          marker = '''\tif err := out.Emit("spawned", map[string]any{\n\t\t"x": game.PlayerPosition[0], "y": game.PlayerPosition[1], "z": game.PlayerPosition[2],\n\t}); err != nil {\n\t\treturn stageError(ExitRuntime, "output", err)\n\t}\n\n'''
          prepare = marker + '''\tfor _, pk := range []packet.Packet{\n\t\t&packet.ServerBoundLoadingScreen{Type: packet.LoadingScreenTypeStart},\n\t\t&packet.Interact{ActionType: packet.InteractActionMouseOverEntity},\n\t\t&packet.ServerBoundLoadingScreen{Type: packet.LoadingScreenTypeEnd},\n\t\t&packet.PlayerAction{EntityRuntimeID: game.EntityRuntimeID, ActionType: protocol.PlayerActionRespawn, BlockFace: -1},\n\t\t&packet.Interact{ActionType: packet.InteractActionMouseOverEntity},\n\t\t&packet.ClientCameraAimAssist{Action: packet.ClientCameraAimAssistActionClear},\n\t} {\n\t\tif err := conn.WritePacket(pk); err != nil {\n\t\t\treturn stageError(ExitRuntime, "prepare", err)\n\t\t}\n\t}\n\tif err := out.Emit("client_prepared", map[string]any{"sequence": "go-test-bds"}); err != nil {\n\t\treturn stageError(ExitRuntime, "output", err)\n\t}\n\n'''
          if marker not in text:
              raise SystemExit("prepare target not found")
          text = text.replace(marker, prepare, 1)

          old = '''\t\tcase *packet.CorrectPlayerMovePrediction:\n\t\t\tif p.PredictionType == packet.PredictionTypePlayer {\n\t\t\t\tstate.correct(p.Position, p.Rotation[0], p.Rotation[1], p.Rotation[1])\n\t\t\t\tstate.syncServerTick(p.Tick)\n\t\t\t}\n'''
          new = '''\t\tcase *packet.CorrectPlayerMovePrediction:\n\t\t\tif p.PredictionType == packet.PredictionTypePlayer {\n\t\t\t\tif err := out.Emit("server_correction", map[string]any{\n\t\t\t\t\t"position": []float32{p.Position[0], p.Position[1], p.Position[2]},\n\t\t\t\t\t"delta": []float32{p.Delta[0], p.Delta[1], p.Delta[2]},\n\t\t\t\t\t"on_ground": p.OnGround,\n\t\t\t\t\t"tick": p.Tick,\n\t\t\t\t}); err != nil {\n\t\t\t\t\treturn stageError(ExitRuntime, "output", err)\n\t\t\t\t}\n\t\t\t\t// BDS 1.26.44.3 returns entity/feet coordinates here, while\n\t\t\t\t// PlayerAuthInput requires the eye/wire position. Preserve the\n\t\t\t\t// wire-space state used by authInputPacket across corrections.\n\t\t\t\twirePosition := p.Position.Add(mgl32.Vec3{0, 1.62, 0})\n\t\t\t\tstate.correct(wirePosition, p.Rotation[0], p.Rotation[1], p.Rotation[1])\n\t\t\t\tstate.syncServerTick(p.Tick)\n\t\t\t}\n'''
          if old not in text:
              raise SystemExit("correction handler target not found")
          text = text.replace(old, new, 1)
          bot.write_text(text)
          PY
          gofmt -w internal/bot/flight.go internal/bot/bot.go
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run BDS-only authoritative chunk-walk validation
        shell: bash
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-walk

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: movement-bds-only-chunk-walk-correction-wire-space-${{ github.run_id }}
          path: |
            bds-only-chunk-walk.log
            test-results.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
