name: Movement Control Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/movement-control-diagnostic.yml"
      - "controller/movement_bds_only_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "c2f55ed60a74b37d3cb206ca8ed4338acfde49b5"

jobs:
  movement-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          token: ${{ secrets.REPO_PAT }}
          persist-credentials: true

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Patch validated production movement tuple
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          python3 - <<'PY'
          from pathlib import Path

          flight = Path("internal/bot/flight.go")
          text = flight.read_text()
          old = "\t\tfloat32(position[1]) + playerEyeHeight,\n"
          new = "\t\tfloat32(position[1]) + playerEyeHeight - 1,\n"
          if old not in text:
              raise SystemExit("publisher Y conversion target not found")
          flight.write_text(text.replace(old, new, 1))

          bot = Path("internal/bot/bot.go")
          text = bot.read_text()
          old = "\t\t\tif cfg.Scenario == ScenarioChunkFly && samePublisher {\n"
          new = "\t\t\tif (cfg.Scenario == ScenarioChunkWalk || cfg.Scenario == ScenarioChunkFly) && samePublisher {\n"
          if old not in text:
              raise SystemExit("publisher scenario gate target not found")
          text = text.replace(old, new, 1)
          old = "\t\tif onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {\n"
          new = "\t\tif onlineState && (cfg.Scenario == ScenarioChunkWalk || cfg.Scenario == ScenarioChunkFly) && !time.Now().Before(nextProgress) {\n"
          if old not in text:
              raise SystemExit("progress scenario gate target not found")
          text = text.replace(old, new, 1)

          marker = '''\tif err := out.Emit("spawned", map[string]any{\n\t\t"x": game.PlayerPosition[0], "y": game.PlayerPosition[1], "z": game.PlayerPosition[2],\n\t}); err != nil {\n\t\treturn stageError(ExitRuntime, "output", err)\n\t}\n\n'''
          prepare = marker + '''\t// BDS 1.26.44 requires the client loading-screen lifecycle to finish\n\t// before movement input is accepted consistently. Match the current\n\t// headless-client cadence rather than starting PlayerAuthInput immediately.\n\tif err := conn.WritePacket(&packet.ServerBoundLoadingScreen{Type: packet.LoadingScreenTypeStart}); err != nil {\n\t\treturn stageError(ExitRuntime, "loading-screen-start", err)\n\t}\n\tloadingTimer := time.NewTimer(140 * time.Millisecond)\n\tselect {\n\tcase <-ctx.Done():\n\t\tif !loadingTimer.Stop() {\n\t\t\t<-loadingTimer.C\n\t\t}\n\t\treturn nil\n\tcase <-loadingTimer.C:\n\t}\n\tif err := conn.WritePacket(&packet.ServerBoundLoadingScreen{Type: packet.LoadingScreenTypeEnd}); err != nil {\n\t\treturn stageError(ExitRuntime, "loading-screen-end", err)\n\t}\n\tif err := out.Emit("client_prepared", map[string]any{"sequence": "loading-screen-140ms"}); err != nil {\n\t\treturn stageError(ExitRuntime, "output", err)\n\t}\n\n'''
          if marker not in text:
              raise SystemExit("loading screen insertion target not found")
          bot.write_text(text.replace(marker, prepare, 1))

          tick = Path("internal/bot/tick.go")
          text = tick.read_text()
          old = "const chunkWalkStepPerTick = float32(0.18)\n"
          new = "const chunkWalkStepPerTick = float32(4.317 / 20)\n"
          if old not in text:
              raise SystemExit("walk speed target not found")
          text = text.replace(old, new, 1)
          old = "\tflags.Set(packet.InputFlagBlockBreakingDelayEnabled)\n"
          new = "\tflags.Set(packet.InputFlagBlockBreakingDelayEnabled)\n\tif snapshot.moveVector != (mgl32.Vec2{}) && !snapshot.flightRequested {\n\t\tflags.Set(packet.InputFlagVerticalCollision)\n\t\tsnapshot.delta[1] = -0.08 * 0.98\n\t}\n"
          if old not in text:
              raise SystemExit("input flags target not found")
          text = text.replace(old, new, 1)
          old = "\t\tInputMode:         packet.InputModeTouch,\n"
          new = "\t\tInputMode:         packet.InputModeMouse,\n"
          if old not in text:
              raise SystemExit("input mode target not found")
          text = text.replace(old, new, 1)
          old = "\t\tPlayMode:          packet.PlayModeNormal,\n"
          new = "\t\tPlayMode:          packet.PlayModeScreen,\n"
          if old not in text:
              raise SystemExit("play mode target not found")
          tick.write_text(text.replace(old, new, 1))

          tests = Path("internal/bot/flight_test.go")
          text = tests.read_text()
          old = "if input.InputMode != packet.InputModeTouch || input.PlayMode != packet.PlayModeNormal || input.InteractionModel != packet.InteractionModelTouch {"
          new = "if input.InputMode != packet.InputModeMouse || input.PlayMode != packet.PlayModeScreen || input.InteractionModel != packet.InteractionModelTouch {"
          if old not in text:
              raise SystemExit("input tuple expectation target not found")
          text = text.replace(old, new, 1)
          old = "want := mgl32.Vec3{266.5, 70 + playerEyeHeight, 159.5}"
          new = "want := mgl32.Vec3{266.5, 70 + playerEyeHeight - 1, 159.5}"
          if old not in text:
              raise SystemExit("publisher expectation target not found")
          tests.write_text(text.replace(old, new, 1))
          PY

          gofmt -w internal/bot/flight.go internal/bot/bot.go internal/bot/tick.go internal/bot/flight_test.go
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Commit validated tuple to bot PR branch
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ReallocAll"
          git config user.email "63277109+ReallocAll@users.noreply.github.com"
          git add internal/bot/flight.go internal/bot/bot.go internal/bot/tick.go internal/bot/flight_test.go
          git commit -m "fix: match BDS headless movement semantics"
          git push origin HEAD:feat/chunk-fly-scenario
          git rev-parse HEAD | tee ../landed-bot-sha.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Validate production chunk-walk
        shell: bash
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-walk

      - name: Preserve chunk-walk evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/chunk-walk
          cp -f bds-only-chunk-walk.log test-results.json bds.log evidence/chunk-walk/ 2>/dev/null || true
          cp -f failure-diagnostics.txt evidence/chunk-walk/ 2>/dev/null || true

      - name: Validate production chunk-fly
        shell: bash
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-fly

      - name: Preserve chunk-fly evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/chunk-fly
          cp -f bds-only-chunk-fly.log test-results.json bds.log evidence/chunk-fly/ 2>/dev/null || true
          cp -f failure-diagnostics.txt evidence/chunk-fly/ 2>/dev/null || true

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-movement-tuple-${{ github.run_id }}
          path: |
            landed-bot-sha.txt
            evidence/
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
