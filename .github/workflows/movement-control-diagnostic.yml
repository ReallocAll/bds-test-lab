name: Movement Control Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/movement-control-diagnostic.yml"
      - "controller/movement_bds_only_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "c2f55ed60a74b37d3cb206ca8ed4338acfde49b5"

jobs:
  movement-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Validate exact bot baseline
        working-directory: bot-src
        shell: bash
        run: |
          go mod download
          go vet ./...
          go test ./...

      - name: Patch 40-frame idle rewind bootstrap
        working-directory: bot-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flight = Path("internal/bot/flight.go")
          text = flight.read_text()
          old = "\t\tfloat32(position[1]) + playerEyeHeight,\n"
          new = "\t\tfloat32(position[1]) + playerEyeHeight - 1,\n"
          if old not in text:
              raise SystemExit("publisher Y conversion target not found")
          flight.write_text(text.replace(old, new, 1))

          bot = Path("internal/bot/bot.go")
          text = bot.read_text()
          old = "\t\t\tif cfg.Scenario == ScenarioChunkFly && samePublisher {\n"
          new = "\t\t\tif samePublisher {\n"
          if old not in text:
              raise SystemExit("publisher scenario gate target not found")
          text = text.replace(old, new, 1)
          old = "\t\tif onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {\n"
          new = "\t\tif onlineState && !time.Now().Before(nextProgress) {\n"
          if old not in text:
              raise SystemExit("progress scenario gate target not found")
          text = text.replace(old, new, 1)
          old = "\tgame := conn.GameData()\n\tstats.StartPosition = game.PlayerPosition\n"
          new = "\tgame := conn.GameData()\n\tif err := out.Emit(\"movement_settings\", map[string]any{\"rewind_history_size\": game.PlayerMovementSettings.RewindHistorySize, \"server_authoritative_block_breaking\": game.PlayerMovementSettings.ServerAuthoritativeBlockBreaking, \"world_time\": game.Time}); err != nil {\n\t\treturn stageError(ExitRuntime, \"output\", err)\n\t}\n\tstats.StartPosition = game.PlayerPosition\n"
          if old not in text:
              raise SystemExit("game data telemetry target not found")
          bot.write_text(text.replace(old, new, 1))

          tick = Path("internal/bot/tick.go")
          text = tick.read_text()
          old = "const chunkWalkStepPerTick = float32(0.18)\n"
          new = "const chunkWalkStepPerTick = float32(4.317 / 20)\n"
          if old not in text:
              raise SystemExit("walk speed target not found")
          text = text.replace(old, new, 1)
          baseline = "\tflags.Set(packet.InputFlagBlockBreakingDelayEnabled)\n"
          if baseline not in text:
              raise SystemExit("baseline input flag target not found")
          text = text.replace(baseline, "", 1)
          state_ctor = "\treturn &playerState{\n\t\tposition:"
          if state_ctor not in text:
              raise SystemExit("player state constructor target not found")
          text = text.replace(state_ctor, "\treturn &playerState{\n\t\tserverTick: 1,\n\t\tposition:", 1)

          start = text.index("func runTickLoop(")
          replacement = r'''func runTickLoop(ctx context.Context, writer packetWriter, state *playerState, cfg Config, headingYaw float32, botName string, entityRuntimeID uint64) error {
              if cfg.Scenario == ScenarioChunkWalk {
                  positionDeadline := time.NewTimer(2 * time.Second)
                  positionPoll := time.NewTicker(10 * time.Millisecond)
                  for !state.positionReadySnapshot() {
                      select {
                      case <-ctx.Done():
                          positionDeadline.Stop()
                          positionPoll.Stop()
                          return nil
                      case <-positionDeadline.C:
                          positionPoll.Stop()
                          return context.DeadlineExceeded
                      case <-positionPoll.C:
                      }
                  }
                  if !positionDeadline.Stop() {
                      select {
                      case <-positionDeadline.C:
                      default:
                      }
                  }
                  positionPoll.Stop()

                  idleTicker := time.NewTicker(time.Second / 20)
                  for i := 0; i < 40; i++ {
                      select {
                      case <-ctx.Done():
                          idleTicker.Stop()
                          return nil
                      case <-idleTicker.C:
                          tick := state.nextInputTick()
                          if err := writer.WritePacket(authInputPacket(state, tick)); err != nil {
                              idleTicker.Stop()
                              if ctx.Err() != nil {
                                  return nil
                              }
                              return err
                          }
                      }
                  }
                  idleTicker.Stop()
              }

              if cfg.Scenario == ScenarioChunkFly {
                  tick := state.nextInputTick()
                  if err := writer.WritePacket(authInputPacket(state, tick)); err != nil {
                      if ctx.Err() != nil {
                          return nil
                      }
                      return err
                  }
              }

              ticker := time.NewTicker(time.Second / 20)
              defer ticker.Stop()

              scenarioAction, err := newScenarioAction(cfg, state, headingYaw, writer, botName, entityRuntimeID)
              if err != nil {
                  return err
              }
              runner := action.NewRunner(scenarioAction)
              if err := runner.Start(ctx); err != nil {
                  return err
              }

              for {
                  select {
                  case <-ctx.Done():
                      return nil
                  case <-ticker.C:
                      tick := state.nextInputTick()
                      if err := runner.Tick(ctx, action.TickContext{Tick: tick}); err != nil {
                          return err
                      }
                      if err := writer.WritePacket(authInputPacket(state, tick)); err != nil {
                          if ctx.Err() != nil {
                              return nil
                          }
                          return err
                      }
                  }
              }
          }
          '''
          text = text[:start] + replacement
          tick.write_text(text)
          PY
          gofmt -w internal/bot/flight.go internal/bot/bot.go internal/bot/tick.go
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run BDS-only authoritative chunk-walk validation
        shell: bash
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-walk

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: movement-bds-only-chunk-walk-rewind-bootstrap-${{ github.run_id }}
          path: |
            bds-only-chunk-walk.log
            test-results.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
