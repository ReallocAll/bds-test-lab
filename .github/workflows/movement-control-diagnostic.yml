name: Movement Control Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/movement-control-diagnostic.yml"
      - "controller/movement_bds_only_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "cde6b2468f51a12a26d14d550490f02662573fc3"

jobs:
  movement-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Validate exact bot baseline
        working-directory: bot-src
        shell: bash
        run: |
          go mod download
          go vet ./...
          go test ./...

      - name: Patch correction-bootstrap movement probe
        working-directory: bot-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("internal/bot/tick.go")
          text = path.read_text()

          pattern = r'''func \(s \*playerState\) acceptPublisherPosition\(position mgl32\.Vec3\) bool \{.*?\n\}\n\n'''
          replacement = '''func (s *playerState) acceptPublisherPosition(position mgl32.Vec3) bool {\n\t// Diagnostic variant: publisher position is observability only. Require a\n\t// real server movement/correction packet before prediction becomes ready.\n\treturn false\n}\n\n'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"publisher seed replacement count={count}")

          old = '''\tif cfg.Scenario == ScenarioChunkWalk || cfg.Scenario == ScenarioChunkFly {\n\t\ttimer := time.NewTimer(movementStartDelay)\n\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\tif !timer.Stop() {\n\t\t\t\t<-timer.C\n\t\t\t}\n\t\t\treturn nil\n\t\tcase <-timer.C:\n\t\t}\n\t}\n'''
          new = '''\tif cfg.Scenario == ScenarioChunkFly {\n\t\t// A current protocol-2168 reference client receives its initial\n\t\t// CorrectPlayerMovePrediction only after its first non-zero movement\n\t\t// frame. Send one tiny walking probe from StartGame's placeholder state,\n\t\t// then return to idle while BDS supplies the authoritative position.\n\t\tstate.setMoveControl(mgl32.Vec2{0, 1}, chunkWalkStepPerTick, headingYaw)\n\t\tprobeTick := state.nextInputTick()\n\t\tif err := writer.WritePacket(authInputPacket(state, probeTick)); err != nil {\n\t\t\tif ctx.Err() != nil {\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\treturn err\n\t\t}\n\t\tstate.clearMoveControl()\n\n\t\tsettleTicker := time.NewTicker(time.Second / 20)\n\t\tsettleTimer := time.NewTimer(movementStartDelay)\n\t\tsettling := true\n\t\tfor settling {\n\t\t\tselect {\n\t\t\tcase <-ctx.Done():\n\t\t\t\tsettleTicker.Stop()\n\t\t\t\tif !settleTimer.Stop() {\n\t\t\t\t\t<-settleTimer.C\n\t\t\t\t}\n\t\t\t\treturn nil\n\t\t\tcase <-settleTicker.C:\n\t\t\t\ttick := state.nextInputTick()\n\t\t\t\tif err := writer.WritePacket(authInputPacket(state, tick)); err != nil {\n\t\t\t\t\tsettleTicker.Stop()\n\t\t\t\t\tif !settleTimer.Stop() {\n\t\t\t\t\t\t<-settleTimer.C\n\t\t\t\t\t}\n\t\t\t\t\tif ctx.Err() != nil {\n\t\t\t\t\t\treturn nil\n\t\t\t\t\t}\n\t\t\t\t\treturn err\n\t\t\t\t}\n\t\t\tcase <-settleTimer.C:\n\t\t\t\tsettling = false\n\t\t\t}\n\t\t}\n\t\tsettleTicker.Stop()\n\t} else if cfg.Scenario == ScenarioChunkWalk {\n\t\ttimer := time.NewTimer(movementStartDelay)\n\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\tif !timer.Stop() {\n\t\t\t\t<-timer.C\n\t\t\t}\n\t\t\treturn nil\n\t\tcase <-timer.C:\n\t\t}\n\t}\n'''
          if old not in text:
              raise SystemExit("movement settle block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/bot/tick.go
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run BDS-only authoritative chunk-fly validation
        shell: bash
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-fly

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: movement-bds-only-chunk-fly-${{ github.run_id }}
          path: |
            bds-only-chunk-fly.log
            test-results.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
