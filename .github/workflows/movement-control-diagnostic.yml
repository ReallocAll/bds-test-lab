name: Movement Control Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/movement-control-diagnostic.yml"
      - "controller/movement_bds_only_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "c2f55ed60a74b37d3cb206ca8ed4338acfde49b5"

jobs:
  movement-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant:
          - wire-y
          - wire-y-prepare
          - prepare-old-y

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Validate exact bot baseline
        working-directory: bot-src
        shell: bash
        run: |
          go mod download
          go vet ./...
          go test ./...

      - name: Patch wire position and prepare sequence
        working-directory: bot-src
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          variant = os.environ["VARIANT"]

          flight = Path("internal/bot/flight.go")
          text = flight.read_text()
          old = "\t\tfloat32(position[1]) + playerEyeHeight,\n"
          if variant in {"wire-y", "wire-y-prepare"}:
              # NetworkChunkPublisherUpdate block Y -> querytarget/server entity Y
              # is +0.62 on BDS. PlayerAuthInput wire position is another +1.62
              # above server entity position (Dragonfly's server handler subtracts
              # 1.62 before applying movement), so the total is blockY + 2.24.
              new = "\t\tfloat32(position[1]) + playerEyeHeight + 0.62,\n"
          else:
              # Control: the previously tested querytarget-aligned value.
              new = "\t\tfloat32(position[1]) + playerEyeHeight - 1,\n"
          if old not in text:
              raise SystemExit("publisher Y conversion target not found")
          flight.write_text(text.replace(old, new, 1))

          bot = Path("internal/bot/bot.go")
          text = bot.read_text()
          old = '"github.com/sandertv/gophertunnel/minecraft/protocol/login"\n'
          new = '"github.com/sandertv/gophertunnel/minecraft/protocol"\n\t"github.com/sandertv/gophertunnel/minecraft/protocol/login"\n'
          if variant in {"wire-y-prepare", "prepare-old-y"}:
              if old not in text:
                  raise SystemExit("protocol import target not found")
              text = text.replace(old, new, 1)

          old = "\t\t\tif cfg.Scenario == ScenarioChunkFly && samePublisher {\n"
          new = "\t\t\tif samePublisher {\n"
          if old not in text:
              raise SystemExit("publisher scenario gate target not found")
          text = text.replace(old, new, 1)
          old = "\t\tif onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {\n"
          new = "\t\tif onlineState && !time.Now().Before(nextProgress) {\n"
          if old not in text:
              raise SystemExit("progress scenario gate target not found")
          text = text.replace(old, new, 1)

          old = "\tgame := conn.GameData()\n\tstats.StartPosition = game.PlayerPosition\n"
          new = "\tgame := conn.GameData()\n\tif err := out.Emit(\"movement_settings\", map[string]any{\"rewind_history_size\": game.PlayerMovementSettings.RewindHistorySize, \"server_authoritative_block_breaking\": game.PlayerMovementSettings.ServerAuthoritativeBlockBreaking, \"world_time\": game.Time}); err != nil {\n\t\treturn stageError(ExitRuntime, \"output\", err)\n\t}\n\tstats.StartPosition = game.PlayerPosition\n"
          if old not in text:
              raise SystemExit("movement settings target not found")
          text = text.replace(old, new, 1)

          if variant in {"wire-y-prepare", "prepare-old-y"}:
              marker = '''\tif err := out.Emit("spawned", map[string]any{\n\t\t"x": game.PlayerPosition[0], "y": game.PlayerPosition[1], "z": game.PlayerPosition[2],\n\t}); err != nil {\n\t\treturn stageError(ExitRuntime, "output", err)\n\t}\n\n'''
              prepare = marker + '''\t// Mirror go-test-bds Actor.prepare(): these packets are sent immediately\n\t// after DoSpawn and before its two-second movement settle.\n\tfor _, pk := range []packet.Packet{\n\t\t&packet.ServerBoundLoadingScreen{Type: packet.LoadingScreenTypeStart},\n\t\t&packet.Interact{ActionType: packet.InteractActionMouseOverEntity},\n\t\t&packet.ServerBoundLoadingScreen{Type: packet.LoadingScreenTypeEnd},\n\t\t&packet.PlayerAction{EntityRuntimeID: game.EntityRuntimeID, ActionType: protocol.PlayerActionRespawn, BlockFace: -1},\n\t\t&packet.Interact{ActionType: packet.InteractActionMouseOverEntity},\n\t\t&packet.ClientCameraAimAssist{Action: packet.ClientCameraAimAssistActionClear},\n\t} {\n\t\tif err := conn.WritePacket(pk); err != nil {\n\t\t\treturn stageError(ExitRuntime, "prepare", err)\n\t\t}\n\t}\n\tif err := out.Emit("client_prepared", map[string]any{"sequence": "go-test-bds"}); err != nil {\n\t\treturn stageError(ExitRuntime, "output", err)\n\t}\n\n'''
              if marker not in text:
                  raise SystemExit("prepare insertion target not found")
              text = text.replace(marker, prepare, 1)

          bot.write_text(text)
          PY
          gofmt -w internal/bot/flight.go internal/bot/bot.go
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run BDS-only authoritative chunk-walk validation
        shell: bash
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-walk

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: movement-bds-only-chunk-walk-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            bds-only-chunk-walk.log
            test-results.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
