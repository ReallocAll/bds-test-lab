name: Movement Control Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/movement-control-diagnostic.yml"
      - "controller/movement_bds_only_validation.py"
      - "controller/patch_gophertunnel_spawn.py"
      - "controller/patch_bot_publisher_eye.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "b76da26e01b85384487a2147e8f9aa81809a6c8b"

jobs:
  movement-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [chunk-walk, chunk-fly]

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Patch authoritative traversal seed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bot = Path("bot-src/internal/bot/bot.go")
          text = bot.read_text()
          old = "if cfg.Scenario == ScenarioChunkFly && samePublisher {"
          new = "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && samePublisher {"
          if old not in text:
              raise SystemExit("publisher seed target not found")
          text = text.replace(old, new, 1)
          old = "if cfg.Scenario == ScenarioChunkFly && changedChunk {"
          new = "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && changedChunk {"
          if old not in text:
              raise SystemExit("publisher telemetry target not found")
          bot.write_text(text.replace(old, new, 1))
          PY
          python3 controller/patch_bot_publisher_eye.py bot-src

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Patch gophertunnel full spawn ordering
        working-directory: bot-src
        shell: bash
        run: |
          go mod download github.com/sandertv/gophertunnel@v1.59.0
          moddir="$(go env GOMODCACHE)/github.com/sandertv/gophertunnel@v1.59.0"
          rm -rf ../gophertunnel-patched
          cp -a "$moddir" ../gophertunnel-patched
          chmod -R u+w ../gophertunnel-patched
          python3 ../controller/patch_gophertunnel_spawn.py ../gophertunnel-patched/minecraft/conn.go
          gofmt -w ../gophertunnel-patched/minecraft/conn.go internal/bot/bot.go internal/bot/flight.go
          go mod edit -replace github.com/sandertv/gophertunnel=../gophertunnel-patched

      - name: Build diagnostic bot
        working-directory: bot-src
        shell: bash
        run: |
          go mod tidy
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run BDS-only authoritative movement validation
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario "$SCENARIO"

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: movement-bds-only-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            bds-only-${{ matrix.scenario }}.log
            test-results.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
