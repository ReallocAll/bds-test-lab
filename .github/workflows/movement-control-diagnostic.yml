name: Movement Control Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/movement-control-diagnostic.yml"
      - "controller/movement_bds_only_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"
  BOT_REF: "cde6b2468f51a12a26d14d550490f02662573fc3"

jobs:
  movement-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [vertical-collision, input-vectors, vertical-collision-input-vectors]

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact bot revision
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Validate exact bot baseline
        working-directory: bot-src
        shell: bash
        run: |
          go mod download
          go vet ./...
          go test ./...

      - name: Patch movement semantics variant
        working-directory: bot-src
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          variant = os.environ["VARIANT"]
          path = Path("internal/bot/tick.go")
          text = path.read_text()

          if variant in {"vertical-collision", "vertical-collision-input-vectors"}:
              anchor = "\tflags.Set(packet.InputFlagBlockBreakingDelayEnabled)\n"
              if anchor not in text:
                  raise SystemExit("baseline flag anchor not found")
              text = text.replace(anchor, anchor + "\tflags.Set(packet.InputFlagVerticalCollision)\n", 1)

          if variant in {"input-vectors", "vertical-collision-input-vectors"}:
              old = '''\tmoveVector := snapshot.moveVector\n\trawMoveVector := mgl32.Vec2{}\n\tif lengthSquared := moveVector.LenSqr(); lengthSquared > 0 {\n\t\tmoveVector = moveVector.Mul(1 / float32(math.Sqrt(float64(lengthSquared))))\n\t\thorizontalDelta := float32(math.Hypot(float64(snapshot.delta[0]), float64(snapshot.delta[2])))\n\t\trawMoveVector = moveVector.Mul(horizontalDelta)\n\t}\n'''
              new = '''\tmoveVector := snapshot.moveVector\n\tif lengthSquared := moveVector.LenSqr(); lengthSquared > 0 {\n\t\tmoveVector = moveVector.Mul(1 / float32(math.Sqrt(float64(lengthSquared))))\n\t}\n\trawMoveVector := moveVector\n\tanalogueMoveVector := moveVector\n'''
              if old not in text:
                  raise SystemExit("raw move vector block not found")
              text = text.replace(old, new, 1)
              old_field = "\t\tRawMoveVector:     rawMoveVector,\n"
              new_field = "\t\tAnalogueMoveVector: analogueMoveVector,\n\t\tRawMoveVector:      rawMoveVector,\n"
              if old_field not in text:
                  raise SystemExit("raw move vector field not found")
              text = text.replace(old_field, new_field, 1)

          path.write_text(text)
          PY
          gofmt -w internal/bot/tick.go
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run BDS-only authoritative chunk-walk validation
        shell: bash
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-walk

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: movement-bds-only-chunk-walk-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            bds-only-chunk-walk.log
            test-results.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
