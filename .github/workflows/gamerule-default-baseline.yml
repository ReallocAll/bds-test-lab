name: Gamerule Default Baseline

on:
  push:
    branches:
      - main
    paths:
      - controller/gamerule_default_baseline.py
      - .github/workflows/gamerule-default-baseline.yml
      - gamerule-default-trigger.json

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      EXPECTED_SPARK_SHA: 5d19837d15aacfc93a72484c915f787630a3261d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging
      - name: Require exact Spark artifact
        run: python -m controller.assert_spark_artifact --platform linux --expected-sha "$EXPECTED_SPARK_SHA"
      - name: Query fresh-world gamerule defaults
        run: python -m controller.gamerule_default_baseline
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamerule-default-baseline-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            test-results.json
            failure-diagnostics.txt
            work/linux/bedrock_server/server.properties
            work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 30
