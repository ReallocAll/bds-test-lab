name: Spark restore valid tags

on:
  push:
    paths:
      - .github/workflows/spark-restore-valid-tags.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.REPO_PAT }}
      TARGET_REPO: ReallocAll/spark
    steps:
      - name: Restore previously valid tags exactly
        shell: bash
        run: |
          set -euo pipefail
          declare -A tags=(
            [v0.4.1]=5d1994245d85f8242be54f25c631becd63d6f8da
            [v0.5.0]=41eafb2f4f1eeb905d0808a562cfa220181303fc
            [v0.5.1]=30efe38db527d2a6aa932597b747e098c7cd97c7
            [v0.5.2]=d1ee51f87e17409c4fc51e0d81bf9194fd714011
          )
          for tag in v0.4.1 v0.5.0 v0.5.1 v0.5.2; do
            want=${tags[$tag]}
            got=$(gh api "repos/$TARGET_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
            if [[ -z "$got" ]]; then
              gh api -X POST "repos/$TARGET_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$want" >/dev/null
              echo "restored $tag -> $want"
            else
              test "$got" = "$want"
              echo "kept $tag -> $got"
            fi
          done
          if gh api "repos/$TARGET_REPO/git/ref/tags/v0.6.0" >/dev/null 2>&1; then
            echo 'unexpected v0.6.0 tag exists' >&2
            exit 1
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/heads/main --jq .object.sha)" = 58d40317f97594fbb6d31a93086aed5c0460acce
          test "$(gh api repos/$TARGET_REPO/git/ref/heads/develop --jq .object.sha)" = 8cb5c2b651a8c9808da397e6957526f87c1fe712
