name: Spark restore valid tags

on:
  push:
    paths:
      - .github/workflows/spark-restore-valid-tags.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.REPO_PAT }}
      TARGET_REPO: ReallocAll/spark
    steps:
      - name: Restore previously valid tags exactly
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" spark
          cd spark
          git fetch --quiet origin --tags
          declare -A tags=(
            [v0.4.1]=5d1994245d85f8242be54f25c631becd63d6f8da
            [v0.5.0]=41eafb2f4f1eeb905d0808a562cfa220181303fc
            [v0.5.1]=30efe38db527d2a6aa932597b747e098c7cd97c7
            [v0.5.2]=d1ee51f87e17409c4fc51e0d81bf9194fd714011
          )
          for tag in v0.4.1 v0.5.0 v0.5.1 v0.5.2; do
            want=${tags[$tag]}
            git cat-file -e "${want}^{commit}"
            got=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
            if [[ -z "$got" ]]; then
              git push --quiet origin "${want}:refs/tags/${tag}"
              echo "restored $tag -> $want"
            else
              test "$got" = "$want"
              echo "kept $tag -> $got"
            fi
          done
          test -z "$(git ls-remote --tags origin refs/tags/v0.6.0)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = 58d40317f97594fbb6d31a93086aed5c0460acce
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = 8cb5c2b651a8c9808da397e6957526f87c1fe712
