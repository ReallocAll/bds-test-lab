name: Apply Windows allocation validation

on:
  push:
    branches:
      - fix/windows-allocation-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Require Windows allocation profiling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('controller/run_test.py')
          text = path.read_text()
          old = '''        if allocation and self.platform == "windows":\n            output = self.server.wait_command_output(start, 8)\n            joined = "\\n".join(output).lower()\n            disabled_hints = ("not supported", "unsupported", "disabled", "unavailable", "windows")\n            if not self.server.is_alive():\n                raise RuntimeError("Windows allocation profiler crashed the server")\n            if not any(hint in joined for hint in disabled_hints):\n                try:\n                    self.server.command("spark profiler cancel")\n                except Exception:\n                    pass\n                raise RuntimeError("Windows allocation profiler did not return an explicit disabled/unsupported response")\n            self.check("allocation-profiler", "PASS", "explicitly disabled on Windows", expected_disabled=True)\n            return None\n'''
          if old not in text:
              raise SystemExit('Windows expected-disabled allocation branch not found')
          path.write_text(text.replace(old, '', 1))
          PY
          python -m py_compile controller/run_test.py
          git diff --check

      - name: Commit validation change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/run_test.py
          git diff --cached --quiet && exit 0
          git commit -m "test: require Windows allocation profiling success"
          git push origin "HEAD:${GITHUB_REF_NAME}"
