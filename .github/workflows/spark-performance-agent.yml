name: Spark Performance Agent

on:
  push:
    branches:
      - perf/spark-overhead
  workflow_dispatch:

concurrency:
  group: spark-performance-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BASELINE_SHA: "15b79e814ee6542f8a2382df09353e9c2009c8d1"
  CURRENT_SHA: "78314038b67d506ec48da9a61181c0048fb3658e"
  BOT_REF: "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a"
  BDS_TEST_BOT_SCENARIO_FILE: bot-src/scenarios/mixed-actions.json
  DURATION_SECONDS: "180"

jobs:
  paired-python:
    name: Linux paired Python attribution A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7

      - name: Verify exact Spark artifacts
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$BASELINE_SHA" "$CURRENT_SHA"; do
            json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${sha}&status=success&per_page=30")"
            run_id="$(jq -r '[.workflow_runs[] | select(.name == "Build" and .conclusion == "success")][0].id // empty' <<<"$json")"
            if [[ -z "$run_id" ]]; then
              echo "No successful Build run for ${sha}" >&2
              exit 1
            fi
            echo "Exact Spark Build: sha=$sha run=$run_id"
          done

      - name: Checkout exact bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact bot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging hatchling

      - name: Run five interleaved baseline/current pairs
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p evidence
          printf 'rep\tmode\ttarget\tsha\tlabel\tcontroller_exit_code\tstatus\n' > evidence/case-status.tsv
          overall=0
          modes=(off shadow full)

          copy_if_present() {
            local source="$1"
            local target="$2"
            [[ -e "$source" ]] || return 0
            cp -a "$source" "$target"
          }

          run_case() {
            local rep="$1" mode="$2" target="$3" sha="$4"
            local label="rep${rep}-${mode}-${target}"
            local case_dir="evidence/$label"
            echo "===== $label sha=$sha ====="
            mkdir -p "$case_dir"
            rm -rf downloads work hotspot-wheel
            rm -f metadata.json bds.log endstone.log spark.log test-results.json \
              python-attribution-result.json python-attribution-performance.json \
              python-attribution-tick-metrics.json python-attribution-performance.sparkprofile \
              python-attribution-bots-linux-5-chunk-walk.log failure-diagnostics.txt

            EXPECTED_SPARK_SHA="$sha" python -m controller.python_attribution_performance_runner \
              --platform linux \
              --bot dist/bds-test-bot \
              --count 5 \
              --mode "$mode" \
              --duration-seconds "$DURATION_SECONDS" 2>&1 | tee "$case_dir/controller-output.log"
            pipeline_status=("${PIPESTATUS[@]}")
            controller_exit="${pipeline_status[0]}"
            tee_exit="${pipeline_status[1]}"
            copy_failed=0
            for path in metadata.json bds.log endstone.log spark.log test-results.json \
              python-attribution-result.json python-attribution-performance.json \
              python-attribution-tick-metrics.json python-attribution-performance.sparkprofile \
              python-attribution-bots-linux-5-chunk-walk.log failure-diagnostics.txt; do
              if [[ -e "$path" ]] && ! copy_if_present "$path" "$case_dir/"; then
                copy_failed=1
              fi
            done
            if [[ -f work/linux/bedrock_server/version.txt ]]; then
              copy_if_present work/linux/bedrock_server/version.txt "$case_dir/bds-version.txt" || copy_failed=1
            fi
            if [[ -f work/linux/bedrock_server/server.properties ]]; then
              copy_if_present work/linux/bedrock_server/server.properties "$case_dir/server.properties" || copy_failed=1
            fi
            status=PASS
            if [[ "$controller_exit" -ne 0 || "$tee_exit" -ne 0 || "$copy_failed" -ne 0 ]]; then
              status=FAIL
              overall=1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$rep" "$mode" "$target" "$sha" "$label" "$controller_exit" "$status" >> evidence/case-status.tsv
          }

          for rep in 1 2 3 4 5; do
            for mode in "${modes[@]}"; do
              if (( rep % 2 == 1 )); then
                run_case "$rep" "$mode" baseline "$BASELINE_SHA"
                run_case "$rep" "$mode" current "$CURRENT_SHA"
              else
                run_case "$rep" "$mode" current "$CURRENT_SHA"
                run_case "$rep" "$mode" baseline "$BASELINE_SHA"
              fi
            done
          done
          exit "$overall"

      - name: Validate paired evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import statistics
          import sys

          root = pathlib.Path('evidence')
          status_path = root / 'case-status.tsv'
          problems = []
          if not status_path.is_file():
              raise SystemExit('missing case-status.tsv')
          rows = []
          for line in status_path.read_text(encoding='utf-8').splitlines()[1:]:
              if not line:
                  continue
              fields = line.split('\t')
              if len(fields) != 7:
                  problems.append(f'malformed status row: {line!r}')
                  continue
              rep, mode, target, sha, label, exit_code, status = fields
              rows.append((int(rep), mode, target, sha, label, int(exit_code), status))
          expected = {(rep, mode, target) for rep in range(1, 6) for mode in ('off', 'shadow', 'full') for target in ('baseline', 'current')}
          actual = {(r[0], r[1], r[2]) for r in rows}
          if actual != expected:
              problems.append(f'case set mismatch missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          endstone_shas = set()
          spark_shas = {'baseline': set(), 'current': set()}
          metrics = {}
          for rep, mode, target, sha, label, exit_code, status in rows:
              case = root / label
              result_path = case / 'python-attribution-performance.json'
              meta_path = case / 'metadata.json'
              if exit_code != 0 or status != 'PASS':
                  problems.append(f'{label}: exit={exit_code} status={status}')
                  continue
              if not result_path.is_file() or not meta_path.is_file():
                  problems.append(f'{label}: missing result or metadata')
                  continue
              data = json.loads(result_path.read_text(encoding='utf-8'))
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              components = meta.get('components', {})
              observed_spark = str((components.get('spark') or {}).get('sha') or '')
              observed_endstone = str((components.get('endstone') or {}).get('sha') or '')
              spark_shas[target].add(observed_spark)
              endstone_shas.add(observed_endstone)
              if observed_spark != sha:
                  problems.append(f'{label}: Spark SHA {observed_spark} != expected {sha}')
              perf = data.get('performance') or {}
              tick = perf.get('tick_statistics') or {}
              metrics[(rep, mode, target)] = {
                  'cpu': float(perf['process_cpu_percent_of_one_core']),
                  'cpu_mspt': float(perf['cpu_ms_per_tick']),
                  'mspt': float(tick['mspt_mean']),
                  'viewer': perf.get('viewer_url'),
                  'shadow': perf.get('shadow_only_diagnostics'),
              }
          if len(endstone_shas) != 1:
              problems.append(f'Endstone SHA drift across paired run: {sorted(endstone_shas)}')
          if spark_shas['baseline'] != {'15b79e814ee6542f8a2382df09353e9c2009c8d1'}:
              problems.append(f'baseline SHA mismatch: {spark_shas["baseline"]}')
          if spark_shas['current'] != {'78314038b67d506ec48da9a61181c0048fb3658e'}:
              problems.append(f'current SHA mismatch: {spark_shas["current"]}')

          summary = {'endstone_shas': sorted(endstone_shas), 'metrics': {}}
          for mode in ('off', 'shadow', 'full'):
              mode_summary = {}
              for target in ('baseline', 'current'):
                  vals = [metrics[(rep, mode, target)]['cpu'] for rep in range(1, 6) if (rep, mode, target) in metrics]
                  if len(vals) == 5:
                      mode_summary[target] = {
                          'cpu_mean': statistics.fmean(vals),
                          'cpu_median': statistics.median(vals),
                          'cpu_sd': statistics.stdev(vals),
                          'cpu_cv_percent': statistics.stdev(vals) / statistics.fmean(vals) * 100.0,
                          'cpu_min': min(vals),
                          'cpu_max': max(vals),
                      }
              deltas = []
              for rep in range(1, 6):
                  b = metrics.get((rep, mode, 'baseline'))
                  c = metrics.get((rep, mode, 'current'))
                  if b and c:
                      deltas.append(c['cpu'] - b['cpu'])
              if len(deltas) == 5:
                  mode_summary['paired_current_minus_baseline'] = {
                      'values': deltas,
                      'mean': statistics.fmean(deltas),
                      'median': statistics.median(deltas),
                      'sd': statistics.stdev(deltas),
                  }
              summary['metrics'][mode] = mode_summary

          # Difference-in-differences isolates Python shadow bookkeeping from workload drift.
          did = []
          for rep in range(1, 6):
              bo = metrics.get((rep, 'off', 'baseline'))
              bs = metrics.get((rep, 'shadow', 'baseline'))
              co = metrics.get((rep, 'off', 'current'))
              cs = metrics.get((rep, 'shadow', 'current'))
              if bo and bs and co and cs:
                  did.append((cs['cpu'] - co['cpu']) - (bs['cpu'] - bo['cpu']))
          if len(did) == 5:
              summary['shadow_overhead_difference_in_differences'] = {
                  'values': did,
                  'mean': statistics.fmean(did),
                  'median': statistics.median(did),
                  'sd': statistics.stdev(did),
              }
          (root / 'paired-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          if problems:
              print('Evidence validation failed:', file=sys.stderr)
              for problem in problems:
                  print(f'- {problem}', file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-performance-paired-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
