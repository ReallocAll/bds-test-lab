name: Spark alloc-live real-BDS premerge

on:
  pull_request:
    branches:
      - main
    paths:
      - controller/final_profiler_matrix.py
      - tests/test_final_profiler_matrix.py
      - fixtures/spark-allocation-live-test/**
      - .github/workflows/alloc-live-premerge.yml

concurrency:
  group: spark-alloc-live-premerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  # Pin production inputs so a harness-only PR cannot silently validate a different Spark or bot revision.
  # Bump these pins when the accepted production Spark/bot refs move.
  SPARK_SHA: cde587a3f0e31e7fc03bca012b2b09e86c6185ab
  BOT_REF: b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a

jobs:
  alloc-live:
    name: Linux Spark profiler (alloc-live-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record exact harness revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "${actual,,}" = "${expected,,}"
          echo "LAB_SHA=$actual" >> "$GITHUB_ENV"
          echo "Harness SHA: $actual"

      - name: Checkout bot at exact SHA
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build and record exact bot revision
        shell: bash
        run: |
          set -euo pipefail
          cd bot-src
          actual_bot_sha="$(git rev-parse HEAD)"
          test "${actual_bot_sha,,}" = "${BOT_REF,,}"
          go mod download
          go test ./...
          go build -trimpath -o ../dist-bds-test-bot ./cmd/bds-test-bot
          chmod +x ../dist-bds-test-bot
          echo "BOT_SHA=$actual_bot_sha" >> "$GITHUB_ENV"
          echo "Bot SHA: $actual_bot_sha"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil hatchling

      - name: Require exact Spark artifact
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: >-
          python -m controller.assert_spark_artifact
          --platform linux
          --expected-sha "$SPARK_SHA"

      - name: Run strict real-BDS alloc-live-only case
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: >-
          python -m controller.final_profiler_matrix
          --mode alloc-live-only
          --bot "$GITHUB_WORKSPACE/dist-bds-test-bot"
          --spark-sha "$SPARK_SHA"
          --bot-ref "$BOT_REF"
          --evidence-root evidence

      - name: Verify canonical bStats evidence
        if: always()
        run: >-
          python -m controller.verify_bstats_evidence
          --result evidence/alloc-live-only/test-results.json

      - name: Add strict evidence summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("evidence/alloc-live-only/test-results.json")
          print("## Spark alloc-live-only premerge")
          print()
          print(f"Harness SHA: `{Path('.git/HEAD').read_text(encoding='utf-8').strip()}`")
          if not path.is_file():
              print("Result: **missing**")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              provenance = data.get("provenance") or {}
              profile = data.get("profile") or {}
              allocation = data.get("allocation_capture") or (data.get("profile_summary") or {}).get("allocation_capture") or {}
              print(f"Result: **{data.get('status')}**")
              print(f"Spark SHA: `{provenance.get('spark_sha')}`")
              print(f"Endstone SHA: `{(provenance.get('endstone') or {}).get('sha')}`")
              print(f"Bot SHA: `{provenance.get('bot_sha')}`")
              print(f"Viewer: {profile.get('viewer_url')}")
              print(f"Assertions: `{data.get('semantic_assertions')}`")
              print(f"Allocation capture: `{allocation}`")
              print(f"Shutdown: `{data.get('shutdown_status')}`")
          PY

      - name: Upload alloc-live evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-alloc-live-premerge-${{ github.run_id }}
          path: |
            evidence/alloc-live-only/test-results.json
            evidence/alloc-live-only/profiler-mode-result.json
            evidence/alloc-live-only/metadata.json
            evidence/alloc-live-only/bstats-config.toml
            evidence/alloc-live-only/evidence-manifest.json
            evidence/alloc-live-only/allocation-live-state.json
            evidence/alloc-live-only/*.sparkprofile
            evidence/alloc-live-only/*-profile-summary.json
            evidence/alloc-live-only/bds.log
            evidence/alloc-live-only/endstone.log
            evidence/alloc-live-only/spark.log
            evidence/alloc-live-only/bot.log
            evidence/alloc-live-only/failure-diagnostics.txt
            evidence/alloc-live-only/work/linux/bedrock_server/server.properties
            evidence/alloc-live-only/work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 30
