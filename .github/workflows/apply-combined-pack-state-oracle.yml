name: Apply combined pack state oracle patch

on:
  push:
    branches:
      - fix/combined-pack-state-oracle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Replace console marker with server-state oracle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('controller/combined_pack_gamerule_fleet_validation.py')
          text = controller.read_text(encoding='utf-8')
          text = text.replace('import pathlib\nimport shutil\n', 'import pathlib\nimport re\nimport shutil\n', 1)
          text = text.replace(
              'BOT_SCENARIO = "chunk-walk"\n\nBEHAVIOR_PACKS = (',
              'BOT_SCENARIO = "chunk-walk"\nBEHAVIOR_PACK_STATE_RULE = "spawnradius"\nGAMERULE_VALUE_RE = re.compile(r"(?:=|is(?: currently)? set to)\\s*([A-Za-z0-9_.+-]+)\\s*$", re.IGNORECASE)\n\nBEHAVIOR_PACKS = (',
              1,
          )
          replacements = {
              '"marker": "SparkPackAlphaActive",': '"marker": "SparkPackAlphaActive",\n        "state_value": "21",',
              '"marker": "SparkPackBetaActive",': '"marker": "SparkPackBetaActive",\n        "state_value": "22",',
              '"marker": "SparkPackGammaActive",': '"marker": "SparkPackGammaActive",\n        "state_value": "23",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing controller pack anchor: {old}')
              text = text.replace(old, new, 1)
          old_function = '''            (functions / f"{pack['function']}.mcfunction").write_text(\n                f"say {pack['marker']}\\n",\n                encoding="utf-8",\n            )'''
          new_function = '''            (functions / f"{pack['function']}.mcfunction").write_text(\n                f"gamerule {BEHAVIOR_PACK_STATE_RULE} {pack['state_value']}\\n",\n                encoding="utf-8",\n            )'''
          if old_function not in text:
              raise SystemExit('missing behavior-pack function body anchor')
          text = text.replace(old_function, new_function, 1)
          old_evidence = '''                    "function": pack["function"],\n                }'''
          new_evidence = '''                    "function": pack["function"],\n                    "state_rule": BEHAVIOR_PACK_STATE_RULE,\n                    "state_value": pack["state_value"],\n                }'''
          if old_evidence not in text:
              raise SystemExit('missing behavior-pack evidence anchor')
          text = text.replace(old_evidence, new_evidence, 1)
          old_verify = '''    def verify_behavior_pack_functions(self) -> None:\n        for pack in BEHAVIOR_PACKS:\n            output = self.command_check(\n                f"behavior-pack-function-{pack['function']}",\n                f"execute run function {pack['function']}",\n            )\n            joined = "\\n".join(output).casefold()\n            rejected = ("unknown function", "function not found", "failed to execute", "syntax error")\n            if any(marker in joined for marker in rejected):\n                raise RuntimeError(\n                    f"BDS rejected behavior-pack function {pack['function']!r}: " + " | ".join(output[-30:])\n                )\n            if pack["marker"].casefold() not in joined:\n                raise RuntimeError(\n                    f"behavior-pack function {pack['function']!r} executed without expected marker "\n                    f"{pack['marker']!r}: " + " | ".join(output[-30:])\n                )\n        self.check(\n            "behavior-packs-real-load",\n            "PASS",\n            "all three behavior-pack functions executed inside real BDS",\n            count=len(BEHAVIOR_PACKS),\n        )\n'''
          new_verify = '''    @staticmethod\n    def parse_behavior_pack_state(lines: list[str]) -> str | None:\n        for line in reversed(lines):\n            if BEHAVIOR_PACK_STATE_RULE not in line.casefold():\n                continue\n            match = GAMERULE_VALUE_RE.search(line.strip())\n            if match:\n                return match.group(1).casefold()\n        return None\n\n    def verify_behavior_pack_functions(self) -> None:\n        observations: list[dict[str, Any]] = []\n        for pack in BEHAVIOR_PACKS:\n            output = self.command_check(\n                f"behavior-pack-function-{pack['function']}",\n                f"execute run function {pack['function']}",\n            )\n            joined = "\\n".join(output).casefold()\n            rejected = ("unknown function", "function not found", "failed to execute", "syntax error")\n            if any(marker in joined for marker in rejected):\n                raise RuntimeError(\n                    f"BDS rejected behavior-pack function {pack['function']!r}: " + " | ".join(output[-30:])\n                )\n            state_output = self.command_check(\n                f"behavior-pack-state-{pack['function']}",\n                f"gamerule {BEHAVIOR_PACK_STATE_RULE}",\n            )\n            observed = self.parse_behavior_pack_state(state_output)\n            expected = pack["state_value"].casefold()\n            if observed != expected:\n                raise RuntimeError(\n                    f"behavior-pack function {pack['function']!r} did not produce expected server state "\n                    f"{BEHAVIOR_PACK_STATE_RULE}={expected!r}; observed={observed!r}: "\n                    + " | ".join(state_output[-30:])\n                )\n            observations.append(\n                {\n                    "function": pack["function"],\n                    "state_rule": BEHAVIOR_PACK_STATE_RULE,\n                    "expected": expected,\n                    "observed": observed,\n                }\n            )\n        self.result["behavior_pack_execution_oracle"] = observations\n        self._write_results()\n        self.check(\n            "behavior-packs-real-load",\n            "PASS",\n            "all three behavior-pack functions changed and exposed expected real-BDS server state",\n            count=len(BEHAVIOR_PACKS),\n            state_rule=BEHAVIOR_PACK_STATE_RULE,\n        )\n'''
          if old_verify not in text:
              raise SystemExit('missing verify_behavior_pack_functions anchor')
          controller.write_text(text.replace(old_verify, new_verify, 1), encoding='utf-8')

          tests = Path('tests/test_combined_pack_exact_runner.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '    BEHAVIOR_PACKS,\n    CombinedPackGameruleFleetValidation,',
              '    BEHAVIOR_PACKS,\n    BEHAVIOR_PACK_STATE_RULE,\n    CombinedPackGameruleFleetValidation,',
              1,
          )
          old_tests = '''    def test_behavior_pack_functions_use_execute_wrapper_and_distinct_markers(self) -> None:\n        validator = mock.Mock()\n        outputs = {\n            f"execute run function {pack['function']}": [pack["marker"]]\n            for pack in BEHAVIOR_PACKS\n        }\n        validator.command_check.side_effect = lambda _name, command: outputs[command]\n\n        exact.CombinedPackGameruleFleetValidation.verify_behavior_pack_functions(validator)\n\n        self.assertEqual(\n            [item.args[1] for item in validator.command_check.call_args_list],\n            list(outputs),\n        )\n        validator.check.assert_called_once_with(\n            "behavior-packs-real-load",\n            "PASS",\n            "all three behavior-pack functions executed inside real BDS",\n            count=len(BEHAVIOR_PACKS),\n        )\n\n    def test_behavior_pack_function_rejections_remain_fail_closed(self) -> None:\n        for index, pack in enumerate(BEHAVIOR_PACKS):\n            with self.subTest(function=pack["function"]):\n                validator = mock.Mock()\n                target = f"execute run function {pack['function']}"\n\n                def command_check(\n                    _name: str,\n                    command: str,\n                    *,\n                    target: str = target,\n                    previous_packs: tuple[dict[str, str], ...] = BEHAVIOR_PACKS[:index],\n                ) -> list[str]:\n                    if command == target:\n                        return ["Syntax error: unknown function"]\n                    for previous in previous_packs:\n                        if command == f"execute run function {previous['function']}":\n                            return [previous["marker"]]\n                    raise AssertionError(f"unexpected command: {command}")\n\n                validator.command_check.side_effect = command_check\n\n                with self.assertRaisesRegex(RuntimeError, "rejected behavior-pack function"):\n                    exact.CombinedPackGameruleFleetValidation.verify_behavior_pack_functions(validator)\n\n                self.assertEqual(validator.command_check.call_args_list[-1].args, (\n                    f"behavior-pack-function-{pack['function']}",\n                    f"execute run function {pack['function']}",\n                ))\n\n    def test_behavior_pack_function_missing_marker_remains_fail_closed(self) -> None:\n        validator = mock.Mock()\n        validator.command_check.return_value = ["unrelated output"]\n\n        with self.assertRaisesRegex(RuntimeError, "executed without expected marker"):\n            exact.CombinedPackGameruleFleetValidation.verify_behavior_pack_functions(validator)\n'''
          new_tests = '''    def test_behavior_pack_functions_use_execute_wrapper_and_state_oracle(self) -> None:\n        validator = mock.Mock()\n        validator.result = {}\n        observed_state: dict[str, str | None] = {"value": None}\n\n        def command_check(_name: str, command: str) -> list[str]:\n            for pack in BEHAVIOR_PACKS:\n                if command == f"execute run function {pack['function']}":\n                    observed_state["value"] = pack["state_value"]\n                    return []\n            if command == f"gamerule {BEHAVIOR_PACK_STATE_RULE}":\n                return [f"{BEHAVIOR_PACK_STATE_RULE} = {observed_state['value']}"]\n            raise AssertionError(f"unexpected command: {command}")\n\n        validator.command_check.side_effect = command_check\n        validator.parse_behavior_pack_state.side_effect = (\n            lambda lines: exact.CombinedPackGameruleFleetValidation.parse_behavior_pack_state(lines)\n        )\n\n        exact.CombinedPackGameruleFleetValidation.verify_behavior_pack_functions(validator)\n\n        expected_commands = []\n        for pack in BEHAVIOR_PACKS:\n            expected_commands.extend(\n                [\n                    f"execute run function {pack['function']}",\n                    f"gamerule {BEHAVIOR_PACK_STATE_RULE}",\n                ]\n            )\n        self.assertEqual([item.args[1] for item in validator.command_check.call_args_list], expected_commands)\n        validator._write_results.assert_called_once_with()\n        validator.check.assert_called_once_with(\n            "behavior-packs-real-load",\n            "PASS",\n            "all three behavior-pack functions changed and exposed expected real-BDS server state",\n            count=len(BEHAVIOR_PACKS),\n            state_rule=BEHAVIOR_PACK_STATE_RULE,\n        )\n        self.assertEqual(len(validator.result["behavior_pack_execution_oracle"]), len(BEHAVIOR_PACKS))\n\n    def test_behavior_pack_function_rejections_remain_fail_closed(self) -> None:\n        for index, pack in enumerate(BEHAVIOR_PACKS):\n            with self.subTest(function=pack["function"]):\n                validator = mock.Mock()\n                validator.result = {}\n                target = f"execute run function {pack['function']}"\n                state: dict[str, str | None] = {"value": None}\n\n                def command_check(\n                    _name: str,\n                    command: str,\n                    *,\n                    target: str = target,\n                    previous_packs: tuple[dict[str, str], ...] = BEHAVIOR_PACKS[:index],\n                ) -> list[str]:\n                    if command == target:\n                        return ["Syntax error: unknown function"]\n                    for previous in previous_packs:\n                        if command == f"execute run function {previous['function']}":\n                            state["value"] = previous["state_value"]\n                            return []\n                    if command == f"gamerule {BEHAVIOR_PACK_STATE_RULE}":\n                        return [f"{BEHAVIOR_PACK_STATE_RULE} = {state['value']}"]\n                    raise AssertionError(f"unexpected command: {command}")\n\n                validator.command_check.side_effect = command_check\n                validator.parse_behavior_pack_state.side_effect = (\n                    lambda lines: exact.CombinedPackGameruleFleetValidation.parse_behavior_pack_state(lines)\n                )\n\n                with self.assertRaisesRegex(RuntimeError, "rejected behavior-pack function"):\n                    exact.CombinedPackGameruleFleetValidation.verify_behavior_pack_functions(validator)\n\n                self.assertEqual(validator.command_check.call_args_list[-1].args, (\n                    f"behavior-pack-function-{pack['function']}",\n                    f"execute run function {pack['function']}",\n                ))\n\n    def test_behavior_pack_function_state_mismatch_remains_fail_closed(self) -> None:\n        validator = mock.Mock()\n        validator.result = {}\n        validator.command_check.side_effect = lambda _name, command: (\n            [f"{BEHAVIOR_PACK_STATE_RULE} = 999"]\n            if command == f"gamerule {BEHAVIOR_PACK_STATE_RULE}"\n            else []\n        )\n        validator.parse_behavior_pack_state.side_effect = (\n            lambda lines: exact.CombinedPackGameruleFleetValidation.parse_behavior_pack_state(lines)\n        )\n\n        with self.assertRaisesRegex(RuntimeError, "did not produce expected server state"):\n            exact.CombinedPackGameruleFleetValidation.verify_behavior_pack_functions(validator)\n'''
          if old_tests not in text:
              raise SystemExit('missing behavior-pack tests anchor')
          tests.write_text(text.replace(old_tests, new_tests, 1), encoding='utf-8')
          PY

      - name: Run focused tests
        run: python -m unittest tests.test_combined_pack_exact_runner

      - name: Commit patch and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-combined-pack-state-oracle.yml
          git add controller/combined_pack_gamerule_fleet_validation.py tests/test_combined_pack_exact_runner.py
          git diff --cached --check
          git commit -m 'test: replace behavior-pack console marker with state oracle'
          git push origin HEAD:fix/combined-pack-state-oracle
