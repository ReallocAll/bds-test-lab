name: Candidate A invalid-case diagnostics

on:
  push:
    branches:
      - main
    paths:
      - "triggers/candidate-a-diagnostic.txt"
  workflow_dispatch:
    inputs:
      treatment:
        description: "Non-admissible treatment to diagnose"
        required: true
        type: choice
        default: "off-B"
        options:
          - "off-B"
          - "off-C"
          - "full-B"
          - "full-C"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BOT_REF: b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a
  BDS_TEST_BOT_SCENARIO_FILE: scenarios/candidate-a-stationary.json

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7

      - name: Resolve diagnostic treatment
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TREATMENT: ${{ inputs.treatment || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            treatment="$(tr -d '[:space:]' < triggers/candidate-a-diagnostic.txt)"
          else
            treatment="$INPUT_TREATMENT"
          fi
          case "$treatment" in
            off-B|off-C|full-B|full-C) ;;
            *) echo "invalid diagnostic treatment: $treatment" >&2; exit 1 ;;
          esac
          echo "treatment=$treatment" >> "$GITHUB_OUTPUT"
          echo "Diagnostic treatment: $treatment (NON-ADMISSIBLE)"

      - name: Validate diagnostic source and immutable scenario
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile controller/candidate_a_case_diagnostic.py controller/candidate_a_blocked_hardening.py
          test "$(sha256sum scenarios/candidate-a-stationary.json | cut -d' ' -f1)" = "169360cb46acc6dc29ed5b38e082543b12434860bb65119c519a095de2a04799"

      - name: Checkout exact bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact bot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging hatchling

      - name: Run one non-admissible case
        id: diagnostic
        shell: bash
        env:
          TREATMENT: ${{ steps.resolve.outputs.treatment }}
        run: |
          set +e
          set -uo pipefail
          python -m controller.candidate_a_case_diagnostic \
            --bot dist/bds-test-bot \
            --evidence-root evidence-diagnostic \
            --treatment "$TREATMENT"
          code=$?
          echo "case_exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Diagnostic case exit code: $code"
          test -s evidence-diagnostic/candidate-a-invalid-diagnostic.json || exit 1
          test ! -e evidence-diagnostic/.candidate-a-upload-ok || {
            echo "Diagnostic runner must never create a formal upload marker" >&2
            exit 1
          }
          cat evidence-diagnostic/candidate-a-invalid-diagnostic.json
          exit 0

      - name: Upload non-admissible diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        env:
          TREATMENT: ${{ steps.resolve.outputs.treatment }}
        with:
          name: candidate-a-invalid-diagnostic-${{ steps.resolve.outputs.treatment }}-${{ github.run_id }}
          path: |
            evidence-diagnostic/candidate-a-invalid-diagnostic.json
            evidence-diagnostic/${{ steps.resolve.outputs.treatment }}/candidate-a-blocked-result.json
            evidence-diagnostic/${{ steps.resolve.outputs.treatment }}/candidate-a-blocked-case.json
            evidence-diagnostic/${{ steps.resolve.outputs.treatment }}/failure-diagnostics.txt
            evidence-diagnostic/${{ steps.resolve.outputs.treatment }}/*.sparkprofile
          if-no-files-found: warn
          retention-days: 14
