name: Spark Profile Payload Diagnostic

on:
  push:
    branches:
      - test/spark-profiler-overhead-benchmark
    paths:
      - ".github/workflows/spark-profile-payload-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and inspect profiler JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import urllib.request
          import urllib.error

          profiles = {
              "reported-old-1": "ECY2Y0jpiV",
              "reported-old-2": "jlMvh4ApoR",
              "optimized-linux-walk": "fEDfNJIfir",
              "optimized-linux-mobs": "wItEPI8Bnv",
              "optimized-windows-walk": "dpehFE6esr",
              "optimized-windows-mobs": "Ru93Lx5Ioe",
          }

          wanted_meta = [
              "Allocation profile samples accepted",
              "Allocation sampled thread roots",
              "Allocation profile sampled bytes",
              "Allocation observed request bytes (process-wide)",
              "Allocation sampling points hit (process-wide)",
              "Allocation samples dropped",
              "Allocation samples excluded by thread selector",
              "Allocation thread name lookup failures",
              "Allocation data incomplete",
              "Allocation profile storage exhausted",
              "Allocation pending samples dropped",
              "Allocation profile storage sample drops",
          ]

          def fetch_json(code):
              errors = []
              for full in ("1", "true"):
                  url = f"https://spark.lucko.me/{code}?raw=1&full={full}"
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "bds-test-lab-profile-diagnostic/1",
                      "Accept": "application/json",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read()
                          if r.status != 200:
                              errors.append(f"{url}: HTTP {r.status}")
                              continue
                          return json.loads(body), url, len(body)
                  except Exception as exc:
                      errors.append(f"{url}: {type(exc).__name__}: {exc}")
              raise RuntimeError("; ".join(errors))

          def find_sampler(obj):
              if isinstance(obj, dict):
                  if isinstance(obj.get("threads"), list) and isinstance(obj.get("metadata"), dict):
                      return obj
                  for value in obj.values():
                      found = find_sampler(value)
                      if found is not None:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_sampler(value)
                      if found is not None:
                          return found
              return None

          def num_sum(values):
              total = 0.0
              if isinstance(values, list):
                  for value in values:
                      if isinstance(value, (int, float)):
                          total += float(value)
              return total

          report = []
          summaries = {}
          failures = []
          for label, code in profiles.items():
              try:
                  raw, source_url, byte_len = fetch_json(code)
                  pathlib.Path(f"spark-{code}-full.json").write_text(json.dumps(raw, ensure_ascii=False, indent=2), encoding="utf-8")
                  sampler = find_sampler(raw)
                  if sampler is None:
                      raise RuntimeError("no object containing metadata+threads found")
                  metadata = sampler.get("metadata", {})
                  threads = sampler.get("threads", [])
                  extra = metadata.get("extraPlatformMetadata") or metadata.get("extra_platform_metadata") or {}
                  thread_rows = []
                  for thread in threads:
                      children = thread.get("children") if isinstance(thread, dict) else None
                      refs = (thread.get("childrenRefs") or thread.get("children_refs")) if isinstance(thread, dict) else None
                      times = thread.get("times") if isinstance(thread, dict) else None
                      thread_rows.append({
                          "name": thread.get("name", "") if isinstance(thread, dict) else "",
                          "times_sum": num_sum(times),
                          "times_len": len(times) if isinstance(times, list) else 0,
                          "children_len": len(children) if isinstance(children, list) else 0,
                          "children_refs_len": len(refs) if isinstance(refs, list) else 0,
                      })
                  start = metadata.get("startTime", metadata.get("start_time", 0)) or 0
                  end = metadata.get("endTime", metadata.get("end_time", 0)) or 0
                  summary = {
                      "label": label,
                      "code": code,
                      "source_url": source_url,
                      "json_bytes": byte_len,
                      "sampler_mode": metadata.get("samplerMode", metadata.get("sampler_mode")),
                      "duration_seconds": (float(end) - float(start)) / 1000.0 if end and start else None,
                      "threads_count": len(threads),
                      "threads": thread_rows,
                      "diagnostics": {k: extra.get(k) for k in wanted_meta if k in extra},
                  }
                  summaries[code] = summary
              except Exception as exc:
                  failures.append(f"{label} {code}: {type(exc).__name__}: {exc}")

          pathlib.Path("spark-profile-payload-summary.json").write_text(
              json.dumps({"profiles": summaries, "failures": failures}, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          report.append("# Spark profile payload diagnostic")
          report.append("")
          for code, s in summaries.items():
              report.append(f"## {s['label']} — `{code}`")
              report.append(f"- sampler mode: `{s['sampler_mode']}`")
              report.append(f"- duration: `{s['duration_seconds']}` seconds")
              report.append(f"- full JSON bytes: `{s['json_bytes']}`")
              report.append(f"- threads: `{s['threads_count']}`")
              for t in s["threads"]:
                  report.append(
                      f"  - `{t['name']}`: times_len={t['times_len']}, times_sum={t['times_sum']}, "
                      f"children={t['children_len']}, children_refs={t['children_refs_len']}"
                  )
              for key, value in s["diagnostics"].items():
                  report.append(f"- {key}: `{value}`")
              report.append("")
          if failures:
              report.append("## Failures")
              report.extend(f"- {x}" for x in failures)
              report.append("")

          text = "\n".join(report)
          pathlib.Path("spark-profile-payload-summary.md").write_text(text, encoding="utf-8")
          print(text)
          with open(pathlib.Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write(text + "\n")

          if failures:
              raise SystemExit(1)
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-profile-payload-diagnostic-${{ github.run_id }}
          path: |
            spark-profile-payload-summary.json
            spark-profile-payload-summary.md
            spark-*-full.json
          if-no-files-found: warn
          retention-days: 14
