name: Final alloc-live post-merge acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-campaign-acceptance.yml"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  SPARK_SHA: "653e6821a45f5b5de5e8d22671960c2024db18be"
  BOT_REF: "f175e4a6551d1973628b5ca926a497e9962c1302"
  EXPECTED_BDS_VERSION: "1.26.45.1"
  EXPECTED_ENDSTONE_SHA: "46eff9f125f52eac76472d84339ead8fbf51fcd2"

jobs:
  alloc-live:
    name: Linux alloc-live-only post-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout post-merge main
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record harness revision
        shell: bash
        run: echo "LAB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Checkout exact bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Build exact bot
        shell: bash
        run: |
          set -euo pipefail
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist-bds-test-bot ./cmd/bds-test-bot
          chmod +x ../dist-bds-test-bot
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil hatchling
      - name: Require exact Spark artifact
        run: python -m controller.assert_spark_artifact --platform linux --expected-sha "$SPARK_SHA"
      - name: Run fixed-order real-BDS alloc-live
        run: >-
          python -m controller.final_profiler_matrix
          --mode alloc-live-only
          --bot "$GITHUB_WORKSPACE/dist-bds-test-bot"
          --spark-sha "$SPARK_SHA"
          --bot-ref "$BOT_REF"
          --evidence-root evidence
      - name: Verify bStats disabled
        if: always()
        run: python -m controller.verify_bstats_evidence --result evidence/alloc-live-only/test-results.json
      - name: Verify final alloc-live contract independently
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('evidence/alloc-live-only/test-results.json')
          if not path.is_file():
              raise SystemExit('alloc-live result missing')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('status') != 'PASS':
              raise SystemExit(f"alloc-live status={data.get('status')}: {data.get('error_summary')}")
          provenance = data.get('provenance') or {}
          if (provenance.get('spark_sha') or '').lower() != os.environ['SPARK_SHA'].lower():
              raise SystemExit(f"Spark SHA mismatch: {provenance.get('spark_sha')}")
          if (provenance.get('bot_sha') or '').lower() != os.environ['BOT_REF'].lower():
              raise SystemExit(f"Bot SHA mismatch: {provenance.get('bot_sha')}")
          endstone = provenance.get('endstone') or {}
          if (endstone.get('sha') or '').lower() != os.environ['EXPECTED_ENDSTONE_SHA'].lower():
              raise SystemExit(f"Endstone SHA mismatch: {endstone.get('sha')}")
          measurement = data.get('measurement') or {}
          if not measurement.get('profiler_start_acknowledgement'):
              raise SystemExit('profiler running acknowledgement missing')
          retained = (data.get('workload') or {}).get('retained_allocation') or {}
          expected = 24 * (1 << 20)
          if retained.get('retained_blocks_before_cleanup') != 24 or retained.get('retained_bytes_before_cleanup') != expected:
              raise SystemExit(f"retained fixture mismatch: {retained}")
          if not retained.get('cleaned_up'):
              raise SystemExit(f"retained fixture cleanup incomplete: {retained}")
          assertions = data.get('semantic_assertions') or {}
          if not assertions or not all(assertions.values()) or not assertions.get('retained_helper_chain'):
              raise SystemExit(f"semantic assertions failed: {assertions}")
          profile = data.get('profile') or {}
          if int(profile.get('raw_bytes') or 0) <= 0:
              raise SystemExit(f"empty profile: {profile}")
          incomplete = (data.get('quality') or {}).get('incomplete_flags') or {}
          if any(incomplete.values()):
              raise SystemExit(f"incomplete profile: {incomplete}")
          print('post-merge final alloc-live acceptance PASS')
          PY
      - name: Upload bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-postmerge-alloc-live-${{ github.run_id }}
          path: |
            evidence/alloc-live-only/test-results.json
            evidence/alloc-live-only/profiler-mode-result.json
            evidence/alloc-live-only/metadata.json
            evidence/alloc-live-only/bstats-config.toml
            evidence/alloc-live-only/evidence-manifest.json
            evidence/alloc-live-only/allocation-live-state.json
            evidence/alloc-live-only/*.sparkprofile
            evidence/alloc-live-only/*-profile-summary.json
            evidence/alloc-live-only/bds.log
            evidence/alloc-live-only/endstone.log
            evidence/alloc-live-only/spark.log
            evidence/alloc-live-only/bot.log
            evidence/alloc-live-only/failure-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30
