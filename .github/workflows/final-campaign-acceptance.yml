name: Final Spark performance acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-campaign-acceptance.yml"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  SPARK_SHA: "653e6821a45f5b5de5e8d22671960c2024db18be"
  BOT_REF: "f175e4a6551d1973628b5ca926a497e9962c1302"
  EXPECTED_BDS_VERSION: "1.26.45.1"
  EXPECTED_ENDSTONE_SHA: "46eff9f125f52eac76472d84339ead8fbf51fcd2"

jobs:
  linux-profiler-matrix:
    name: Linux profiler ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [default, "1ms", all-thread, only-ticks-over, allocation, alloc-live-only]
    steps:
      - uses: actions/checkout@v7
      - name: Wait for exact final Spark Build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${SPARK_SHA}&per_page=30")"
            build="$(jq -r '[.workflow_runs[] | select(.name == "Build")][0].conclusion // ""' <<<"$json")"
            echo "attempt ${attempt}: Build=${build:-pending}"
            if [[ "$build" == success ]]; then exit 0; fi
            if [[ "$build" == failure || "$build" == cancelled || "$build" == timed_out ]]; then exit 1; fi
            sleep 15
          done
          exit 1
      - uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Build exact bot
        shell: bash
        run: |
          set -euo pipefail
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist-bds-test-bot ./cmd/bds-test-bot
          chmod +x ../dist-bds-test-bot
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil hatchling
      - name: Require exact Spark artifact
        run: python -m controller.assert_spark_artifact --platform linux --expected-sha "$SPARK_SHA"
      - name: Run isolated real-BDS mode
        run: >-
          python -m controller.final_profiler_matrix
          --mode "${{ matrix.mode }}"
          --bot "$GITHUB_WORKSPACE/dist-bds-test-bot"
          --spark-sha "$SPARK_SHA"
          --bot-ref "$BOT_REF"
          --evidence-root evidence
      - name: Verify bStats disabled
        if: always()
        run: python -m controller.verify_bstats_evidence --result "evidence/${{ matrix.mode }}/test-results.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-acceptance-${{ matrix.mode }}-${{ github.run_id }}
          path: evidence/${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 30

  python-attribution:
    name: Linux Python multi-plugin attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Wait for exact final Spark Build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${SPARK_SHA}&per_page=30")"
            build="$(jq -r '[.workflow_runs[] | select(.name == "Build")][0].conclusion // ""' <<<"$json")"
            if [[ "$build" == success ]]; then exit 0; fi
            if [[ "$build" == failure || "$build" == cancelled || "$build" == timed_out ]]; then exit 1; fi
            sleep 15
          done
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging hatchling
      - name: Require exact Spark artifact
        run: python -m controller.assert_spark_artifact --platform linux --expected-sha "$SPARK_SHA"
      - name: Run two-plugin real-BDS profile
        env:
          EXPECTED_SPARK_SHA: ${{ env.SPARK_SHA }}
          EXPECTED_ENDSTONE_SHA: ${{ env.EXPECTED_ENDSTONE_SHA }}
        run: >-
          python -m controller.python_multi_plugin_validation
          --spark-sha "$SPARK_SHA"
          --bds-version "$EXPECTED_BDS_VERSION"
          --profile-seconds 60
      - name: Verify bStats disabled
        if: always()
        run: python -m controller.verify_bstats_evidence --result test-results.json --result python-attribution-result.json
      - name: Upload attribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-acceptance-python-attribution-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            test-results.json
            python-attribution-result.json
            bstats-config.toml
            python-multi-plugin.sparkprofile
            python-multi-plugin-profile-summary.json
            failure-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30
