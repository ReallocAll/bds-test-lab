name: Temporary Windows allocation smoke

on:
  push:
    branches:
      - test/spark-v0.6-release-validation
    paths:
      - ".github/workflows/temp-windows-allocation-smoke.yml"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: "d9d4f6abd23e16694d5e5a4f27a4a371e9ae71e4"
  BOT_REF: "a0a83240e9e8f12d4806ba31194fb1807d7b5dd1"

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout Bot at exact ref
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact Bot revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot.exe ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging

      - name: Require exact Spark artifact
        run: python -m controller.assert_spark_artifact --platform windows --expected-sha ${{ env.EXPECTED_SPARK_SHA }}

      - name: Run pre-soak release chain including allocation profiler
        shell: python
        run: |
          import pathlib
          from controller.release_validation import SparkReleaseValidation

          validation = SparkReleaseValidation("windows", 30, pathlib.Path("dist/bds-test-bot.exe"))
          validation.run_soak = lambda: validation.check("soak", "SKIP", "temporary smoke stops after pre-soak chain")
          raise SystemExit(validation.execute_release())

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-allocation-smoke-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            release-bot-windows.log
            test-results.json
            failure-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
