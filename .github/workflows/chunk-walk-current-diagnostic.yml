name: Current Bot Chunk-Walk Diagnostic

on:
  push:
    branches: [test/chunk-fly-spark]
    paths:
      - ".github/workflows/chunk-walk-current-diagnostic.yml"
      - "controller/chunk_fly_bot_ref.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"

jobs:
  correction-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Resolve exact current bot revision
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < controller/chunk_fly_bot_ref.txt)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid exact bot ref: $ref" >&2; exit 1; }
          echo "BOT_REF=$ref" >> "$GITHUB_ENV"

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = '    branch = config["branch"]\n'
          injected = '''    branch = config["branch"]
    override_run_id = os.environ.get(f"{component.upper()}_RUN_ID", "").strip()
    if override_run_id:
        run = _get_json(f"/repos/{repo}/actions/runs/{override_run_id}")
        if run.get("head_branch") != branch or run.get("conclusion") != "success":
            raise ArtifactResolutionError(f"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run")
        artifact = _select_from_run(component, platform_name, repo, run)
        if artifact is None:
            raise ArtifactResolutionError(f"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact")
        return run, artifact
'''
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact production bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Apply correction rewind/replay diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tick = Path("bot-src/internal/bot/tick.go")
          text = tick.read_text()

          old = '''type playerState struct {
\tmu                  sync.Mutex
'''
          new = '''type predictionFrame struct {
\ttick  uint64
\tdelta mgl32.Vec3
}

const predictionHistoryLimit = 256

type playerState struct {
\tmu                  sync.Mutex
'''
          if old not in text:
              raise SystemExit("playerState insertion target missing")
          text = text.replace(old, new, 1)

          old = '''\tserverTick          uint64
\ttickSynced          bool
\tcontrol             inputControl
'''
          new = '''\tserverTick          uint64
\ttickSynced          bool
\tpredictionHistory   []predictionFrame
\tcontrol             inputControl
'''
          if old not in text:
              raise SystemExit("prediction history field target missing")
          text = text.replace(old, new, 1)

          old = '''\tverticalDirection float32
}
'''
          new = '''\tverticalDirection float32
\tcommittedDelta    mgl32.Vec3
}
'''
          if old not in text:
              raise SystemExit("snapshot committed delta target missing")
          text = text.replace(old, new, 1)

          old = '''func (s *playerState) correct(position mgl32.Vec3, pitch, yaw, headYaw float32) {
\ts.mu.Lock()
\tdefer s.mu.Unlock()
\ts.position = position
\tif validPlayerPositionY(position[1]) {
\t\ts.positionReady = true
\t}
\ts.pitch = pitch
\ts.yaw = yaw
\ts.headYaw = headYaw
\ts.serverCorrections++
}
'''
          new = old + '''
func (s *playerState) recordPrediction(tick uint64, delta mgl32.Vec3) {
\ts.mu.Lock()
\tdefer s.mu.Unlock()
\ts.predictionHistory = append(s.predictionHistory, predictionFrame{tick: tick, delta: delta})
\tif len(s.predictionHistory) > predictionHistoryLimit {
\t\ts.predictionHistory = append([]predictionFrame(nil), s.predictionHistory[len(s.predictionHistory)-predictionHistoryLimit:]...)
\t}
}

func (s *playerState) correctPrediction(position mgl32.Vec3, pitch, yaw, headYaw float32, tick uint64) {
\ts.mu.Lock()
\tdefer s.mu.Unlock()
\tcurrent := position
\tkeep := s.predictionHistory[:0]
\tfor _, frame := range s.predictionHistory {
\t\tif frame.tick > tick {
\t\t\tcurrent = current.Add(frame.delta)
\t\t\tkeep = append(keep, frame)
\t\t}
\t}
\ts.predictionHistory = keep
\ts.position = current
\tif validPlayerPositionY(position[1]) {
\t\ts.positionReady = true
\t}
\ts.pitch = pitch
\ts.yaw = yaw
\ts.headYaw = headYaw
\ts.serverCorrections++
}
'''
          if old not in text:
              raise SystemExit("correct method target missing")
          text = text.replace(old, new, 1)

          old = '''\ts.position[0] += snapshot.delta[0]
\ts.position[2] += snapshot.delta[2]
}
'''
          new = '''\ts.position[0] += snapshot.delta[0]
\ts.position[2] += snapshot.delta[2]
\tsnapshot.committedDelta[0] = snapshot.delta[0]
\tsnapshot.committedDelta[2] = snapshot.delta[2]
}
'''
          if old not in text:
              raise SystemExit("horizontal committed delta target missing")
          text = text.replace(old, new, 1)

          old = '''\t// Match the coherent input tuple used by go-test-bds, a current BDS test
'''
          new = '''\ts.recordPrediction(tick, snapshot.committedDelta)

\t// Match the coherent input tuple used by go-test-bds, a current BDS test
'''
          if old not in text:
              raise SystemExit("record prediction target missing")
          text = text.replace(old, new, 1)
          tick.write_text(text)

          flight = Path("bot-src/internal/bot/flight_movement.go")
          text = flight.read_text()
          old = '''\t\tsnapshot.delta[1] = step
\t\ts.position[1] += step
\t\treturn
'''
          new = '''\t\tsnapshot.delta[1] = step
\t\ts.position[1] += step
\t\tsnapshot.committedDelta[1] = step
\t\treturn
'''
          if old not in text:
              raise SystemExit("flight ascent committed delta target missing")
          text = text.replace(old, new, 1)
          old = '''\t\tsnapshot.delta[1] = -step
\t\ts.position[1] -= step
\t\treturn
'''
          new = '''\t\tsnapshot.delta[1] = -step
\t\ts.position[1] -= step
\t\tsnapshot.committedDelta[1] = -step
\t\treturn
'''
          if old not in text:
              raise SystemExit("flight descent committed delta target missing")
          flight.write_text(text.replace(old, new, 1))

          bot = Path("bot-src/internal/bot/bot.go")
          text = bot.read_text()
          old = '''\t\tcase *packet.CorrectPlayerMovePrediction:
\t\t\tif p.PredictionType == packet.PredictionTypePlayer {
\t\t\t\tstate.correct(p.Position, p.Rotation[0], p.Rotation[1], p.Rotation[1])
\t\t\t\tstate.syncServerTick(p.Tick)
\t\t\t}
'''
          new = '''\t\tcase *packet.CorrectPlayerMovePrediction:
\t\t\tif p.PredictionType == packet.PredictionTypePlayer {
\t\t\t\tstate.correctPrediction(p.Position, p.Rotation[0], p.Rotation[1], p.Rotation[1], p.Tick)
\t\t\t\tstate.syncServerTick(p.Tick)
\t\t\t}
'''
          if old not in text:
              raise SystemExit("correction handler target missing")
          bot.write_text(text.replace(old, new, 1))

          tests = Path("bot-src/internal/bot/tick_test.go")
          text = tests.read_text()
          text += r'''

func TestCorrectionReplaysPredictionsAfterCorrectedTick(t *testing.T) {
\tstate := newPlayerState(mgl32.Vec3{10, 70, 20}, 0, 0)
\tstate.setMoveControl(mgl32.Vec2{0, 1}, chunkWalkStepPerTick, 0)
\t_ = authInputPacket(state, 40)
\t_ = authInputPacket(state, 41)
\t_ = authInputPacket(state, 42)

\tcorrected := mgl32.Vec3{10, 70, 20.25}
\tstate.correctPrediction(corrected, 0, 0, 0, 40)
\tposition, _, corrections := state.telemetrySnapshot()
\twantZ := corrected[2] + 2*chunkWalkStepPerTick
\tif math.Abs(float64(position[2]-wantZ)) > 1e-5 || position[0] != corrected[0] || position[1] != corrected[1] {
\t\tt.Fatalf("replayed position = %v, want x=%f y=%f z=%f", position, corrected[0], corrected[1], wantZ)
\t}
\tif corrections != 1 {
\t\tt.Fatalf("server corrections = %d, want 1", corrections)
\t}
}

func TestCorrectionReplayDoesNotCommitGroundGravityDelta(t *testing.T) {
\tstate := newPlayerState(mgl32.Vec3{0, 64, 0}, 0, 0)
\tstate.setMoveControl(mgl32.Vec2{0, 1}, chunkWalkStepPerTick, 0)
\tpk := authInputPacket(state, 2)
\tif pk.Delta[1] >= 0 {
\t\tt.Fatalf("walk packet should carry ground gravity delta: %v", pk.Delta)
\t}
\tstate.correctPrediction(mgl32.Vec3{0, 64, 0}, 0, 0, 0, 1)
\tposition, _, _ := state.telemetrySnapshot()
\tif position[1] != 64 {
\t\tt.Fatalf("gravity delta was replayed into prediction position: %v", position)
\t}
\tif math.Abs(float64(position[2]-chunkWalkStepPerTick)) > 1e-5 {
\t\tt.Fatalf("horizontal prediction was not replayed: %v", position)
\t}
}
'''.replace('\\t', '\t')
          tests.write_text(text)
          PY
          gofmt -w bot-src/internal/bot/tick.go bot-src/internal/bot/flight_movement.go bot-src/internal/bot/bot.go bot-src/internal/bot/tick_test.go

      - name: Verify diagnostic build and tests
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run strict BDS-only chunk-walk validation
        run: python -m controller.movement_bds_only_validation --bot dist/bds-test-bot --scenario chunk-walk

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: correction-replay-chunk-walk-${{ github.run_id }}
          path: |
            bds-only-chunk-walk.log
            test-results.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
