name: Current Bot Chunk-Walk Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-walk-current-diagnostic.yml"
      - "controller/chunk_fly_bot_ref.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"

jobs:
  chunk-walk-reference-tuple:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Resolve exact current bot revision
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < controller/chunk_fly_bot_ref.txt)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid exact bot ref: $ref" >&2
            exit 1
          fi
          echo "BOT_REF=$ref" >> "$GITHUB_ENV"
          echo "Resolved bot ref: $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact current bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Apply authoritative telemetry and reference input tuple
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bot = Path("bot-src/internal/bot/bot.go")
          text = bot.read_text()
          replacements = [
              (
                  "if cfg.Scenario == ScenarioChunkFly && samePublisher {",
                  "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && samePublisher {",
              ),
              (
                  "if cfg.Scenario == ScenarioChunkFly && changedChunk {",
                  "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && changedChunk {",
              ),
              (
                  "if onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {",
                  "if onlineState && (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !time.Now().Before(nextProgress) {",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"bot.go diagnostic target not found: {old}")
              text = text.replace(old, new, 1)
          bot.write_text(text)

          tick = Path("bot-src/internal/bot/tick.go")
          text = tick.read_text()
          replacements = [
              (
                  "if cfg.Scenario == ScenarioChunkFly && !state.positionReadySnapshot() {",
                  "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !state.positionReadySnapshot() {",
              ),
              ("\tflags.Set(packet.InputFlagBlockBreakingDelayEnabled)\n", ""),
              ("\t\tInputMode:          packet.InputModeMouse,\n", "\t\tInputMode:          packet.InputModeTouch,\n"),
              ("\t\tPlayMode:           packet.PlayModeScreen,\n", "\t\tPlayMode:           packet.PlayModeNormal,\n"),
              ("\t\tInteractionModel:   packet.InteractionModelCrosshair,\n", "\t\tInteractionModel:   packet.InteractionModelTouch,\n"),
              ("\t\tAnalogueMoveVector: snapshot.moveVector,\n", "\t\tAnalogueMoveVector: mgl32.Vec2{},\n"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"tick.go diagnostic target not found: {old!r}")
              text = text.replace(old, new, 1)
          old = "\t\tRawMoveVector:      snapshot.moveVector,\n"
          new = "\t\tRawMoveVector: mgl32.Vec2{\n\t\t\tsnapshot.moveVector[0] * float32(math.Hypot(float64(snapshot.delta[0]), float64(snapshot.delta[2]))),\n\t\t\tsnapshot.moveVector[1] * float32(math.Hypot(float64(snapshot.delta[0]), float64(snapshot.delta[2]))),\n\t\t},\n"
          if old not in text:
              raise SystemExit("RawMoveVector diagnostic target not found")
          tick.write_text(text.replace(old, new, 1))
          PY
          gofmt -w bot-src/internal/bot/bot.go bot-src/internal/bot/tick.go

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build current bot
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run reference-tuple chunk-walk against real BDS
        continue-on-error: true
        run: >-
          python -m controller.chunk_walk_validation
          --bot dist/bds-test-bot
          --count 1
          --profile-seconds 10

      - name: Summarize authoritative movement evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("fleet-1-chunk-walk.log")
          print("## Reference PlayerAuthInput tuple")
          if not path.exists():
              print("No fleet log produced.")
              raise SystemExit(0)
          progress = []
          for line in path.read_text(errors="replace").splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("event") == "bot_progress":
                  progress.append(event)
          print(f"Progress samples: {len(progress)}")
          if progress:
              first, last = progress[0], progress[-1]
              print(f"Publisher first/last: {first.get('publisher_position')} -> {last.get('publisher_position')}")
              print(f"Publisher chunk first/last: {first.get('publisher_chunk')} -> {last.get('publisher_chunk')}")
              print(f"Chunks first/last: {first.get('chunks_received')} -> {last.get('chunks_received')}")
              print(f"Server post-move first/last: {first.get('server_post_move_updates')} -> {last.get('server_post_move_updates')}")
              print(f"Client distance first/last: {first.get('horizontal_distance')} -> {last.get('horizontal_distance')}")
              print(f"Tick synced last: {last.get('tick_synced')}")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-tuple-chunk-walk-${{ github.run_id }}
          path: |
            fleet-1-chunk-walk.log
            fleet-spark-result.json
            test-results.json
            failure-diagnostics.txt
            bds.log
            endstone.log
            spark.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
