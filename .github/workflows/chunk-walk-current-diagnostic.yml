name: Current Bot Chunk-Walk Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-walk-current-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BOT_REF: "cb329a123de56cb09e07466651d09a0ff06ab0d6"
  ENDSTONE_RUN_ID: "32770415029"

jobs:
  chunk-walk-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout exact current bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Seed chunk-walk from server publisher and expose progress
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bot = Path('bot-src/internal/bot/bot.go')
          text = bot.read_text()
          text = text.replace(
              'if cfg.Scenario == ScenarioChunkFly && samePublisher {',
              'if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && samePublisher {',
              1,
          )
          text = text.replace(
              'if cfg.Scenario == ScenarioChunkFly && changedChunk {',
              'if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && changedChunk {',
              1,
          )
          text = text.replace(
              'if onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {',
              'if onlineState && (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !time.Now().Before(nextProgress) {',
              1,
          )
          bot.write_text(text)

          tick = Path('bot-src/internal/bot/tick.go')
          text = tick.read_text()
          text = text.replace(
              'if cfg.Scenario == ScenarioChunkFly && !state.positionReadySnapshot() {',
              'if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !state.positionReadySnapshot() {',
              1,
          )
          tick.write_text(text)
          PY
          gofmt -w bot-src/internal/bot/bot.go bot-src/internal/bot/tick.go

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build current bot
        working-directory: bot-src
        run: |
          go mod tidy
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run authoritative-seeded chunk-walk against real BDS
        run: >-
          python -m controller.chunk_walk_validation
          --bot dist/bds-test-bot
          --count 1
          --profile-seconds 5

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-chunk-walk-${{ github.run_id }}
          path: |
            fleet-1-chunk-walk.log
            fleet-spark-result.json
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
