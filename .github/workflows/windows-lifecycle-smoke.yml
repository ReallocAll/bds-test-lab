name: Windows Endstone lifecycle smoke

on:
  pull_request:
    paths:
      - ".github/workflows/windows-lifecycle-smoke.yml"
      - "controller/windows_lifecycle_smoke.py"
      - "controller/combined_pack_gamerule_fleet_exact_runner.py"
      - "controller/python_evidence_provenance.py"
      - "controller/run_test.py"
      - "fixtures/endstone-ci-lifecycle-control/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: "653e6821a45f5b5de5e8d22671960c2024db18be"
  EXPECTED_ENDSTONE_SHA: "46eff9f125f52eac76472d84339ead8fbf51fcd2"
  EXPECTED_ENDSTONE_RUN_ID: "33567087207"
  EXPECTED_ENDSTONE_ARTIFACT_ID: "9824065779"
  EXPECTED_ENDSTONE_VERSION: "0.11.11.dev396"
  EXPECTED_BDS_VERSION: "1.26.45.1"
  EXPECTED_BDS_PROTOCOL_VERSION: "26.45"

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install smoke dependencies and lifecycle fixture
        run: |
          python -m pip install --disable-pip-version-check psutil packaging hatchling
          python -m pip install --disable-pip-version-check ./fixtures/endstone-ci-lifecycle-control

      - name: Validate exact Spark artifact
        run: >-
          python -m controller.assert_spark_artifact
          --platform windows
          --expected-sha ${{ env.EXPECTED_SPARK_SHA }}

      - name: Compile lifecycle controllers
        run: >-
          python -m py_compile
          controller/windows_lifecycle_smoke.py
          controller/combined_pack_gamerule_fleet_exact_runner.py
          fixtures/endstone-ci-lifecycle-control/src/endstone_ci_lifecycle_control/__init__.py

      - name: Run exact repeated startup/shutdown smoke
        run: python -m controller.windows_lifecycle_smoke

      - name: Verify canonical bStats evidence
        if: always()
        run: python -m controller.verify_bstats_evidence --result test-results.json

      - name: Upload lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-lifecycle-smoke-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            bstats-config.toml
            test-results.json
            failure-diagnostics.txt
            work/windows/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 14
