name: Final profiler matrix validator checks

on:
  pull_request:
    paths:
      - "controller/final_profiler_matrix.py"
      - "controller/final_control_monitoring.py"
      - "controller/python_multi_plugin_validation.py"
      - "controller/python_profile_payload.py"
      - "controller/python_evidence_provenance.py"
      - "controller/bot_validation.py"
      - "controller/cross_platform_fleet_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/scenario_validation.py"
      - "controller/run_test.py"
      - "controller/bstats.py"
      - "providers/artifact_provider.py"
      - "tests/test_final_profiler_matrix.py"
      - "tests/test_final_control_monitoring.py"
      - "tests/test_python_multi_plugin_validation.py"
      - ".github/workflows/final-profiler-matrix-checks.yml"
      - ".github/workflows/final-profiler-matrix.yml"
      - ".github/workflows/final-control-monitoring.yml"
      - ".github/workflows/python-attribution-multi-plugin.yml"
      - "fixtures/endstone-final-comparable-workload/**"
      - "fixtures/spark-allocation-live-test/**"
      - "fixtures/spark-python-attribution-plugin-a/**"
      - "fixtures/spark-python-attribution-plugin-b/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil ruff
      - name: Compile validator modules and tests
        run: >-
          python -m py_compile
          controller/final_profiler_matrix.py
          controller/final_control_monitoring.py
          controller/python_multi_plugin_validation.py
          controller/python_profile_payload.py
          controller/python_evidence_provenance.py
          controller/bot_validation.py
          controller/cross_platform_fleet_validation.py
          controller/fleet_spark_validation.py
          controller/scenario_validation.py
          controller/run_test.py
          controller/bstats.py
          providers/artifact_provider.py
          tests/test_final_profiler_matrix.py
          tests/test_final_control_monitoring.py
          tests/test_python_multi_plugin_validation.py
          fixtures/endstone-final-comparable-workload/src/endstone_final_comparable_workload/__init__.py
          fixtures/spark-allocation-live-test/src/spark_allocation_live_test/__init__.py
          fixtures/spark-python-attribution-plugin-a/src/endstone_spark_python_attribution_a/__init__.py
          fixtures/spark-python-attribution-plugin-b/src/endstone_spark_python_attribution_b/__init__.py
      - name: Run final profiler matrix tests
        run: >-
          python -m unittest
          tests.test_final_profiler_matrix
          tests.test_final_control_monitoring
          tests.test_python_multi_plugin_validation
      - name: Ruff validator modules and tests
        run: >-
          ruff check --ignore EXE001
          controller/final_profiler_matrix.py
          controller/final_control_monitoring.py
          controller/python_multi_plugin_validation.py
          controller/python_profile_payload.py
          controller/python_evidence_provenance.py
          controller/bot_validation.py
          controller/run_test.py
          controller/bstats.py
          providers/artifact_provider.py
          tests/test_final_profiler_matrix.py
          tests/test_final_control_monitoring.py
          tests/test_python_multi_plugin_validation.py
          fixtures/endstone-final-comparable-workload/src/endstone_final_comparable_workload/__init__.py
          fixtures/spark-allocation-live-test/src/spark_allocation_live_test/__init__.py
          fixtures/spark-python-attribution-plugin-a/src/endstone_spark_python_attribution_a/__init__.py
          fixtures/spark-python-attribution-plugin-b/src/endstone_spark_python_attribution_b/__init__.py

  alloc-live-real-bds:
    name: Strict alloc-live real BDS
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SPARK_SHA: 653e6821a45f5b5de5e8d22671960c2024db18be
      BOT_REF: f175e4a6551d1973628b5ca926a497e9962c1302
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect alloc-live validation scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual,,}" = "${HEAD_SHA,,}"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if grep -Eq '^(controller/final_profiler_matrix\.py|tests/test_final_profiler_matrix\.py|fixtures/spark-allocation-live-test/|\.github/workflows/final-profiler-matrix-checks\.yml)$' <<<"$changed"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
          echo "LAB_SHA=$actual" >> "$GITHUB_ENV"
      - name: Checkout bot at exact SHA
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false
      - name: Set up Go 1.25
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Build and record exact bot revision
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd bot-src
          actual_bot_sha="$(git rev-parse HEAD)"
          test "${actual_bot_sha,,}" = "${BOT_REF,,}"
          go mod download
          go test ./...
          go build -trimpath -o ../dist-bds-test-bot ./cmd/bds-test-bot
          chmod +x ../dist-bds-test-bot
          echo "BOT_SHA=$actual_bot_sha" >> "$GITHUB_ENV"
      - name: Set up Python 3.13
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check psutil hatchling
      - name: Require exact Spark artifact
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: >-
          python -m controller.assert_spark_artifact
          --platform linux
          --expected-sha "$SPARK_SHA"
      - name: Run strict real-BDS alloc-live-only case
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: >-
          python -m controller.final_profiler_matrix
          --mode alloc-live-only
          --bot "$GITHUB_WORKSPACE/dist-bds-test-bot"
          --spark-sha "$SPARK_SHA"
          --bot-ref "$BOT_REF"
          --evidence-root evidence
      - name: Verify canonical bStats evidence
        if: always() && steps.scope.outputs.run == 'true'
        run: >-
          python -m controller.verify_bstats_evidence
          --result evidence/alloc-live-only/test-results.json
      - name: Verify strict alloc-live result independently
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('evidence/alloc-live-only/test-results.json')
          if not path.is_file():
              raise SystemExit('alloc-live result is missing')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('status') != 'PASS':
              raise SystemExit(f"alloc-live status is not PASS: {data.get('error_summary')}")
          provenance = data.get('provenance') or {}
          if (provenance.get('spark_sha') or '').lower() != os.environ['SPARK_SHA'].lower():
              raise SystemExit(f"unexpected Spark SHA: {provenance.get('spark_sha')}")
          measurement = data.get('measurement') or {}
          if not measurement.get('profiler_start_acknowledgement'):
              raise SystemExit('profiler start acknowledgement was not recorded')
          retained = (data.get('workload') or {}).get('retained_allocation') or {}
          expected_bytes = 24 * (1 << 20)
          if retained.get('retained_blocks_before_cleanup') != 24 or retained.get('retained_bytes_before_cleanup') != expected_bytes:
              raise SystemExit(f"retained fixture mismatch: {retained}")
          if not retained.get('cleaned_up'):
              raise SystemExit(f"retained allocation was not cleaned up: {retained}")
          assertions = data.get('semantic_assertions') or {}
          if not assertions or not all(assertions.values()) or not assertions.get('retained_helper_chain'):
              raise SystemExit(f"strict semantic assertions failed: {assertions}")
          profile = data.get('profile') or {}
          if int(profile.get('raw_bytes') or 0) <= 0:
              raise SystemExit(f"raw allocation profile is empty: {profile}")
          incomplete = (data.get('quality') or {}).get('incomplete_flags') or {}
          if any(incomplete.values()):
              raise SystemExit(f"profile reports incomplete flags: {incomplete}")
          print('strict alloc-live independent verification PASS')
          PY
      - name: Add alloc-live evidence summary
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          path = Path('evidence/alloc-live-only/test-results.json')
          print('## Strict alloc-live real BDS')
          print()
          print(f"Harness SHA: `{os.environ.get('LAB_SHA')}`")
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
              provenance = data.get('provenance') or {}
              profile = data.get('profile') or {}
              print(f"Result: **{data.get('status')}**")
              print(f"Spark SHA: `{provenance.get('spark_sha')}`")
              print(f"Endstone SHA: `{(provenance.get('endstone') or {}).get('sha')}`")
              print(f"Bot SHA: `{provenance.get('bot_sha')}`")
              print(f"Viewer: {profile.get('viewer_url')}")
              print(f"Assertions: `{data.get('semantic_assertions')}`")
              print(f"Quality: `{data.get('quality')}`")
          else:
              print('Result: **missing**')
          PY
      - name: Upload alloc-live evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: spark-alloc-live-premerge-${{ github.run_id }}
          path: |
            evidence/alloc-live-only/test-results.json
            evidence/alloc-live-only/profiler-mode-result.json
            evidence/alloc-live-only/metadata.json
            evidence/alloc-live-only/bstats-config.toml
            evidence/alloc-live-only/evidence-manifest.json
            evidence/alloc-live-only/allocation-live-state.json
            evidence/alloc-live-only/*.sparkprofile
            evidence/alloc-live-only/*-profile-summary.json
            evidence/alloc-live-only/bds.log
            evidence/alloc-live-only/endstone.log
            evidence/alloc-live-only/spark.log
            evidence/alloc-live-only/bot.log
            evidence/alloc-live-only/failure-diagnostics.txt
            evidence/alloc-live-only/work/linux/bedrock_server/server.properties
            evidence/alloc-live-only/work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 30
