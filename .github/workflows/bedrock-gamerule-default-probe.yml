name: Bedrock Gamerule Default Probe

on:
  push:
    branches: [main]
    paths:
      - "gamerule-default-probe-trigger.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: Fresh BDS gamerule defaults
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Resolve exact Spark artifact
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("gamerule-default-probe-trigger.json").read_text(encoding="utf-8"))
          sha = str(data["spark_sha"]).strip()
          if len(sha) != 40:
              raise SystemExit(f"invalid spark SHA: {sha!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"EXPECTED_SPARK_SHA={sha}\n")
          print(f"Spark SHA: {sha}")
          PY

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging

      - name: Require exact Spark artifact
        run: python -m controller.assert_spark_artifact --platform linux --expected-sha "$EXPECTED_SPARK_SHA"

      - name: Probe fresh Bedrock gamerule defaults
        run: python -m controller.gamerule_default_probe

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bedrock-gamerule-defaults-${{ github.run_id }}
          path: |
            metadata.json
            test-results.json
            bds.log
            endstone.log
            spark.log
            failure-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30
