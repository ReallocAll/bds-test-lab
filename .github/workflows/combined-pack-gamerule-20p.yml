name: Spark Combined Pack Gamerule 20-Player E2E

on:
  push:
    branches:
      - main
      - test/combined-pack-gamerule-20p
    paths:
      - "triggers/combined-pack-gamerule-20p.json"
  workflow_dispatch:
    inputs:
      spark_sha:
        description: "Exact ReallocAll/spark SHA to validate"
        required: true
        default: "78314038b67d506ec48da9a61181c0048fb3658e"
      profile_seconds:
        description: "Seconds for the online execution profile"
        required: false
        default: "30"

concurrency:
  group: spark-combined-pack-gamerule-20p-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: ${{ github.event.inputs.spark_sha || '' }}
  EXPECTED_ENDSTONE_SHA: "c76c814289ee3be8a7236389b6bdeb5728b154e4"
  EXPECTED_ENDSTONE_RUN_ID: "32992839821"
  EXPECTED_ENDSTONE_VERSION: "0.11.10.dev387"
  EXPECTED_BDS_VERSION: "1.26.44.3"
  BOT_REF: "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a"
  PROFILE_SECONDS: ${{ github.event.inputs.profile_seconds || '' }}

jobs:
  combined-e2e:
    name: ${{ matrix.platform }} real packs + modified gamerules + 20 players
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            bot_name: bds-test-bot
            endstone_artifact_id: "9616075557"
          - platform: windows
            os: windows-2022
            bot_name: bds-test-bot.exe
            endstone_artifact_id: "9616071559"
    env:
      EXPECTED_ENDSTONE_ARTIFACT_ID: ${{ matrix.endstone_artifact_id }}

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Resolve exact 20-player trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          spark_sha = os.environ.get("EXPECTED_SPARK_SHA", "").strip().lower()
          seconds = os.environ.get("PROFILE_SECONDS", "").strip()
          if event == "push":
              trigger = Path("triggers/combined-pack-gamerule-20p.json")
              if not trigger.is_file():
                  raise SystemExit(f"explicit trigger is missing: {trigger}")
              data = json.loads(trigger.read_text(encoding="utf-8"))
              if set(data) != {"spark_sha", "profile_seconds"}:
                  raise SystemExit(f"unexpected trigger keys: {sorted(data)}")
              spark_sha = str(data["spark_sha"]).strip().lower()
              seconds = str(data["profile_seconds"]).strip()
          elif event != "workflow_dispatch":
              raise SystemExit(f"unsupported event: {event}")
          if len(spark_sha) != 40 or any(ch not in "0123456789abcdef" for ch in spark_sha):
              raise SystemExit(f"invalid exact Spark SHA: {spark_sha!r}")
          if not seconds.isdigit() or not 30 <= int(seconds) <= 300:
              raise SystemExit(f"profile_seconds must be in 30..300: {seconds!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"EXPECTED_SPARK_SHA={spark_sha}\n")
              env.write(f"PROFILE_SECONDS={seconds}\n")
          print(f"Spark SHA: {spark_sha}")
          print(f"Profile seconds: {seconds}")
          PY

      - name: Validate immutable provenance inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SPARK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Spark SHA is not exact" >&2; exit 1; }
          [[ "$EXPECTED_ENDSTONE_SHA" == "c76c814289ee3be8a7236389b6bdeb5728b154e4" ]] || { echo "Endstone SHA drift" >&2; exit 1; }
          [[ "$EXPECTED_ENDSTONE_RUN_ID" == "32992839821" ]] || { echo "Endstone run drift" >&2; exit 1; }
          case "${{ matrix.platform }}" in
            linux) expected_artifact="9616075557" ;;
            windows) expected_artifact="9616071559" ;;
            *) echo "unsupported platform" >&2; exit 1 ;;
          esac
          [[ "$EXPECTED_ENDSTONE_ARTIFACT_ID" == "$expected_artifact" ]] || { echo "Endstone artifact drift" >&2; exit 1; }
          [[ "$EXPECTED_ENDSTONE_VERSION" == "0.11.10.dev387" ]] || { echo "Endstone version drift" >&2; exit 1; }
          [[ "$EXPECTED_BDS_VERSION" == "1.26.44.3" ]] || { echo "BDS version drift" >&2; exit 1; }
          [[ "$BOT_REF" == "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a" ]] || { echo "bot SHA drift" >&2; exit 1; }

      - name: Wait for exact Spark CI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${EXPECTED_SPARK_SHA}&per_page=30")"
            build="$(jq -r '[.workflow_runs[] | select(.name == "Build")][0].conclusion // ""' <<<"$json")"
            python_ci="$(jq -r '[.workflow_runs[] | select(.name == "Python attribution")][0].conclusion // ""' <<<"$json")"
            echo "Spark CI attempt ${attempt}: Build=${build:-pending} Python=${python_ci:-pending}"
            if [[ "$build" == success && "$python_ci" == success ]]; then
              break
            fi
            for conclusion in "$build" "$python_ci"; do
              if [[ "$conclusion" == failure || "$conclusion" == cancelled || "$conclusion" == timed_out ]]; then
                echo "Exact Spark CI failed: Build=$build Python=$python_ci" >&2
                exit 1
              fi
            done
            if (( attempt == 80 )); then
              echo "Timed out waiting for exact Spark CI" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Checkout Bot at exact ref
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact Bot revision
        shell: bash
        env:
          BOT_NAME: ${{ matrix.bot_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o "../dist/${BOT_NAME}" ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging

      - name: Require exact Spark artifact
        run: >-
          python -m controller.assert_spark_artifact
          --platform ${{ matrix.platform }}
          --expected-sha ${{ env.EXPECTED_SPARK_SHA }}

      - name: Run combined real-BDS E2E
        run: >-
          python -m controller.combined_pack_gamerule_fleet_exact_runner
          --platform ${{ matrix.platform }}
          --bot dist/${{ matrix.bot_name }}
          --profile-seconds ${{ env.PROFILE_SECONDS }}

      - name: Add combined evidence to summary
        if: always()
        shell: bash
        run: |
          if [[ -f fleet-spark-result.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet-spark-result.json").read_text())
          metadata = json.loads(Path("metadata.json").read_text()) if Path("metadata.json").is_file() else {}
          components = metadata.get("components") or {}
          spark = components.get("spark") or {}
          endstone = components.get("endstone") or {}
          metrics = data.get("metrics") or {}
          mspt = metrics.get("mspt_10s") or {}
          tps = metrics.get("tps") or {}
          mem = metrics.get("memory_rss_bytes") or {}
          print(f"## {data.get('platform')} combined E2E")
          print()
          print(f"Status: **{data.get('status')}**")
          print(f"BDS protocol: `{data.get('bds_version')}`")
          print(f"Spark SHA: `{spark.get('sha')}`")
          print(f"Endstone SHA: `{endstone.get('sha')}`")
          print(f"Endstone run/artifact: `{endstone.get('run_id')}` / `{(endstone.get('artifact') or {}).get('id')}`")
          print(f"Local metadata players: {data.get('local_metadata_players')}")
          print(f"Behavior packs: {[p.get('name') for p in data.get('behavior_pack_metadata', [])]}")
          print(f"Gamerules: {data.get('validated_gamerules')}")
          print(f"Health: {data.get('health_upload_viewer_url')}")
          print(f"Execution: {data.get('execution_profile_viewer_url')}")
          print(f"Allocation: {data.get('allocation_profile_viewer_url')}")
          print(f"TPS 10s: {tps.get('10s')}")
          print(f"MSPT mean/p95/max: {mspt.get('mean')} / {mspt.get('p95')} / {mspt.get('max')}")
          print(f"RSS mean/p95/max: {mem.get('mean')} / {mem.get('p95')} / {mem.get('max')}")
          PY
          fi >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-combined-${{ matrix.platform }}-20p-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            fleet-${{ matrix.platform }}-20-chunk-walk-local.log
            fleet-${{ matrix.platform }}-20-chunk-walk-public.log
            test-results.json
            fleet-spark-result.json
            failure-diagnostics.txt
            combined-health-capture-${{ matrix.platform }}/
            work/${{ matrix.platform }}/bedrock_server/server.properties
            work/${{ matrix.platform }}/bedrock_server/version.txt
            work/${{ matrix.platform }}/bedrock_server/worlds/SparkCombinedValidation/world_behavior_packs.json
            work/${{ matrix.platform }}/bedrock_server/behavior_packs/spark_probe_alpha/
            work/${{ matrix.platform }}/bedrock_server/behavior_packs/spark_probe_beta/
            work/${{ matrix.platform }}/bedrock_server/behavior_packs/spark_probe_gamma/
          if-no-files-found: warn
          retention-days: 30
