name: Spark Python Attribution Performance

on:
  push:
    branches:
      - test/python-attribution-performance
    paths:
      - ".github/workflows/python-attribution-performance.yml"
      - "controller/python_attribution_performance.py"
      - "controller/python_attribution_performance_runner.py"
      - "fixtures/spark-python-hotspot-test/**"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Stable measurement seconds per mode"
        required: false
        default: "180"

concurrency:
  group: spark-python-attribution-performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: "9c55164954a003f3d0ae0be6a9c2e91a8e785ab9"
  BOT_REF: "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a"
  BDS_TEST_BOT_SCENARIO_FILE: bot-src/scenarios/mixed-actions.json
  DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '180' }}

jobs:
  benchmark:
    name: Linux / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [off, native, shadow, full, stress]
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7

      - name: Wait for exact Spark CI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${EXPECTED_SPARK_SHA}&per_page=30")"
            build="$(jq -r '[.workflow_runs[] | select(.name == "Build")][0].conclusion // ""' <<<"$json")"
            python_ci="$(jq -r '[.workflow_runs[] | select(.name == "Python attribution")][0].conclusion // ""' <<<"$json")"
            echo "Spark CI attempt ${attempt}: Build=${build:-pending} Python=${python_ci:-pending}"
            if [[ "$build" == success && "$python_ci" == success ]]; then
              exit 0
            fi
            for conclusion in "$build" "$python_ci"; do
              if [[ "$conclusion" == failure || "$conclusion" == cancelled || "$conclusion" == timed_out ]]; then
                echo "Exact Spark CI failed: Build=$build Python=$python_ci" >&2
                exit 1
              fi
            done
            sleep 15
          done
          echo "Timed out waiting for exact Spark CI" >&2
          exit 1

      - name: Checkout exact bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact bot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging hatchling

      - name: Require exact Spark artifact
        run: >-
          python -m controller.assert_spark_artifact
          --platform linux
          --expected-sha ${{ env.EXPECTED_SPARK_SHA }}

      - name: Run 5-bot real-BDS benchmark
        run: >-
          python -m controller.python_attribution_performance_runner
          --platform linux
          --bot dist/bds-test-bot
          --count 5
          --mode ${{ matrix.mode }}
          --duration-seconds ${{ env.DURATION_SECONDS }}

      - name: Add benchmark summary
        if: always()
        shell: bash
        run: |
          if [[ -f python-attribution-performance.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d = json.loads(Path('python-attribution-performance.json').read_text())
          p = d.get('performance') or {}
          t = p.get('tick_statistics') or {}
          print(f"## {d.get('benchmark_mode')}")
          print(f"Status: **{d.get('status')}**")
          print(f"CPU: {p.get('process_cpu_percent_of_one_core')}% of one core")
          print(f"CPU ms/tick: {p.get('cpu_ms_per_tick')}")
          print(f"MSPT mean/p50/p95/p99: {t.get('mspt_mean')} / {t.get('mspt_p50')} / {t.get('mspt_p95')} / {t.get('mspt_p99')}")
          print(f"TPS mean: {t.get('tps_mean')}")
          print(f"RSS mean/peak: {p.get('rss_mean_bytes')} / {p.get('rss_peak_bytes')}")
          print(f"Profile: {p.get('viewer_url')}")
          print(f"Shadow diagnostics: {p.get('shadow_only_diagnostics')}")
          PY
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-attribution-performance-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            test-results.json
            python-attribution-result.json
            python-attribution-performance.json
            python-attribution-tick-metrics.json
            python-attribution-performance.sparkprofile
            python-attribution-bots-linux-5-chunk-walk.log
            failure-diagnostics.txt
            work/linux/bedrock_server/server.properties
            work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 30
