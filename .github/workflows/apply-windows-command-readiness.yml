name: Apply Windows interactive command readiness gate

on:
  push:
    branches:
      - fix/combined-pack-state-oracle

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
      - name: Apply command-readiness gate and focused assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner = Path('controller/combined_pack_gamerule_fleet_exact_runner.py')
          text = runner.read_text(encoding='utf-8')
          old = '''    self.server.lifecycle_registered = True\n    self.check("windows-interactive-lifecycle", "PASS", shutdown_control="cishutdown")\n    version_file = self.server_dir / "version.txt"\n'''
          new = '''    self.server.lifecycle_registered = True\n    readiness_start = self.server.command("spark tps")\n    readiness_lines = self.server.wait_for(\n        lambda lines: any(\n            "tps (5s/10s/1m/5m/15m):" in line.lower() for line in lines[readiness_start:]\n        ),\n        15,\n        "interactive command processing readiness",\n    )\n    self.check(\n        "windows-interactive-command-ready",\n        "PASS",\n        probe="spark tps",\n        output=readiness_lines[readiness_start:][-20:],\n    )\n    self.check("windows-interactive-lifecycle", "PASS", shutdown_control="cishutdown")\n    version_file = self.server_dir / "version.txt"\n'''
          if old in text:
              text = text.replace(old, new, 1)
              runner.write_text(text, encoding='utf-8')
          elif 'windows-interactive-command-ready' not in text:
              raise SystemExit('runner readiness anchor not found')

          tests = Path('tests/test_combined_pack_exact_runner.py')
          text = tests.read_text(encoding='utf-8')
          old = '''class _StartedServer:\n    created_cmd: list[str] | None = None\n\n    def __init__(self, cmd: list[str], root: Path, log_path: Path) -> None:\n'''
          new = '''class _StartedServer:\n    created_cmd: list[str] | None = None\n    commands: list[str] = []\n\n    def __init__(self, cmd: list[str], root: Path, log_path: Path) -> None:\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'commands: list[str] = []' not in text:
              raise SystemExit('started-server class anchor not found')

          old = '''            "[Endstone] Enabling spark v0.6.0",\n            "[CiLifecycleControl] CI lifecycle control enabled; cishutdown registered",\n        ]\n'''
          new = '''            "[Endstone] Enabling spark v0.6.0",\n            "[CiLifecycleControl] CI lifecycle control enabled; cishutdown registered",\n            "TPS (5s/10s/1m/5m/15m): 20.00 / 20.00 / 20.00 / 20.00 / 20.00",\n        ]\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'TPS (5s/10s/1m/5m/15m): 20.00' not in text:
              raise SystemExit('wait-for fixture anchor not found')

          old = '''    def snapshot(self) -> list[str]:\n        return ["[EndstoneServer] Version: 1.26.44.3"]\n\n\nclass _WaitProcess:\n'''
          new = '''    def command(self, command: str) -> int:\n        type(self).commands.append(command)\n        return 0\n\n    def snapshot(self) -> list[str]:\n        return ["[EndstoneServer] Version: 1.26.44.3"]\n\n\nclass _WaitProcess:\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'type(self).commands.append(command)' not in text:
              raise SystemExit('started-server command anchor not found')

          old = '''            _StartedServer.created_cmd = None\n            with (\n'''
          new = '''            _StartedServer.created_cmd = None\n            _StartedServer.commands = []\n            with (\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '_StartedServer.commands = []' not in text:
              raise SystemExit('test reset anchor not found')

          old = '''        self.assertEqual(validator.result["bds_version"], "26.44")\n        lifecycle = [\n'''
          new = '''        self.assertEqual(validator.result["bds_version"], "26.44")\n        self.assertEqual(_StartedServer.commands, ["spark tps"])\n        readiness = [\n            fields\n            for name, status, fields in validator.checks\n            if name == "windows-interactive-command-ready" and status == "PASS"\n        ]\n        self.assertEqual(readiness[0]["probe"], "spark tps")\n        lifecycle = [\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'self.assertEqual(_StartedServer.commands, ["spark tps"])' not in text:
              raise SystemExit('test assertion anchor not found')
          tests.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo 'Windows readiness gate already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controller/combined_pack_gamerule_fleet_exact_runner.py tests/test_combined_pack_exact_runner.py
          git commit -m 'test: prove Windows interactive command readiness'
          git push origin HEAD:fix/combined-pack-state-oracle
