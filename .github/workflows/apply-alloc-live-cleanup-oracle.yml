name: Apply alloc-live cleanup state oracle

on:
  push:
    branches:
      - fix/alloc-live-profiler-first

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
      - name: Require durable stopped cleanup state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('controller/final_profiler_matrix.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if cleaned:\n            if state.get("cleaned_up") is not True or state.get("status") != "cleaned":\n                raise RuntimeError(f"retained allocation cleanup was not proven: {state}")\n            if state.get("retained_blocks") != 0 or state.get("retained_bytes") != 0:\n'''
          new = '''        if cleaned:\n            if state.get("cleaned_up") is not True or state.get("status") != "cleaned":\n                raise RuntimeError(f"retained allocation cleanup was not proven: {state}")\n            if state.get("started") is not False:\n                raise RuntimeError(f"retained allocation cleanup left the scheduler armed: {state}")\n            if state.get("retained_blocks") != 0 or state.get("retained_bytes") != 0:\n'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif 'cleanup left the scheduler armed' not in text:
              raise SystemExit('cleanup validation anchor not found')
          PY
          if git diff --quiet; then
            echo 'cleanup oracle already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controller/final_profiler_matrix.py
          git commit -m 'test: require stopped retained-allocation cleanup state'
          git push origin HEAD:fix/alloc-live-profiler-first
