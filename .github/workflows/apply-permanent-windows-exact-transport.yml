name: Apply permanent Windows exact transport

on:
  push:
    branches: [fix/combined-pack-state-oracle]
    paths:
      - ".github/workflows/apply-permanent-windows-exact-transport.yml"
      - ".github/apply_permanent_windows_exact_transport.py"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/combined-pack-state-oracle
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0

      - name: Apply permanent exact transport
        run: python .github/apply_permanent_windows_exact_transport.py

      - name: Validate transport and runners
        run: |
          python -m pip install --disable-pip-version-check psutil packaging hatchling pyyaml ruff
          python -m py_compile controller/combined_pack_gamerule_fleet_exact_runner.py controller/combined_windows_final_runner.py tests/test_combined_pack_exact_runner.py tests/test_combined_windows_final_runner.py
          python -m unittest tests.test_combined_pack_exact_runner tests.test_combined_windows_final_runner
          ruff check controller/combined_pack_gamerule_fleet_exact_runner.py controller/combined_windows_final_runner.py tests/test_combined_pack_exact_runner.py tests/test_combined_windows_final_runner.py
          git diff --check

      - name: Commit source and tests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/combined_pack_gamerule_fleet_exact_runner.py controller/combined_windows_final_runner.py tests/test_combined_pack_exact_runner.py tests/test_combined_windows_final_runner.py
          git commit -m "refactor: centralize Windows exact command transport"
          git push origin HEAD:fix/combined-pack-state-oracle
