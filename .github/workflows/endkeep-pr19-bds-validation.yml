name: EndKeep v0.3.0 real BDS (Python 3.12/3.13)

on:
  push:
    branches: [test/endkeep-pr19-bds]
    paths:
      - .github/workflows/endkeep-pr19-bds-validation.yml
      - controller/endkeep_pr19_validation.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-bds:
    name: BDS ${{ matrix.platform }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-24.04, python: '3.12' }
          - { platform: linux, os: ubuntu-24.04, python: '3.13' }
          - { platform: windows, os: windows-2025, python: '3.12' }
          - { platform: windows, os: windows-2025, python: '3.13' }

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install exact supported Endstone plus lab requirements
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'endstone==0.11.13' 'psutil>=6'

      - name: Install published EndKeep v0.3.0 Wheel with its native dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            'https://github.com/ReallocAll/endkeep/releases/download/v0.3.0/endstone_endkeep-0.3.0-py3-none-any.whl#sha256=e319d1038f352caf3f919fb37f130c704c438e8fcff1478147b1a895f4c4af03'
          python -m pip check
          python - <<'PY'
          import sys
          from importlib.metadata import version
          assert version("endstone") == "0.11.13"
          assert version("endstone-endkeep") == "0.3.0"
          amulet = version("amulet-leveldb")
          assert amulet == "3.0.7a0+0.g736228e.dirty", amulet
          print("Verified published EndKeep and backported Amulet:", sys.version, amulet)
          PY

      - name: Real BDS startup, BASE/DELTA, deep verify, export and offline restore
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m controller.endkeep_pr19_validation --platform ${{ matrix.platform }}

      - name: Upload BDS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endkeep-v030-bds-${{ matrix.platform }}-py${{ matrix.python }}
          path: |
            endkeep-bds-result.json
            endkeep-bds.log
            endkeep-error.txt
            work/${{ matrix.platform }}/backups/worker.log
          if-no-files-found: warn
          retention-days: 14
