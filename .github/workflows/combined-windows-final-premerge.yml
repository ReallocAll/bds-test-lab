name: Final Windows combined 20-player premerge

on:
  pull_request:
    paths:
      - ".github/workflows/combined-windows-final-premerge.yml"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: "653e6821a45f5b5de5e8d22671960c2024db18be"
  EXPECTED_ENDSTONE_SHA: "46eff9f125f52eac76472d84339ead8fbf51fcd2"
  EXPECTED_ENDSTONE_RUN_ID: "33567087207"
  EXPECTED_ENDSTONE_ARTIFACT_ID: "9824065779"
  EXPECTED_ENDSTONE_VERSION: "0.11.11.dev396"
  EXPECTED_BDS_VERSION: "1.26.45.1"
  BOT_REF: "f175e4a6551d1973628b5ca926a497e9962c1302"

jobs:
  windows-combined:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout exact lab head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for final Spark Build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${EXPECTED_SPARK_SHA}&per_page=30")"
            build="$(jq -r '[.workflow_runs[] | select(.name == "Build")][0].conclusion // ""' <<<"$json")"
            echo "attempt ${attempt}: Build=${build:-pending}"
            if [[ "$build" == success ]]; then exit 0; fi
            if [[ "$build" == failure || "$build" == cancelled || "$build" == timed_out ]]; then exit 1; fi
            sleep 15
          done
          exit 1

      - name: Checkout exact bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact bot
        shell: bash
        run: |
          set -euo pipefail
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot.exe ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies and lifecycle control
        run: >-
          python -m pip install --disable-pip-version-check
          psutil packaging
          ./fixtures/endstone-ci-lifecycle-control

      - name: Require exact final Spark artifact
        run: >-
          python -m controller.assert_spark_artifact
          --platform windows
          --expected-sha "$env:EXPECTED_SPARK_SHA"

      - name: Run exact Windows combined E2E
        run: >-
          python -m controller.combined_pack_gamerule_fleet_exact_runner
          --platform windows
          --bot dist/bds-test-bot.exe
          --profile-seconds 30

      - name: Verify bStats evidence
        if: always()
        run: >-
          python -m controller.verify_bstats_evidence
          --result test-results.json
          --result fleet-spark-result.json

      - name: Independent final checks
        if: always()
        shell: pwsh
        run: |
          python -c "import json,sys; d=json.load(open('fleet-spark-result.json')); assert d.get('status')=='PASS',d.get('error_summary'); assert d.get('local_metadata_players')==20; assert d.get('health_upload_viewer_url'); assert d.get('execution_profile_viewer_url'); assert d.get('allocation_profile_viewer_url'); ev=d.get('shutdown_lifecycle_events') or []; assert ev and all(x.get('wrapper_return_code')==0 and x.get('process_tree_verification')=='clean' and not x.get('forced') for x in ev); print('Windows combined final PASS')"

      - name: Upload final Windows combined evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-combined-windows-final-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            fleet-windows-20-chunk-walk-local.log
            fleet-windows-20-chunk-walk-public.log
            test-results.json
            fleet-spark-result.json
            bstats-config.toml
            failure-diagnostics.txt
            combined-health-capture-windows/
            work/windows/bedrock_server/server.properties
            work/windows/bedrock_server/version.txt
            work/windows/bedrock_server/worlds/SparkCombinedValidation/world_behavior_packs.json
            work/windows/bedrock_server/behavior_packs/spark_probe_alpha/
            work/windows/bedrock_server/behavior_packs/spark_probe_beta/
            work/windows/bedrock_server/behavior_packs/spark_probe_gamma/
          if-no-files-found: warn
          retention-days: 30
