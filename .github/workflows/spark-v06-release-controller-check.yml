name: Spark v0.6 Release Controller Check

on:
  push:
    branches:
      - test/spark-v0.6-release-validation
    paths:
      - "controller/release_validation.py"
      - "controller/release_validation_exact_runner.py"
      - "controller/python_evidence_provenance.py"
      - "controller/assert_spark_artifact.py"
      - "controller/run_test.py"
      - "controller/block_actor_validation.py"
      - "providers/artifact_provider.py"
      - "tests/test_artifact_provider.py"
      - "tests/test_run_test.py"
      - "tests/test_block_actor_validation.py"
      - "tests/test_release_validation.py"
      - "tests/test_python_evidence_provenance.py"
      - ".github/workflows/spark-v06-release-validation.yml"
      - ".github/workflows/spark-block-actor-validation.yml"
      - ".github/workflows/spark-v06-release-controller-check.yml"
  pull_request:
    paths:
      - "controller/release_validation.py"
      - "controller/release_validation_exact_runner.py"
      - "controller/python_evidence_provenance.py"
      - "controller/assert_spark_artifact.py"
      - "controller/run_test.py"
      - "controller/block_actor_validation.py"
      - "providers/artifact_provider.py"
      - "tests/test_artifact_provider.py"
      - "tests/test_run_test.py"
      - "tests/test_block_actor_validation.py"
      - "tests/test_release_validation.py"
      - "tests/test_python_evidence_provenance.py"
      - ".github/workflows/spark-v06-release-validation.yml"
      - ".github/workflows/spark-block-actor-validation.yml"
      - ".github/workflows/spark-v06-release-controller-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install controller dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging pyyaml
      - name: Compile release controllers
        run: >-
          python -m py_compile
          controller/release_validation.py
          controller/release_validation_exact_runner.py
          controller/python_evidence_provenance.py
          controller/assert_spark_artifact.py
          controller/run_test.py
          controller/block_actor_validation.py
          providers/artifact_provider.py
          tests/test_artifact_provider.py
          tests/test_run_test.py
          tests/test_block_actor_validation.py
          tests/test_release_validation.py
          tests/test_python_evidence_provenance.py
      - name: Run controller tests
        run: >-
          python -m unittest
          tests.test_artifact_provider
          tests.test_run_test
          tests.test_block_actor_validation
          tests.test_release_validation
          tests.test_python_evidence_provenance
          -v
      - name: Parse release workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (
              Path('.github/workflows/spark-v06-release-validation.yml'),
              Path('.github/workflows/spark-block-actor-validation.yml'),
              Path('.github/workflows/spark-v06-release-controller-check.yml'),
          ):
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print(f'parsed {path}')
          PY
      - name: Verify module imports
        run: |
          python - <<'PY'
          import controller.assert_spark_artifact
          import controller.block_actor_validation
          import controller.python_evidence_provenance
          import controller.release_validation
          import controller.release_validation_exact_runner
          import controller.run_test
          import providers.artifact_provider
          print("release controller imports: PASS")
          PY
