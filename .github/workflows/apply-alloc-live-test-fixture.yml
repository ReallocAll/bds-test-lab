name: Apply alloc-live cleanup test fixture

on:
  push:
    branches:
      - fix/alloc-live-profiler-first
    paths:
      - ".github/workflows/apply-alloc-live-test-fixture.yml"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/alloc-live-profiler-first
          fetch-depth: 0
          persist-credentials: false
      - name: Align cleaned fixture with scheduler-disarmed contract
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_final_profiler_matrix.py')
          s = p.read_text()
          old = '"status": "cleaned",\n                        "started": True,'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly two stale cleaned fixtures, found {count}')
          p.write_text(s.replace(old, '"status": "cleaned",\n                        "started": False,'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_final_profiler_matrix.py
          git commit -m 'test: require alloc-live scheduler disarmed after cleanup'
          git push "https://x-access-token:${GH_TOKEN}@github.com/ReallocAll/bds-test-lab.git" HEAD:fix/alloc-live-profiler-first
