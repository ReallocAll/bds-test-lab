name: Reference Client Movement Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/reference-movement-diagnostic.yml"
      - "controller/reference_movement_validation.py"
      - "controller/movement_bds_only_validation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"

jobs:
  reference-movement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Pin known-good Endstone artifact run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider discover target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - name: Checkout reference client
        uses: actions/checkout@v7
        with:
          repository: smell-of-curry/go-test-bds
          ref: 5fe6b762fe3665caa980a2a25be1ede26e5793fc
          path: reference-src
          persist-credentials: false

      - name: Set up Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Upgrade reference protocol and build
        working-directory: reference-src
        run: |
          go get github.com/sandertv/gophertunnel@v1.59.0
          python3 - <<'PY'
          from pathlib import Path

          unsafe = Path("gotestbds/internal/unsafe.go")
          unsafe.write_text(unsafe.read_text().replace("\t\tHasNetworkID:   true,\n", ""))

          config = Path("gotestbds/actor/config.go")
          config.write_text(config.read_text().replace("protocol.NewBitset(packet.PlayerAuthInputBitsetSize)", "protocol.NewInputFlags(packet.InputFlagCount)"))

          movement = Path("gotestbds/actor/movement.go")
          text = movement.read_text()
          text = text.replace("movementBitset                                                       protocol.Bitset", "movementBitset                                                       protocol.InputFlags")
          text = text.replace("protocol.NewBitset(packet.PlayerAuthInputBitsetSize)", "protocol.NewInputFlags(packet.InputFlagCount)")
          text = text.replace("\t\tBlockActions:      a.blockActions(),\n", "\t\tBlockActions:      protocol.Option(a.blockActions()),\n")
          text = text.replace(
              "// SendMovement sends movement to the server.\nfunc (a *Actor) SendMovement() {\n",
              "// safeMoveVector preserves an idle zero vector instead of normalising it to NaN.\nfunc safeMoveVector(v mgl32.Vec2) mgl32.Vec2 {\n\tif v.LenSqr() == 0 {\n\t\treturn mgl32.Vec2{}\n\t}\n\treturn v.Normalize()\n}\n\n// SendMovement sends movement to the server.\nfunc (a *Actor) SendMovement() {\n",
              1,
          )
          text = text.replace("\t\tMoveVector:        moveVector.Normalize(),\n", "\t\tMoveVector:        safeMoveVector(moveVector),\n", 1)
          movement.write_text(text)

          correction = Path("gotestbds/bot/handler_correct_player_move_prediction.go")
          text = correction.read_text()
          old = '''\tif b != nil && b.logger != nil {\n\t\tb.logger.Warn("mismatched movement", slog.String("src", "CorrectPlayerMovePrediction"))\n\t}\n\tcorrect := p.(*packet.CorrectPlayerMovePrediction)\n'''
          new = '''\tcorrect := p.(*packet.CorrectPlayerMovePrediction)\n\tif b != nil && b.logger != nil {\n\t\tb.logger.Warn("mismatched movement",\n\t\t\tslog.String("src", "CorrectPlayerMovePrediction"),\n\t\t\tslog.Uint64("tick", correct.Tick),\n\t\t\tslog.Any("position", correct.Position),\n\t\t\tslog.Any("delta", correct.Delta),\n\t\t\tslog.Uint64("client_tick", a.CurrentTick()),\n\t\t\tslog.Any("client_feet", a.Position()),\n\t\t)\n\t}\n'''
          if old not in text:
              raise SystemExit("correction logging target not found")
          correction.write_text(text.replace(old, new, 1))

          level = Path("gotestbds/bot/handler_level_chunk.go")
          text = level.read_text()
          old = "\tmax := (r.Max() - r.Min() + 1) >> 4\n\tswitch levelChunk.SubChunkCount {\n\tcase protocol.SubChunkRequestModeLimited:\n\t\t// HighestSubChunk indexes from the bottom of the dimension, so everything\n\t\t// above it is air and not worth asking for.\n\t\treturn min(int(levelChunk.HighestSubChunk)+1, max), true\n\tcase protocol.SubChunkRequestModeLimitless:\n\t\treturn max, true\n\t}\n\treturn min(int(levelChunk.SubChunkCount), max), false\n"
          new = "\tmax := (r.Max() - r.Min() + 1) >> 4\n\tif limit, ok := levelChunk.SubChunkLimit.Value(); ok {\n\t\tif limit < 0 {\n\t\t\treturn max, true\n\t\t}\n\t\treturn min(int(limit), max), true\n\t}\n\treturn min(int(levelChunk.SubChunkCount), max), false\n"
          if old not in text:
              raise SystemExit("level chunk compatibility target not found")
          level.write_text(text.replace(old, new, 1))

          sub = Path("gotestbds/bot/handler_subchunk.go")
          text = sub.read_text()
          old = "\t\tbuf.Reset()\n\t\tbuf.Write(entry.RawPayload)\n"
          new = "\t\tbuf.Reset()\n\t\trawPayload, ok := entry.RawPayload.Value()\n\t\tif !ok {\n\t\t\tcontinue\n\t\t}\n\t\tbuf.Write(rawPayload)\n"
          if old not in text:
              raise SystemExit("subchunk compatibility target not found")
          sub.write_text(text.replace(old, new, 1))
          PY
          gofmt -w gotestbds/internal/unsafe.go gotestbds/actor/config.go gotestbds/actor/movement.go gotestbds/bot/handler_correct_player_move_prediction.go gotestbds/bot/handler_level_chunk.go gotestbds/bot/handler_subchunk.go
          go mod tidy
          go build -trimpath -o ../reference-client .

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run reference movement diagnostic
        run: python -m controller.reference_movement_validation --reference-bot reference-client

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-movement-${{ github.run_id }}
          path: |
            test-results.json
            reference-go-test-bds.log
            failure-diagnostics.txt
            bds.log
            work/linux/bedrock_server/server.properties
          if-no-files-found: warn
          retention-days: 7
