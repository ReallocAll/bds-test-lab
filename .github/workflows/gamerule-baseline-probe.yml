name: Gamerule Baseline Probe

on:
  push:
    branches:
      - main
    paths:
      - "gamerule-baseline-trigger.json"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging
      - name: Resolve exact Spark artifact
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("gamerule-baseline-trigger.json").read_text())
          sha = str(data["spark_sha"]).strip()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"EXPECTED_SPARK_SHA={sha}\n")
          print(sha)
          PY
      - name: Require exact Spark artifact
        run: python -m controller.assert_spark_artifact --platform linux --expected-sha ${{ env.EXPECTED_SPARK_SHA }}
      - name: Probe fresh-world Gamerule values
        run: python -m controller.gamerule_baseline_probe
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamerule-baseline-${{ github.run_id }}
          path: |
            gamerule-baseline.json
            test-results.json
            bds.log
            endstone.log
            spark.log
            failure-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
