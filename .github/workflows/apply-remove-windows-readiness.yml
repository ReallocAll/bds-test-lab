name: Ready validated alloc-live PR

on:
  push:
    branches:
      - fix/combined-pack-state-oracle
    paths:
      - ".github/workflows/apply-remove-windows-readiness.yml"

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark validated PR 62 ready
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: gh pr ready 62 --repo ReallocAll/bds-test-lab
