name: Temporary Gamerule Defaults Probe

on:
  push:
    branches:
      - probe/gamerule-defaults
    paths:
      - "controller/gamerule_defaults_probe.py"
      - ".github/workflows/gamerule-defaults-probe.yml"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: "5d19837d15aacfc93a72484c915f787630a3261d"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check psutil packaging
      - run: python -m controller.assert_spark_artifact --platform linux --expected-sha ${{ env.EXPECTED_SPARK_SHA }}
      - run: python -m controller.gamerule_defaults_probe
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamerule-defaults-${{ github.run_id }}
          path: |
            test-results.json
            metadata.json
            bds.log
            work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 7
