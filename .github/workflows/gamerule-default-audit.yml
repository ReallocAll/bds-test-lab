name: Bedrock Gamerule Default Audit

on:
  push:
    branches:
      - test/gamerule-default-audit
    paths:
      - .github/workflows/gamerule-default-audit.yml

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: 5d19837d15aacfc93a72484c915f787630a3261d

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging
      - name: Require known-good Spark artifact
        run: python -m controller.assert_spark_artifact --platform linux --expected-sha "$EXPECTED_SPARK_SHA"
      - name: Query fresh BDS gamerule defaults
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          from controller.release_validation import SparkReleaseValidation

          validation = SparkReleaseValidation("linux", 30, pathlib.Path("/bin/true"))
          try:
              validation.install_artifacts()
              validation.verify_endstone_version()
              validation.start_server()
              queries = {
                  "spawnradius": "5",
                  "randomtickspeed": "1",
                  "recipesunlock": "true",
                  "maxcommandchainlength": "65535",
              }
              observed = {}
              for rule, expected in queries.items():
                  lines = validation.command_check(f"gamerule-{rule}", f"gamerule {rule}")
                  text = "\n".join(lines)
                  observed[rule] = text
                  lowered = text.lower()
                  if expected.lower() not in lowered:
                      raise RuntimeError(f"{rule}: expected default {expected!r}, output={text!r}")
              for rule in ("locatorbar", "playerwaypoints"):
                  lines = validation.command_check(f"gamerule-{rule}", f"gamerule {rule}")
                  observed[rule] = "\n".join(lines)
              pathlib.Path("gamerule-default-audit.json").write_text(
                  json.dumps(observed, indent=2, ensure_ascii=False), encoding="utf-8"
              )
              print(json.dumps(observed, indent=2, ensure_ascii=False))
          finally:
              if validation.server is not None and validation.server.is_alive():
                  validation.shutdown()
          PY
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamerule-default-audit-${{ github.run_id }}
          path: |
            gamerule-default-audit.json
            bds.log
            endstone.log
            spark.log
            test-results.json
          if-no-files-found: warn
          retention-days: 7
