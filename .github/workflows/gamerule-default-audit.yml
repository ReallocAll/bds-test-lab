name: Bedrock Gamerule Default Audit

on:
  push:
    branches:
      - test/gamerule-default-audit
    paths:
      - .github/workflows/gamerule-default-audit.yml

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: 5d19837d15aacfc93a72484c915f787630a3261d

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging
      - name: Require known-good Spark artifact
        run: python -m controller.assert_spark_artifact --platform linux --expected-sha "$EXPECTED_SPARK_SHA"
      - name: Query fresh BDS gamerule defaults
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          from controller.release_validation import SparkReleaseValidation

          rules = [
              "commandblockoutput", "commandblocksenabled", "dodaylightcycle", "doentitydrops",
              "dofiretick", "doimmediaterespawn", "doinsomnia", "dolimitedcrafting", "domobloot",
              "domobspawning", "dotiledrops", "doweathercycle", "drowningdamage", "falldamage",
              "firedamage", "freezedamage", "functioncommandlimit", "keepinventory", "locatorbar",
              "maxcommandchainlength", "mobgriefing", "naturalregeneration", "playerssleepingpercentage",
              "playerwaypoints", "projectilescanbreakblocks", "pvp", "randomtickspeed", "recipesunlock",
              "respawnblocksexplode", "sendcommandfeedback", "showbordereffect", "showcoordinates",
              "showdaysplayed", "showdeathmessages", "showrecipemessages", "showtags", "spawnradius",
              "tntexplodes", "tntexplosiondropdecay",
          ]
          validation = SparkReleaseValidation("linux", 30, pathlib.Path("/bin/true"))
          observed = {}
          try:
              validation.install_artifacts()
              validation.verify_endstone_version()
              validation.start_server()
              for rule in rules:
                  lines = validation.command_check(f"gamerule-{rule}", f"gamerule {rule}")
                  text = "\n".join(lines)
                  value = None
                  for line in reversed(lines):
                      match = re.search(rf"\b{re.escape(rule)}\s*=\s*(.+?)\s*$", line, re.IGNORECASE)
                      if match:
                          value = match.group(1).strip()
                          break
                  observed[rule] = {"value": value, "output": text}
              pathlib.Path("gamerule-default-audit.json").write_text(
                  json.dumps(observed, indent=2, ensure_ascii=False), encoding="utf-8"
              )
              print(json.dumps(observed, indent=2, ensure_ascii=False))
          finally:
              if validation.server is not None and validation.server.is_alive():
                  validation.shutdown()
          PY
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamerule-default-audit-${{ github.run_id }}
          path: |
            gamerule-default-audit.json
            bds.log
            endstone.log
            spark.log
            test-results.json
          if-no-files-found: warn
          retention-days: 7
