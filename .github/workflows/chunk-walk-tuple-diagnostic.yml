name: First Tick One BDS Diagnostic

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/chunk-walk-tuple-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  ENDSTONE_RUN_ID: "32770415029"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Resolve bot ref
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < controller/chunk_fly_bot_ref.txt)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "BOT_REF=$ref" >> "$GITHUB_ENV"

      - name: Pin known-good Endstone artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("providers/artifact_provider.py")
          text = path.read_text()
          needle = "    branch = config[\"branch\"]\n"
          injected = "    branch = config[\"branch\"]\n    override_run_id = os.environ.get(f\"{component.upper()}_RUN_ID\", \"\").strip()\n    if override_run_id:\n        run = _get_json(f\"/repos/{repo}/actions/runs/{override_run_id}\")\n        if run.get(\"head_branch\") != branch or run.get(\"conclusion\") != \"success\":\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} is not a successful {repo}@{branch} run\")\n        artifact = _select_from_run(component, platform_name, repo, run)\n        if artifact is None:\n            raise ArtifactResolutionError(f\"Pinned {component} run {override_run_id} has no compatible {platform_name} artifact\")\n        return run, artifact\n"
          if needle not in text:
              raise SystemExit("artifact provider target not found")
          path.write_text(text.replace(needle, injected, 1))
          PY

      - uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Verify unmodified bot
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go vet ./...
          go test ./...

      - name: Patch reference tuple, first tick one and telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bot = Path("bot-src/internal/bot/bot.go")
          text = bot.read_text()
          for old, new in [
              ("if cfg.Scenario == ScenarioChunkFly && samePublisher {", "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && samePublisher {"),
              ("if cfg.Scenario == ScenarioChunkFly && changedChunk {", "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && changedChunk {"),
              ("if onlineState && cfg.Scenario == ScenarioChunkFly && !time.Now().Before(nextProgress) {", "if onlineState && (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !time.Now().Before(nextProgress) {"),
          ]:
              if old not in text:
                  raise SystemExit(f"missing bot target: {old}")
              text = text.replace(old, new, 1)
          bot.write_text(text)

          tick = Path("bot-src/internal/bot/tick.go")
          text = tick.read_text()
          for old, new in [
              ("if cfg.Scenario == ScenarioChunkFly && !state.positionReadySnapshot() {", "if (cfg.Scenario == ScenarioChunkFly || cfg.Scenario == ScenarioChunkWalk) && !state.positionReadySnapshot() {"),
              ("\tflags.Set(packet.InputFlagBlockBreakingDelayEnabled)\n", ""),
              ("\t\tInputMode:          packet.InputModeMouse,\n", "\t\tInputMode:          packet.InputModeTouch,\n"),
              ("\t\tPlayMode:           packet.PlayModeScreen,\n", "\t\tPlayMode:           packet.PlayModeNormal,\n"),
              ("\t\tInteractionModel:   packet.InteractionModelCrosshair,\n", "\t\tInteractionModel:   packet.InteractionModelTouch,\n"),
              ("\t\tAnalogueMoveVector: snapshot.moveVector,\n", "\t\tAnalogueMoveVector: mgl32.Vec2{},\n"),
          ]:
              if old not in text:
                  raise SystemExit(f"missing tick target: {old!r}")
              text = text.replace(old, new, 1)
          old = "\treturn &playerState{\n\t\tposition:      position,\n"
          new = "\treturn &playerState{\n\t\tserverTick:    1,\n\t\tposition:      position,\n"
          if old not in text:
              raise SystemExit("missing state constructor target")
          text = text.replace(old, new, 1)
          old = "\t\tRawMoveVector:      snapshot.moveVector,\n"
          new = "\t\tRawMoveVector: mgl32.Vec2{snapshot.moveVector[0] * float32(math.Hypot(float64(snapshot.delta[0]), float64(snapshot.delta[2]))), snapshot.moveVector[1] * float32(math.Hypot(float64(snapshot.delta[0]), float64(snapshot.delta[2])))},\n"
          if old not in text:
              raise SystemExit("missing raw move target")
          tick.write_text(text.replace(old, new, 1))
          PY
          gofmt -w bot-src/internal/bot/bot.go bot-src/internal/bot/tick.go

      - name: Build diagnostic bot
        working-directory: bot-src
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --disable-pip-version-check psutil

      - name: Run real BDS diagnostic
        continue-on-error: true
        run: python -m controller.chunk_walk_validation --bot dist/bds-test-bot --count 1 --profile-seconds 10

      - name: Summarize server evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("fleet-1-chunk-walk.log")
          print("## Reference tuple + first input tick 1 server evidence")
          if not p.exists():
              print("No fleet log")
              raise SystemExit
          rows=[]
          for line in p.read_text(errors="replace").splitlines():
              try: e=json.loads(line)
              except json.JSONDecodeError: continue
              if e.get("event") == "bot_progress": rows.append(e)
          print(f"samples={len(rows)}")
          if rows:
              a,b=rows[0],rows[-1]
              for k in ("publisher_position","publisher_chunk","chunks_received","server_post_move_updates","horizontal_distance","tick_synced","next_input_tick"):
                  print(f"{k}: {a.get(k)} -> {b.get(k)}")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: first-tick-one-${{ github.run_id }}
          path: |
            fleet-1-chunk-walk.log
            fleet-spark-result.json
            test-results.json
            failure-diagnostics.txt
            bds.log
            endstone.log
            spark.log
          if-no-files-found: warn
          retention-days: 7
