name: Spark Packet Action Fleet Test

on:
  push:
    branches:
      - test/packet-stress-actions
    paths:
      - ".github/workflows/packet-stress-test.yml"
      - "controller/scenario_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/bot_validation.py"
      - "controller/run_test.py"
      - "providers/artifact_provider.py"
  pull_request:
    paths:
      - ".github/workflows/packet-stress-test.yml"
      - "controller/scenario_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/bot_validation.py"
      - "controller/run_test.py"
      - "providers/artifact_provider.py"
  workflow_dispatch:
    inputs:
      bot_ref:
        description: "Exact bds-test-bot commit/ref to validate"
        required: false
        default: "9b0856a611156bf41b7690ffad5eb503ce8eb62b"
      profile_seconds:
        description: "Seconds per Spark execution profile"
        required: false
        default: "30"

concurrency:
  group: spark-packet-actions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BOT_REF: ${{ github.event.inputs.bot_ref || '9b0856a611156bf41b7690ffad5eb503ce8eb62b' }}
  PROFILE_SECONDS: ${{ github.event.inputs.profile_seconds || '30' }}

jobs:
  packet-action-fleet:
    name: Packet actions ${{ matrix.count }} bots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        count: [1, 5, 10, 20]

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout bot at exact ref
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact bot revision
        working-directory: bot-src
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...
          mkdir -p ../dist
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot
          echo "Bot ref: \`${BOT_REF}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil

      - name: Run real BDS packet-action Spark load
        run: >-
          python -m controller.scenario_validation
          --bot dist/bds-test-bot
          --count ${{ matrix.count }}
          --scenario-file bot-src/scenarios/packet-stress.yaml
          --profile-seconds ${{ env.PROFILE_SECONDS }}
          --min-action-packets-per-bot 12

      - name: Add load metrics to summary
        if: always()
        shell: bash
        run: |
          if [[ -f fleet-spark-result.json ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet-spark-result.json").read_text())
          metrics = data.get("metrics") or {}
          mspt = metrics.get("mspt_10s") or {}
          tps = metrics.get("tps") or {}
          shutdown = data.get("fleet_shutdown_event") or {}
          print(f"## Packet actions: {data.get('bot_count')} bots")
          print()
          print(f"Status: **{data.get('status')}**")
          print(f"BDS: `{data.get('bds_version')}`")
          print(f"Spark profile: {data.get('spark_profile_viewer_url')}")
          print(f"TPS 10s: {tps.get('10s')}")
          print(f"MSPT 10s mean/p95/max: {mspt.get('mean')} / {mspt.get('p95')} / {mspt.get('max')}")
          print(f"Action packets: {shutdown.get('action_packets_sent')}")
          print(f"Movement PlayerAuthInput: {shutdown.get('movement_inputs_sent')}")
          PY
          fi >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packet-action evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-packet-actions-${{ matrix.count }}-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            fleet-${{ matrix.count }}-packet-stress.log
            test-results.json
            fleet-spark-result.json
            failure-diagnostics.txt
            bot-src/scenarios/packet-stress.yaml
            work/linux/bedrock_server/server.properties
            work/linux/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 14
