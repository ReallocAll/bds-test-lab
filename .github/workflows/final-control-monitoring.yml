name: Final Spark Control and Monitoring Comparison

on:
  workflow_dispatch:
    inputs:
      spark_sha:
        description: "Exact ReallocAll/spark commit SHA to validate"
        required: true
        type: string
      bds_version:
        description: "Exact full BDS version selected by the Endstone runtime (1.<major>.<minor>.<revision>)"
        required: true
        type: string
      endstone_sha:
        description: "Optional exact Endstone commit SHA"
        required: false
        default: ""
        type: string
      measurement_seconds:
        description: "Comparable measurement seconds per case"
        required: false
        default: "15"
        type: string
      warmup_seconds:
        description: "Warmup seconds excluded from measurement"
        required: false
        default: "10"
        type: string

concurrency:
  group: final-spark-control-monitoring-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  SPARK_SHA: ${{ inputs.spark_sha }}
  EXPECTED_BDS_VERSION: ${{ inputs.bds_version }}
  EXPECTED_ENDSTONE_SHA: ${{ inputs.endstone_sha }}
  MEASUREMENT_SECONDS: ${{ inputs.measurement_seconds || '15' }}
  WARMUP_SECONDS: ${{ inputs.warmup_seconds || '10' }}

jobs:
  linux-paired-comparison:
    name: Linux Spark control vs monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Validate exact dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SPARK_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "spark_sha must be a full 40-character commit SHA" >&2; exit 1; }
          [[ "$EXPECTED_BDS_VERSION" =~ ^1\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "bds_version must be an exact full version 1.<major>.<minor>.<revision>" >&2
            exit 1
          }
          bds_protocol="${EXPECTED_BDS_VERSION#1.}"
          bds_protocol="${bds_protocol%.*}"
          if [[ -n "$EXPECTED_ENDSTONE_SHA" && ! "$EXPECTED_ENDSTONE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "endstone_sha must be empty or a full 40-character commit SHA" >&2
            exit 1
          fi
          [[ "$MEASUREMENT_SECONDS" =~ ^[0-9]+$ ]] && (( MEASUREMENT_SECONDS >= 5 && MEASUREMENT_SECONDS <= 300 )) || {
            echo "measurement_seconds must be an integer in 5..300" >&2
            exit 1
          }
          [[ "$WARMUP_SECONDS" =~ ^[0-9]+$ ]] && (( WARMUP_SECONDS <= 300 )) || {
            echo "warmup_seconds must be an integer in 0..300" >&2
            exit 1
          }
          {
            echo "SPARK_SHA=${SPARK_SHA,,}"
            echo "EXPECTED_BDS_VERSION=$EXPECTED_BDS_VERSION"
            echo "EXPECTED_BDS_PROTOCOL_VERSION=$bds_protocol"
            echo "EXPECTED_ENDSTONE_SHA=${EXPECTED_ENDSTONE_SHA,,}"
          } >> "$GITHUB_ENV"

      - name: Require exact Spark artifact
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: >-
          python -m controller.assert_spark_artifact
          --platform linux
          --expected-sha "$SPARK_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging hatchling

      - name: Run paired control and monitoring cases
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: >-
          python -m controller.final_control_monitoring
          --spark-sha "$SPARK_SHA"
          --bds-version "$EXPECTED_BDS_VERSION"
          --evidence-root evidence
          --measurement-seconds "$MEASUREMENT_SECONDS"
          --warmup-seconds "$WARMUP_SECONDS"

      - name: Verify canonical bStats evidence
        if: always()
        run: >-
          python -m controller.verify_bstats_evidence
          --result evidence/control/test-results.json
          --result evidence/monitoring/test-results.json

      - name: Add comparison summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("evidence/comparison.json")
          print("## Linux Spark control vs monitoring")
          print()
          if not path.is_file():
              print("Result: **missing**")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              print(f"Result: **{data.get('status')}**")
              print(f"Spark SHA: `{data.get('spark_sha')}`")
              print(f"Pair: `{data.get('pair_id')}`")
              for name, case in (data.get("cases") or {}).items():
                  print(f"- {name}: status **{case.get('status')}**, Spark deployed `{case.get('spark_enabled')}`")
                  print(f"  metrics: `{case.get('metrics')}`")
          PY

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-spark-control-monitoring-${{ github.run_id }}
          path: |
            evidence/comparison.json
            evidence/control/**
            evidence/monitoring/**
          if-no-files-found: warn
          retention-days: 30
