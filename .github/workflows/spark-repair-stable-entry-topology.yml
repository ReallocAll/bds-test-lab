name: Spark repair Stable Entry topology

on:
  push:
    paths:
      - .github/workflows/spark-repair-stable-entry-topology.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.REPO_PAT }}
      TARGET_REPO: ReallocAll/spark
      EXP_BRANCH: exp/windows-stable-entry-hooks
      EXPECTED_OLD_HEAD: 2b4bb22f0be6a5b9debf68acb4e609c4d01970e0
      OLD_LOCAL_BASE: 2678b37e208e708dfbe7b6bbc22a7c260a9d2654
      CLEAN_SHARED_BASE: af10038855a2b2a4396f16d254214939cc622855
      FINAL_DEVELOP: 8cb5c2b651a8c9808da397e6957526f87c1fe712
    steps:
      - name: Reattach experiment-only chain to clean production base
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" spark
          cd spark
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' --tags

          current=$(git rev-parse "refs/remotes/origin/${EXP_BRANCH}")
          test "$current" = "$EXPECTED_OLD_HEAD"
          test "$(git rev-parse refs/remotes/origin/develop)" = "$FINAL_DEVELOP"
          git merge-base --is-ancestor "$OLD_LOCAL_BASE" "$EXPECTED_OLD_HEAD"
          git merge-base --is-ancestor "$CLEAN_SHARED_BASE" "$FINAL_DEVELOP"
          test "$(git rev-parse "$OLD_LOCAL_BASE^{tree}")" = "$(git rev-parse "$CLEAN_SHARED_BASE^{tree}")"

          mapfile -t commits < <(git rev-list --reverse "$OLD_LOCAL_BASE..$EXPECTED_OLD_HEAD")
          test "${#commits[@]}" -gt 0
          prev="$OLD_LOCAL_BASE"
          for old in "${commits[@]}"; do
            read -r commit parent extra < <(git rev-list --parents -n1 "$old")
            test "$commit" = "$old"
            test "$parent" = "$prev"
            test -z "${extra:-}"
            prev="$old"
          done
          test "$prev" = "$EXPECTED_OLD_HEAD"

          mkdir -p /tmp/stable-entry-topology
          printf 'old_sha\tnew_sha\ttree_sha\tsubject\n' > /tmp/stable-entry-topology/old-to-new.tsv
          new_parent="$CLEAN_SHARED_BASE"

          for old in "${commits[@]}"; do
            tree=$(git rev-parse "$old^{tree}")
            msg=/tmp/stable-entry-topology/msg
            git cat-file commit "$old" | sed '1,/^$/d' > "$msg"

            an=$(git show -s --format='%an' "$old")
            ae=$(git show -s --format='%ae' "$old")
            ad=$(git show -s --format='%aI' "$old")
            cn=$(git show -s --format='%cn' "$old")
            ce=$(git show -s --format='%ce' "$old")
            cd=$(git show -s --format='%cI' "$old")

            new=$(GIT_AUTHOR_NAME="$an" GIT_AUTHOR_EMAIL="$ae" GIT_AUTHOR_DATE="$ad" \
                  GIT_COMMITTER_NAME="$cn" GIT_COMMITTER_EMAIL="$ce" GIT_COMMITTER_DATE="$cd" \
                  git commit-tree "$tree" -p "$new_parent" -F "$msg")

            test "$(git rev-parse "$new^{tree}")" = "$tree"
            test "$(git show -s --format='%an' "$new")" = "$an"
            test "$(git show -s --format='%ae' "$new")" = "$ae"
            test "$(git show -s --format='%aI' "$new")" = "$ad"
            test "$(git show -s --format='%cn' "$new")" = "$cn"
            test "$(git show -s --format='%ce' "$new")" = "$ce"
            test "$(git show -s --format='%cI' "$new")" = "$cd"
            git cat-file commit "$new" | sed '1,/^$/d' > /tmp/stable-entry-topology/new-msg
            cmp -s "$msg" /tmp/stable-entry-topology/new-msg

            subject=$(git show -s --format='%s' "$old" | tr '\t\n' '  ')
            printf '%s\t%s\t%s\t%s\n' "$old" "$new" "$tree" "$subject" >> /tmp/stable-entry-topology/old-to-new.tsv
            new_parent="$new"
          done

          NEW_HEAD="$new_parent"
          test "$(git rev-parse "$NEW_HEAD^{tree}")" = "$(git rev-parse "$EXPECTED_OLD_HEAD^{tree}")"
          test "$(git rev-list --count "$CLEAN_SHARED_BASE..$NEW_HEAD")" = "${#commits[@]}"
          test "$(git merge-base "$FINAL_DEVELOP" "$NEW_HEAD")" = "$CLEAN_SHARED_BASE"
          ! git log --format='%s' "$CLEAN_SHARED_BASE..$NEW_HEAD" | grep -E '\(#[0-9]+\)$|^Merge pull request #[0-9]+'
          ! git log --format='%B' "$CLEAN_SHARED_BASE..$NEW_HEAD" | grep -Ei '^Co-authored-by:\s*github-actions\[bot\]|^(PR|Pull Request):'

          git push --quiet origin "$NEW_HEAD:refs/heads/$EXP_BRANCH" \
            --force-with-lease="refs/heads/$EXP_BRANCH:$EXPECTED_OLD_HEAD"
          remote=$(git ls-remote origin "refs/heads/$EXP_BRANCH" | awk '{print $1}')
          test "$remote" = "$NEW_HEAD"
          printf 'old_head=%s\nnew_head=%s\nshared_base=%s\nexperiment_commits=%s\ntree=%s\n' \
            "$EXPECTED_OLD_HEAD" "$NEW_HEAD" "$CLEAN_SHARED_BASE" "${#commits[@]}" "$(git rev-parse "$NEW_HEAD^{tree}")" \
            > /tmp/stable-entry-topology/summary.txt
          cat /tmp/stable-entry-topology/summary.txt

      - name: Upload topology mapping
        uses: actions/upload-artifact@v4
        with:
          name: spark-stable-entry-topology-map
          path: /tmp/stable-entry-topology/
          retention-days: 30
