name: Dispatch merged Spark Python attribution CI

on:
  push:
    branches:
      - test/python-attribution-validation
    paths:
      - ".github/workflows/spark37-python-ci.yml"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Python attribution on Spark develop
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: gh workflow run python-attribution.yml --repo ReallocAll/spark --ref develop
