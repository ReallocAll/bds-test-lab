name: Candidate A blocked CPU benchmark

on:
  workflow_dispatch:
    inputs:
      start_block:
        description: "First block in this four-block batch (use 1, 5, 9, 13, or 17)"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "5"
          - "9"
          - "13"
          - "17"
      batch_size:
        description: "Pre-registered batch size"
        required: true
        type: choice
        default: "4"
        options:
          - "4"
      baseline_sha:
        description: "Exact baseline Spark SHA (fixed by protocol)"
        required: true
        type: string
        default: "15b79e814ee6542f8a2382df09353e9c2009c8d1"
      candidate_sha:
        description: "Exact Candidate A Spark SHA (fixed by protocol)"
        required: true
        type: string
        default: "78314038b67d506ec48da9a61181c0048fb3658e"
      bot_ref:
        description: "Exact bds-test-bot SHA (fixed by protocol)"
        required: true
        type: string
        default: "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a"
      prior_run_ids:
        description: "Optional comma-separated prior benchmark run IDs (at most four)"
        required: false
        type: string
        default: ""

concurrency:
  group: candidate-a-blocked-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  BASELINE_SHA: ${{ inputs.baseline_sha || '15b79e814ee6542f8a2382df09353e9c2009c8d1' }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha || '78314038b67d506ec48da9a61181c0048fb3658e' }}
  ENDSTONE_SHA: c76c814289ee3be8a7236389b6bdeb5728b154e4
  BOT_REF: ${{ inputs.bot_ref || 'b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a' }}
  BDS_TEST_BOT_SCENARIO_FILE: scenarios/candidate-a-stationary.json
  START_BLOCK: ${{ inputs.start_block || '1' }}
  BATCH_SIZE: ${{ inputs.batch_size || '4' }}

jobs:
  block:
    name: Block ${{ matrix.offset }} of batch
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - offset: 0
          - offset: 1
          - offset: 2
          - offset: 3
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'block_offset=%s\nstart_block=%s\n' '${{ matrix.offset }}' "$START_BLOCK" > evidence/preflight.txt

      - name: Validate immutable benchmark inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$START_BLOCK" in
            1|5|9|13|17) ;;
            *) echo "Illegal start_block=$START_BLOCK" >&2; exit 1 ;;
          esac
          [[ "$BATCH_SIZE" == "4" ]] || { echo "batch_size is fixed at 4" >&2; exit 1; }
          [[ "$BASELINE_SHA" == "15b79e814ee6542f8a2382df09353e9c2009c8d1" ]] || { echo "baseline SHA mismatch" >&2; exit 1; }
          [[ "$CANDIDATE_SHA" == "78314038b67d506ec48da9a61181c0048fb3658e" ]] || { echo "candidate SHA mismatch" >&2; exit 1; }
          [[ "$ENDSTONE_SHA" == "c76c814289ee3be8a7236389b6bdeb5728b154e4" ]] || { echo "Endstone SHA mismatch" >&2; exit 1; }
          [[ "$BOT_REF" == "b8c4875bb1fafaa5dd9b8e91b16b613af47bf37a" ]] || { echo "bot SHA mismatch" >&2; exit 1; }
          [[ "$(sha256sum scenarios/candidate-a-stationary.json | cut -d' ' -f1)" == "169360cb46acc6dc29ed5b38e082543b12434860bb65119c519a095de2a04799" ]] || { echo "stationary scenario SHA mismatch" >&2; exit 1; }
          block_index=$((10#$START_BLOCK + ${{ matrix.offset }}))
          (( block_index >= 1 && block_index <= 20 )) || { echo "block index out of range: $block_index" >&2; exit 1; }
          echo "Pre-registered block index: $block_index"

      - name: Wait for exact Spark CI
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$BASELINE_SHA" "$CANDIDATE_SHA"; do
            require_python=false
            if [[ "$sha" == "$CANDIDATE_SHA" ]]; then
              require_python=true
            fi
            for attempt in $(seq 1 80); do
              json="$(gh api "repos/ReallocAll/spark/actions/runs?head_sha=${sha}&per_page=100")"
              build="$(jq -r '[.workflow_runs[] | select(.name == "Build")][0].conclusion // ""' <<<"$json")"
              python_ci="$(jq -r '[.workflow_runs[] | select(.name == "Python attribution")][0].conclusion // ""' <<<"$json")"
              if [[ "$require_python" == true ]]; then
                python_status="${python_ci:-pending}"
              else
                python_status="not-applicable-before-workflow"
              fi
              echo "Spark CI sha=$sha attempt=$attempt Build=${build:-pending} Python=$python_status"
              if [[ "$build" == success && ( "$require_python" == false || "$python_ci" == success ) ]]; then
                break
              fi
              conclusions=("$build")
              if [[ "$require_python" == true ]]; then
                conclusions+=("$python_ci")
              fi
              for conclusion in "${conclusions[@]}"; do
                if [[ "$conclusion" == failure || "$conclusion" == cancelled || "$conclusion" == timed_out ]]; then
                  echo "Exact Spark CI failed for $sha: Build=$build Python=$python_status" >&2
                  exit 1
                fi
              done
              if (( attempt == 80 )); then
                echo "Timed out waiting for exact Spark CI for $sha" >&2
                exit 1
              fi
              sleep 15
            done
          done

      - name: Checkout exact bot
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact bot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist evidence
          cd bot-src
          test "$(git rev-parse HEAD)" = "$BOT_REF"
          go mod download
          go test ./...
          go build -trimpath -o ../dist/bds-test-bot ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging hatchling

      - name: Run one balanced block (four fresh-process cases)
        shell: bash
        run: |
          set +e
          set -uo pipefail
          block_index=$((10#$START_BLOCK + ${{ matrix.offset }}))
          python -m controller.candidate_a_blocked_benchmark \
            --platform linux \
            --bot dist/bds-test-bot \
            --block-index "$block_index" \
            --evidence-root evidence \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --bot-ref "$BOT_REF"
          code=$?
          echo "Block controller exit code: $code"
          exit "$code"

      - name: Upload block evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-a-blocked-block-${{ matrix.offset }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  analyze:
    name: Analyze complete four-block batch
    if: ${{ always() }}
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install analyzer dependency
        run: python -m pip install --disable-pip-version-check psutil

      - name: Download current batch evidence
        uses: actions/download-artifact@v8
        with:
          pattern: candidate-a-blocked-block-*
          path: evidence/current
          merge-multiple: true

      - name: Download prior batch evidence
        if: ${{ inputs.prior_run_ids != '' }}
        shell: bash
        env:
          PRIOR_RUN_IDS: ${{ inputs.prior_run_ids }}
        run: |
          set -euo pipefail
          mkdir -p evidence/prior
          IFS=',' read -r -a run_ids <<< "$PRIOR_RUN_IDS"
          (( ${#run_ids[@]} <= 4 )) || { echo "at most four prior run IDs are allowed" >&2; exit 1; }
          for run_id in "${run_ids[@]}"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "invalid prior run ID: $run_id" >&2; exit 1; }
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'candidate-a-blocked-block-*' \
              --dir "evidence/prior/$run_id"
          done

      - name: Analyze exact cumulative evidence
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --evidence-root evidence/current
            --start-block "$START_BLOCK"
            --batch-size "$BATCH_SIZE"
            --baseline-sha "$BASELINE_SHA"
            --candidate-sha "$CANDIDATE_SHA"
            --bot-ref "$BOT_REF"
            --output candidate-a-blocked-summary.json
            --markdown-output candidate-a-blocked-summary.md
          )
          if [[ -d evidence/prior ]]; then
            args+=(--evidence-root evidence/prior)
          fi
          python -m controller.candidate_a_blocked_analyzer "${args[@]}"

      - name: Add benchmark summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f candidate-a-blocked-summary.md ]]; then
            cat candidate-a-blocked-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require an analyzer result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate-a-blocked-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("candidate-a-blocked-summary.json").read_text(encoding="utf-8"))
          print(f"Outcome: {data.get('outcome')}")
          if data.get("valid") is not True:
              raise SystemExit("benchmark evidence is invalid; no CPU claim is permitted")
          PY

      - name: Upload aggregate analysis
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-a-blocked-analysis-${{ github.run_id }}
          path: |
            candidate-a-blocked-summary.json
            candidate-a-blocked-summary.md
            evidence
          if-no-files-found: error
          retention-days: 30
