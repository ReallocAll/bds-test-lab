name: Patch Chunk-Fly Post-Move Telemetry

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/patch-bot-postmove.yml"
      - "controller/patch_chunk_fly_postmove.py"

permissions:
  contents: read

jobs:
  patch-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout bot feature branch
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: feat/chunk-fly-scenario
          path: bot-src
          token: ${{ secrets.REPO_PAT }}
          persist-credentials: true

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Patch, validate, and push bot
        shell: bash
        run: |
          python3 controller/patch_chunk_fly_postmove.py bot-src
          cd bot-src
          gofmt -w internal/bot/bot.go
          go test ./...
          if git diff --quiet; then
            echo "Patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/bot/bot.go
          git commit -m "test: expose server post-move telemetry"
          git push origin HEAD:feat/chunk-fly-scenario
