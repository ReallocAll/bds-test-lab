name: Patch Chunk-Fly Movement

on:
  push:
    branches:
      - test/chunk-fly-spark
    paths:
      - ".github/workflows/patch-bot-postmove.yml"
      - "controller/patch_chunk_fly_client_prediction.py"

permissions:
  contents: read

jobs:
  patch-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout bot feature branch
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: feat/chunk-fly-scenario
          path: bot-src
          token: ${{ secrets.REPO_PAT }}
          persist-credentials: true

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Patch, validate, and push bot
        shell: bash
        run: |
          python3 controller/patch_chunk_fly_client_prediction.py bot-src
          python3 - <<'PY'
          from pathlib import Path
          path = Path("bot-src/internal/bot/flight_test.go")
          text = path.read_text()
          old = '''\tinput := authInputPacket(state, 7)
          \tif input.Position != serverPos {
          \t\tt.Fatalf("auth input position = %v, want server position %v", input.Position, serverPos)
          \t}
          \tif input.MoveVector != (mgl32.Vec2{0, 1}) || input.Delta != (mgl32.Vec3{}) {
          \t\tt.Fatalf("server-driven cruise = move %v delta %v", input.MoveVector, input.Delta)
          \t}
          '''
          new = '''\tinput := authInputPacket(state, 7)
          \twantPosition := serverPos
          \twantPosition[2] += chunkFlyStepPerTick
          \tif input.Position != wantPosition {
          \t\tt.Fatalf("auth input position = %v, want predicted position %v", input.Position, wantPosition)
          \t}
          \tif input.MoveVector != (mgl32.Vec2{0, 1}) || math.Abs(float64(input.Delta[2]-chunkFlyStepPerTick)) > 1e-5 {
          \t\tt.Fatalf("client-predicted cruise = move %v delta %v", input.MoveVector, input.Delta)
          \t}
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif "want predicted position" not in text:
              raise SystemExit("publisher prediction test target not found")
          PY
          cd bot-src
          gofmt -w internal/bot/bot.go internal/bot/tick.go internal/bot/flight_test.go
          go test ./...
          go vet ./...
          if git diff --quiet; then
            echo "Patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/bot/bot.go internal/bot/tick.go internal/bot/flight_test.go
          git commit -m "fix: seed client-predicted flight from authoritative spawn"
          git push origin HEAD:feat/chunk-fly-scenario
