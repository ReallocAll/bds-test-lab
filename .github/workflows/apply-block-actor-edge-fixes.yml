name: Apply BlockActor edge fixes

on:
  push:
    branches:
      - test/block-actor-real-bds

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Harden capture polling and cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('controller/block_actor_validation.py')
          text = path.read_text()
          text = text.replace(
              '        self._payloads: list[bytes] = []\n        capture = self\n',
              '        self._payloads: list[bytes] = []\n        self._started = False\n        capture = self\n',
              1,
          )
          text = text.replace(
              '    def start(self) -> None:\n        self.thread.start()\n\n    def stop(self) -> None:\n        self.server.shutdown()\n        self.server.server_close()\n        self.thread.join(timeout=5)\n',
              '    def start(self) -> None:\n        self.thread.start()\n        self._started = True\n\n    def stop(self) -> None:\n        if not self._started:\n            self.server.server_close()\n            return\n        self.server.shutdown()\n        self.server.server_close()\n        self.thread.join(timeout=5)\n        self._started = False\n',
              1,
          )
          old = '''        while time.monotonic() < deadline:\n            sample, count = self.capture_world_info()\n            last, last_count = sample, count\n            if count > min_sample_count and predicate(sample):\n                self._record_world_sample(phase, sample, count)\n                return sample, count\n            time.sleep(5)\n'''
          new = '''        last_decode_error: str | None = None\n        while time.monotonic() < deadline:\n            try:\n                sample, count = self.capture_world_info()\n            except ProtoDecodeError as exc:\n                last_decode_error = str(exc)\n                time.sleep(5)\n                continue\n            last, last_count = sample, count\n            if count > min_sample_count and predicate(sample):\n                self._record_world_sample(phase, sample, count)\n                return sample, count\n            time.sleep(5)\n'''
          if old not in text:
              raise SystemExit('wait_world_info loop not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '            f"minimum_sample_count={min_sample_count}"\n',
              '            f"minimum_sample_count={min_sample_count}, last_decode_error={last_decode_error}"\n',
              1,
          )
          path.write_text(text)
          PY
          python -m py_compile controller/block_actor_validation.py
          git diff --check
      - name: Commit edge fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/block_actor_validation.py
          git diff --cached --quiet && exit 0
          git commit -m "test: harden BlockActor capture polling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
