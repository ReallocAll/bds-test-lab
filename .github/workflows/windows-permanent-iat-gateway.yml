name: Windows Permanent IAT Gateway Safety

on:
  workflow_dispatch:
    inputs:
      spark_sha:
        description: Exact ReallocAll/spark commit SHA to validate
        required: true
        type: string
  workflow_call:
    inputs:
      spark_sha:
        description: Exact ReallocAll/spark commit SHA to validate
        required: true
        type: string
  pull_request:
    paths:
      - ".github/spark-windows-candidate.txt"
      - ".github/workflows/windows-permanent-iat-gateway.yml"

permissions:
  contents: read

jobs:
  resolve-candidate:
    runs-on: ubuntu-latest
    outputs:
      spark_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout lab candidate metadata
        uses: actions/checkout@v7
        with:
          path: lab
          persist-credentials: false
      - name: Resolve exact Spark candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ inputs.spark_sha }}'
          if [ -z "$sha" ]; then
            file='lab/.github/spark-windows-candidate.txt'
            test -f "$file" || { echo "spark_sha input is empty and $file does not exist" >&2; exit 1; }
            sha="$(tr -d '\r\n ' < "$file")"
          fi
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid Spark SHA: $sha" >&2; exit 1; }
          sha="${sha,,}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$sha"

  atomic-iat-publication:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spark-src
    steps:
      - name: Checkout exact Spark candidate
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ needs.resolve-candidate.outputs.spark_sha }}
          path: spark-src
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-candidate.outputs.spark_sha }}"
          $checkout = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkout -ne $expected) { throw "checkout SHA mismatch: expected $expected, got $checkout" }
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile permanent IAT gateway with CFG
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /guard:cf
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc
          src\native\alloc\windows_permanent_iat_gateway.cpp
          tests\native\alloc\windows_permanent_iat_gateway_test.cpp
          /Fe:windows_permanent_iat_gateway_test.exe
          /link /guard:cf
      - name: Stress atomic IAT publication and process-lifetime gateway reuse under CFG
        shell: pwsh
        run: .\windows_permanent_iat_gateway_test.exe

  stack-unwind-correctness:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spark-src
    steps:
      - name: Checkout exact Spark candidate
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ needs.resolve-candidate.outputs.spark_sha }}
          path: spark-src
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-candidate.outputs.spark_sha }}"
          $checkout = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkout -ne $expected) { throw "checkout SHA mismatch: expected $expected, got $checkout" }
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile permanent IAT gateway unwind probe with CFG
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /guard:cf
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc
          src\native\alloc\windows_permanent_iat_gateway.cpp
          tests\native\alloc\windows_permanent_iat_gateway_unwind_test.cpp
          /Fe:windows_permanent_iat_gateway_unwind_test.exe
          /link /guard:cf
      - name: Require stack unwind through generated gateway
        shell: pwsh
        run: .\windows_permanent_iat_gateway_unwind_test.exe

  registry-reload-reuse:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spark-src
    steps:
      - name: Checkout exact Spark candidate
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ needs.resolve-candidate.outputs.spark_sha }}
          path: spark-src
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-candidate.outputs.spark_sha }}"
          $checkout = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkout -ne $expected) { throw "checkout SHA mismatch: expected $expected, got $checkout" }
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile permanent IAT gateway registry
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc
          src\native\alloc\windows_permanent_iat_gateway.cpp
          src\native\alloc\windows_permanent_iat_gateway_registry.cpp
          tests\native\alloc\windows_permanent_iat_gateway_registry_test.cpp
          /Fe:windows_permanent_iat_gateway_registry_test.exe
      - name: Run 1000 simulated plugin reload acquisitions
        shell: pwsh
        run: .\windows_permanent_iat_gateway_registry_test.exe

  true-dll-unload:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spark-src
    steps:
      - name: Checkout exact Spark candidate
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ needs.resolve-candidate.outputs.spark_sha }}
          path: spark-src
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-candidate.outputs.spark_sha }}"
          $checkout = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkout -ne $expected) { throw "checkout SHA mismatch: expected $expected, got $checkout" }
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile unloadable handler DLL
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /LD
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          tests\native\alloc\windows_gateway_test_handler.cpp
          /Fe:windows_iat_gateway_test_handler.dll
      - name: Compile permanent IAT gateway unload stress
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc
          src\native\alloc\windows_permanent_iat_gateway.cpp
          tests\native\alloc\windows_permanent_iat_gateway_unload_test.cpp
          /Fe:windows_permanent_iat_gateway_unload_test.exe
      - name: Run 1000-cycle true handler DLL unload/reload stress
        shell: pwsh
        run: .\windows_permanent_iat_gateway_unload_test.exe

  full-backend-hot-reload:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spark-src
    steps:
      - name: Checkout exact Spark candidate
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ needs.resolve-candidate.outputs.spark_sha }}
          path: spark-src
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-candidate.outputs.spark_sha }}"
          $checkout = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkout -ne $expected) { throw "checkout SHA mismatch: expected $expected, got $checkout" }
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile allocator client DLL
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD /LD
          tests\native\alloc\windows_permanent_iat_backend_client.cpp
          /Fe:windows_permanent_iat_backend_client.dll
      - name: Compile unloadable no-shim backend plugin DLL
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD /LD
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc
          src\native\alloc\windows_permanent_iat_gateway.cpp
          src\native\alloc\windows_permanent_iat_gateway_registry.cpp
          src\native\alloc\windows_iat_hooks.cpp
          src\native\alloc\windows_iat_hooks_windows.cpp
          src\native\alloc\windows_permanent_iat_funchook_compat.cpp
          tests\native\alloc\windows_permanent_iat_backend_plugin.cpp
          /Fe:windows_permanent_iat_backend_plugin.dll
          /link psapi.lib
      - name: Compile backend hot-reload host
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          tests\native\alloc\windows_permanent_iat_backend_reload_test.cpp
          /Fe:windows_permanent_iat_backend_reload_test.exe
      - name: Run full IAT backend install/drain/plugin-unload/reload stress
        shell: pwsh
        run: .\windows_permanent_iat_backend_reload_test.exe
