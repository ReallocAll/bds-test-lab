name: Windows Permanent IAT Gateway Safety

on:
  workflow_dispatch:
    inputs:
      spark_sha:
        description: Exact ReallocAll/spark commit SHA to validate
        required: true
        type: string
  workflow_call:
    inputs:
      spark_sha:
        description: Exact ReallocAll/spark commit SHA to validate
        required: true
        type: string
  pull_request:
    paths:
      - ".github/spark-windows-candidate.txt"
      - ".github/workflows/windows-permanent-iat-gateway.yml"

permissions:
  contents: read

env:
  REQUESTED_SPARK_SHA: ${{ inputs.spark_sha || '' }}

jobs:
  resolve-candidate:
    runs-on: ubuntu-latest
    outputs:
      spark_sha: ${{ steps.candidate.outputs.sha }}
      lab_sha: ${{ steps.lab.outputs.sha }}
    steps:
      - name: Checkout lab candidate metadata
        uses: actions/checkout@v7
        with:
          path: lab
          persist-credentials: false
      - name: Resolve exact Spark candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$REQUESTED_SPARK_SHA"
          if [ -z "$sha" ]; then
            file='lab/.github/spark-windows-candidate.txt'
            test -f "$file" || { echo "spark_sha input is empty and $file does not exist" >&2; exit 1; }
            sha="$(tr -d '\r\n ' < "$file")"
          fi
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid Spark SHA: $sha" >&2; exit 1; }
          sha="${sha,,}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$sha"
      - name: Record Lab checkout SHA
        id: lab
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C lab rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid Lab SHA: $sha" >&2; exit 1; }
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

  atomic-iat-publication:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spark-src
    steps:
      - name: Checkout exact Spark candidate
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ needs.resolve-candidate.outputs.spark_sha }}
          path: spark-src
          persist-credentials: false
      - name: Verify exact candidate checkout and record provenance
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-candidate.outputs.spark_sha }}"
          $checkout = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkout -ne $expected) { throw "checkout SHA mismatch: expected $expected, got $checkout" }
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          @(
            "LabSHA=${{ needs.resolve-candidate.outputs.lab_sha }}"
            "SparkSHA=$checkout"
            "PythonVersion=not-applicable"
            "workflow=windows-permanent-iat-gateway"
          ) | Set-Content -Path evidence/provenance.txt -Encoding utf8
          "commands" | Set-Content -Path evidence/commands.txt -Encoding utf8
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile permanent IAT gateway with CFG
        shell: pwsh
        run: |
          $command = 'cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /guard:cf /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc src\native\alloc\windows_permanent_iat_gateway.cpp tests\native\alloc\windows_permanent_iat_gateway_test.cpp /Fe:windows_permanent_iat_gateway_test.exe /link /guard:cf'
          Add-Content -Path evidence/commands.txt -Value $command
          $output = & cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /guard:cf /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc src\native\alloc\windows_permanent_iat_gateway.cpp tests\native\alloc\windows_permanent_iat_gateway_test.cpp /Fe:windows_permanent_iat_gateway_test.exe /link /guard:cf 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/compile.log
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Stress atomic IAT publication and process-lifetime gateway reuse under CFG
        shell: pwsh
        run: |
          $output = & .\windows_permanent_iat_gateway_test.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/test.log
          Add-Content -Path evidence/results.txt -Value "atomic publication/process-lifetime gateway reuse: $(if ($exitCode -eq 0) { 'PASS' } else { 'FAIL' })"
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Upload atomic gateway evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-windows-permanent-iat-atomic-${{ needs.resolve-candidate.outputs.spark_sha }}
          path: |
            spark-src/evidence
            spark-src/windows_permanent_iat_gateway_test.exe
          if-no-files-found: warn
          retention-days: 14

  stack-unwind-correctness:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spark-src
    steps:
      - name: Checkout exact Spark candidate
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ needs.resolve-candidate.outputs.spark_sha }}
          path: spark-src
          persist-credentials: false
      - name: Verify exact candidate checkout and record provenance
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-candidate.outputs.spark_sha }}"
          $checkout = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkout -ne $expected) { throw "checkout SHA mismatch: expected $expected, got $checkout" }
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          @(
            "LabSHA=${{ needs.resolve-candidate.outputs.lab_sha }}"
            "SparkSHA=$checkout"
            "PythonVersion=not-applicable"
            "workflow=windows-permanent-iat-gateway"
          ) | Set-Content -Path evidence/provenance.txt -Encoding utf8
          "commands" | Set-Content -Path evidence/commands.txt -Encoding utf8
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile permanent IAT gateway unwind probe with CFG
        shell: pwsh
        run: |
          $command = 'cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /guard:cf /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc src\native\alloc\windows_permanent_iat_gateway.cpp tests\native\alloc\windows_permanent_iat_gateway_unwind_test.cpp /Fe:windows_permanent_iat_gateway_unwind_test.exe /link /guard:cf'
          Add-Content -Path evidence/commands.txt -Value $command
          $output = & cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /guard:cf /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc src\native\alloc\windows_permanent_iat_gateway.cpp tests\native\alloc\windows_permanent_iat_gateway_unwind_test.cpp /Fe:windows_permanent_iat_gateway_unwind_test.exe /link /guard:cf 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/compile.log
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Require stack unwind through generated gateway
        shell: pwsh
        run: |
          $output = & .\windows_permanent_iat_gateway_unwind_test.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/test.log
          Add-Content -Path evidence/results.txt -Value "stack unwind through generated gateway: $(if ($exitCode -eq 0) { 'PASS' } else { 'FAIL' })"
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Upload unwind evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-windows-permanent-iat-unwind-${{ needs.resolve-candidate.outputs.spark_sha }}
          path: |
            spark-src/evidence
            spark-src/windows_permanent_iat_gateway_unwind_test.exe
          if-no-files-found: warn
          retention-days: 14

  registry-reload-reuse:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
