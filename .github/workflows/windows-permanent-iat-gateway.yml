      - name: Compile permanent IAT gateway registry
        shell: pwsh
        run: |
          $command = 'cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc src\native\alloc\windows_permanent_iat_gateway.cpp src\native\alloc\windows_permanent_iat_gateway_registry.cpp tests\native\alloc\windows_permanent_iat_gateway_registry_test.cpp /Fe:windows_permanent_iat_gateway_registry_test.exe'
          Add-Content -Path evidence/commands.txt -Value $command
          $output = & cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc src\native\alloc\windows_permanent_iat_gateway.cpp src\native\alloc\windows_permanent_iat_gateway_registry.cpp tests\native\alloc\windows_permanent_iat_gateway_registry_test.cpp /Fe:windows_permanent_iat_gateway_registry_test.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/compile.log
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Run 1000 simulated plugin reload acquisitions
        shell: pwsh
