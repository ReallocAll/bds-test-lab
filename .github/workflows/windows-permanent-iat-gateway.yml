  full-backend-hot-reload:
    needs: resolve-candidate
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spark-src
    steps:
      - name: Checkout exact Spark candidate
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/spark
          ref: ${{ needs.resolve-candidate.outputs.spark_sha }}
          path: spark-src
          persist-credentials: false
      - name: Verify exact candidate checkout and record provenance
        shell: pwsh
        run: |
          $expected = "${{ needs.resolve-candidate.outputs.spark_sha }}"
          $checkout = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($checkout -ne $expected) { throw "checkout SHA mismatch: expected $expected, got $checkout" }
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          @(
            "LabSHA=${{ needs.resolve-candidate.outputs.lab_sha }}"
            "SparkSHA=$checkout"
            "PythonVersion=not-applicable"
            "workflow=windows-permanent-iat-gateway"
          ) | Set-Content -Path evidence/provenance.txt -Encoding utf8
          "commands" | Set-Content -Path evidence/commands.txt -Encoding utf8
      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile allocator client DLL
        shell: pwsh
        run: |
          $command = 'cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD /LD tests\native\alloc\windows_permanent_iat_backend_client.cpp /Fe:windows_permanent_iat_backend_client.dll'
          Add-Content -Path evidence/commands.txt -Value $command
          $output = & cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD /LD tests\native\alloc\windows_permanent_iat_backend_client.cpp /Fe:windows_permanent_iat_backend_client.dll 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/compile-client.log
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Compile unloadable no-shim backend plugin DLL
        shell: pwsh
        run: |
          $command = 'cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD /LD /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc src\native\alloc\windows_permanent_iat_gateway.cpp src\native\alloc\windows_permanent_iat_gateway_registry.cpp src\native\alloc\windows_iat_hooks.cpp src\native\alloc\windows_iat_hooks_windows.cpp src\native\alloc\windows_allocation_iat_hooks.cpp tests\native\alloc\windows_permanent_iat_backend_plugin.cpp /Fe:windows_permanent_iat_backend_plugin.dll /link psapi.lib'
          Add-Content -Path evidence/commands.txt -Value $command
          $output = & cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD /LD /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc src\native\alloc\windows_permanent_iat_gateway.cpp src\native\alloc\windows_permanent_iat_gateway_registry.cpp src\native\alloc\windows_iat_hooks.cpp src\native\alloc\windows_iat_hooks_windows.cpp src\native\alloc\windows_allocation_iat_hooks.cpp tests\native\alloc\windows_permanent_iat_backend_plugin.cpp /Fe:windows_permanent_iat_backend_plugin.dll /link psapi.lib 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/compile-plugin.log
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Compile backend hot-reload host
        shell: pwsh
        run: |
          $command = 'cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD /DWIN32_LEAN_AND_MEAN /DNOMINMAX tests\native\alloc\windows_permanent_iat_backend_reload_test.cpp /Fe:windows_permanent_iat_backend_reload_test.exe'
          Add-Content -Path evidence/commands.txt -Value $command
          $output = & cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /MD /DWIN32_LEAN_AND_MEAN /DNOMINMAX tests\native\alloc\windows_permanent_iat_backend_reload_test.cpp /Fe:windows_permanent_iat_backend_reload_test.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/compile-host.log
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Run full IAT backend install/drain/plugin-unload/reload stress
        shell: pwsh
        run: |
          $output = & .\windows_permanent_iat_backend_reload_test.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath evidence/test.log
          Add-Content -Path evidence/results.txt -Value "1000-cycle full IAT backend install/drain/plugin-unload/reload stress: $(if ($exitCode -eq 0) { 'PASS' } else { 'FAIL' })"
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Upload full backend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-windows-permanent-iat-full-${{ needs.resolve-candidate.outputs.spark_sha }}
          path: |
            spark-src/evidence
            spark-src/windows_permanent_iat_backend_client.dll
            spark-src/windows_permanent_iat_backend_plugin.dll
            spark-src/windows_permanent_iat_backend_reload_test.exe
          if-no-files-found: warn
          retention-days: 14

  python-native-offline:
    needs: resolve-candidate
    uses: ./.github/workflows/python-native-offline.yml
    with:
      spark_sha: ${{ needs.resolve-candidate.outputs.spark_sha }}

  windows-iat-offline:
    needs: resolve-candidate
    uses: ./.github/workflows/windows-iat-offline.yml
    with:
      spark_sha: ${{ needs.resolve-candidate.outputs.spark_sha }}
