name: Apply Windows shim deployment

on:
  push:
    branches:
      - fix/deploy-windows-allocation-shim

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Deploy Windows allocation shim with Spark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('controller/run_test.py')
          text = path.read_text()
          old = '''        target = plugin_dir / spark_binary.name\n        shutil.copy2(spark_binary, target)\n        self.check("spark-plugin-deployed", "PASS", str(target.relative_to(self.root)))\n'''
          new = '''        target = plugin_dir / spark_binary.name\n        shutil.copy2(spark_binary, target)\n        self.check("spark-plugin-deployed", "PASS", str(target.relative_to(self.root)))\n        if self.platform == "windows":\n            allocation_shim = locate_one(spark_root, ["spark_allocation_shim.dll"])\n            shim_target = plugin_dir / allocation_shim.name\n            shutil.copy2(allocation_shim, shim_target)\n            self.check("spark-allocation-shim-deployed", "PASS", str(shim_target.relative_to(self.root)))\n'''
          if old not in text:
              raise SystemExit('Spark deployment block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Add deployment regression test
        shell: bash
        run: |
          cat > tests/test_windows_shim_deployment.py <<'PY'
          from __future__ import annotations

          import tempfile
          import unittest
          from pathlib import Path
          from unittest import mock

          from controller.run_test import IntegrationTest


          class WindowsShimDeploymentTest(unittest.TestCase):
              def test_windows_artifact_deploys_plugin_and_allocation_shim(self) -> None:
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      downloads = root / "downloads"
                      endstone = downloads / "endstone" / "payload"
                      spark = downloads / "spark" / "payload"
                      endstone.mkdir(parents=True)
                      spark.mkdir(parents=True)
                      wheel = endstone / "endstone-test-cp313-cp313-win_amd64.whl"
                      plugin = spark / "endstone_spark.dll"
                      shim = spark / "spark_allocation_shim.dll"
                      wheel.write_bytes(b"wheel")
                      plugin.write_bytes(b"plugin")
                      shim.write_bytes(b"shim")

                      fixture = IntegrationTest.__new__(IntegrationTest)
                      fixture.platform = "windows"
                      fixture.root = root
                      fixture.downloads = downloads
                      fixture.metadata_path = root / "metadata.json"
                      fixture.server_dir = root / "server"
                      fixture.metadata = {}
                      checks: list[str] = []
                      fixture.check = lambda name, *_args, **_kwargs: checks.append(name)

                      with mock.patch("controller.run_test.resolve_artifacts", return_value={}), mock.patch(
                          "controller.run_test.run_checked"
                      ):
                          fixture.install_artifacts()

                      plugin_dir = fixture.server_dir / "plugins"
                      self.assertEqual((plugin_dir / "endstone_spark.dll").read_bytes(), b"plugin")
                      self.assertEqual((plugin_dir / "spark_allocation_shim.dll").read_bytes(), b"shim")
                      self.assertIn("spark-plugin-deployed", checks)
                      self.assertIn("spark-allocation-shim-deployed", checks)


          if __name__ == "__main__":
              unittest.main()
          PY
          python -m unittest tests.test_windows_shim_deployment -v
          python -m py_compile controller/run_test.py tests/test_windows_shim_deployment.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controller/run_test.py tests/test_windows_shim_deployment.py
          git commit -m "fix: deploy Windows allocation shim in BDS validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
