name: Spark final build retry

on:
  push:
    branches: [main]
    paths: [".github/workflows/spark-build-retry.yml"]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.REPO_PAT }}
      TARGET_REPO: ReallocAll/spark
      FINAL_DEV_SHA: 8cb5c2b651a8c9808da397e6957526f87c1fe712
    steps:
      - name: Dispatch build on exact final develop
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$TARGET_REPO/git/ref/heads/develop --jq .object.sha)" = "$FINAL_DEV_SHA"
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build.yml --repo "$TARGET_REPO" --ref develop
          for _ in $(seq 1 60); do
            id=$(gh api "repos/$TARGET_REPO/actions/workflows/build.yml/runs?branch=develop&event=workflow_dispatch&per_page=10" --jq --arg before "$before" --arg sha "$FINAL_DEV_SHA" '.workflow_runs | map(select(.head_sha==$sha and .created_at >= $before)) | sort_by(.created_at) | reverse | .[0].id // empty')
            if [[ -n "$id" ]]; then
              echo "BUILD_RETRY_RUN=$id"
              echo "$id" > /tmp/build-retry-run.txt
              exit 0
            fi
            sleep 2
          done
          echo 'Could not locate dispatched Build run' >&2
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: spark-build-retry-run
          path: /tmp/build-retry-run.txt
          retention-days: 7
