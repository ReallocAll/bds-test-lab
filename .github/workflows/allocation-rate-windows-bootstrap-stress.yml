name: Allocation Rate Windows Bootstrap Stress

on:
  push:
    branches:
      - test/allocation-rate-windows-bootstrap-stress
    paths:
      - ".github/workflows/allocation-rate-windows-bootstrap-stress.yml"
      - "controller/allocation_rate_bootstrap_stress.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  SPARK_ALLOCATIONRATEMETRICS: "true"
  EXPECTED_SPARK_SHA: "6204cee4fe8e17b3ed6b482ddd0eda0ff5f5a3b1"

jobs:
  windows-bootstrap-stress:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging

      - name: Require exact Spark artifact
        run: python -m controller.assert_spark_artifact --platform windows --expected-sha $env:EXPECTED_SPARK_SHA

      - name: Run 12 bootstrap shutdown cycles
        run: python -m controller.allocation_rate_bootstrap_stress --cycles 12

      - name: Upload bootstrap stress evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-rate-windows-bootstrap-stress-${{ github.run_id }}
          path: |
            bootstrap-stress-results.json
            metadata.json
            bds.log
            endstone.log
            spark.log
          if-no-files-found: warn
          retention-days: 30
