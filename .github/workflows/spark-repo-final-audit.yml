name: Spark repository final audit

on:
  push:
    branches: [main]
    paths: [".github/workflows/spark-repo-final-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.REPO_PAT }}
      TARGET_REPO: ReallocAll/spark
      BASE_SHA: 53b556eae4e66ff280a50d6c926258fcbc73b3bc
      OLD_DEV_SHA: 9a0838c7e68f334b1d73e8ebde0017f7dd90a939
      CLEAN_DEV_SHA: 6cbda71cf858eab29f59fd9243ea94f2110f5637
      FINAL_MAIN_SHA: 58d40317f97594fbb6d31a93086aed5c0460acce
      FINAL_DEV_SHA: 8cb5c2b651a8c9808da397e6957526f87c1fe712
      BAD_RELEASE_SHA: 3c5cbdfc664912e3b87202c068ec04d8fe95c039
      BUILD_RUN: '33649335945'
      PYTHON_RUN: '33649334455'
      IAT_RUN: '33649337139'
    steps:
      - name: Verify final repository state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/spark-final-audit
          main=$(gh api repos/$TARGET_REPO/git/ref/heads/main --jq .object.sha)
          dev=$(gh api repos/$TARGET_REPO/git/ref/heads/develop --jq .object.sha)
          exp=$(gh api repos/$TARGET_REPO/git/ref/heads/exp/windows-stable-entry-hooks --jq .object.sha)
          test "$main" = "$FINAL_MAIN_SHA"
          test "$dev" = "$FINAL_DEV_SHA"
          if gh api repos/$TARGET_REPO/releases/tags/v0.6.0 >/dev/null 2>&1; then exit 1; fi
          if gh api repos/$TARGET_REPO/git/ref/tags/v0.6.0 >/dev/null 2>&1; then exit 1; fi
          test "$(gh pr list --repo "$TARGET_REPO" --state open --limit 100 --json number --jq length)" = 0
          mapfile -t branches < <(gh api --paginate "repos/$TARGET_REPO/branches?per_page=100" --jq '.[].name' | sort)
          test "${#branches[@]}" -eq 3
          test "${branches[0]}" = develop
          test "${branches[1]}" = exp/windows-stable-entry-hooks
          test "${branches[2]}" = main
          {
            echo "main=$main"
            echo "develop=$dev"
            echo "experiment=$exp"
            printf 'branches=%s\n' "${branches[*]}"
            echo 'open_prs=0'
            echo 'v0.6.0_release=absent'
            echo 'v0.6.0_tag=absent'
          } | tee /tmp/spark-final-audit/final-state.txt

      - name: Verify workflow-only hardening and history cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" spark-check
          cd spark-check
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          test "$(git rev-parse refs/remotes/origin/main^)" = "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/develop^)" = "$CLEAN_DEV_SHA"
          old_tree=$(gh api "repos/$TARGET_REPO/git/commits/$OLD_DEV_SHA" --jq .tree.sha)
          clean_tree=$(git rev-parse "$CLEAN_DEV_SHA^{tree}")
          test "$old_tree" = "$clean_tree"
          test "$(git diff --name-only "$BASE_SHA" "$FINAL_MAIN_SHA")" = '.github/workflows/release.yml'
          test "$(git diff --name-only "$CLEAN_DEV_SHA" "$FINAL_DEV_SHA")" = '.github/workflows/release.yml'
          git show "$FINAL_MAIN_SHA:.github/workflows/release.yml" | grep -A4 -F '      dry_run:' | grep -F 'default: true'
          git show "$FINAL_DEV_SHA:.github/workflows/release.yml" | grep -A4 -F '      dry_run:' | grep -F 'default: true'
          ! git log --format='%s' "$BASE_SHA"..refs/remotes/origin/develop | grep -E '\(#[0-9]+\)$|^Merge pull request #[0-9]+'
          ! git log --format='%B' "$BASE_SHA"..refs/remotes/origin/develop | grep -Ei '^Co-authored-by:\s*github-actions\[bot\]|^(PR|Pull Request):'
          ! git log --format='%s' "$BASE_SHA"..refs/remotes/origin/exp/windows-stable-entry-hooks | grep -E '\(#[0-9]+\)$|^Merge pull request #[0-9]+'
          ! git log --format='%B' "$BASE_SHA"..refs/remotes/origin/exp/windows-stable-entry-hooks | grep -Ei '^Co-authored-by:\s*github-actions\[bot\]|^(PR|Pull Request):'
          {
            echo "old_dev_tree=$old_tree"
            echo "clean_dev_tree=$clean_tree"
            echo 'main_delta=.github/workflows/release.yml'
            echo 'develop_delta=.github/workflows/release.yml'
            echo 'history_pollution_scan=PASS'
          } | tee /tmp/spark-final-audit/tree-equivalence.txt

      - name: Reconstruct complete old to new production SHA map
        shell: bash
        run: |
          set -euo pipefail
          cd spark-check
          python - <<'PY'
          import datetime as dt
          import os, re, requests, subprocess
          repo=os.environ['TARGET_REPO']; token=os.environ['GH_TOKEN']
          base=os.environ['BASE_SHA']; old_tip=os.environ['OLD_DEV_SHA']; expected=os.environ['CLEAN_DEV_SHA']
          sess=requests.Session(); sess.headers.update({'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          api=f'https://api.github.com/repos/{repo}'
          base_anc=set(subprocess.check_output(['git','rev-list',base],text=True).splitlines())
          cache={}; mapping={}; rows=[]; visiting=set()
          def clean(msg):
              had=msg.endswith('\n')
              if re.match(r'^Merge pull request #\d+ from [^\n]+\n\n',msg): msg=msg.split('\n\n',1)[1]
              lines=msg.splitlines()
              if lines: lines[0]=re.sub(r'\s+(?:\(#[0-9]+\)|#[0-9]+|PR\s+#[0-9]+)$','',lines[0],flags=re.I)
              out=[]
              for line in lines:
                  if re.match(r'(?i)^Co-authored-by:\s*github-actions\[bot\](?:\s|<|$)',line): continue
                  if re.match(r'(?i)^(?:PR|Pull Request):\s*#?[0-9]+\s*$',line): continue
                  out.append(line)
              while out and not out[-1].strip(): out.pop()
              if out and out[-1].strip()=='---------':
                  out.pop()
                  while out and not out[-1].strip(): out.pop()
              s='\n'.join(out)
              return s+'\n' if had and s else s
          def get(sha):
              if sha not in cache:
                  r=sess.get(f'{api}/git/commits/{sha}',timeout=30); r.raise_for_status(); cache[sha]=r.json()
              return cache[sha]
          def instant(s): return dt.datetime.fromisoformat(s.replace('Z','+00:00')).timestamp()
          def rewrite(old):
              if old in base_anc: return old
              if old in mapping: return mapping[old]
              if old in visiting: raise RuntimeError('cycle')
              visiting.add(old); c=get(old)
              parents=[rewrite(p['sha']) for p in c['parents']]
              msg=clean(c['message'])
              payload={'message':msg,'tree':c['tree']['sha'],'parents':parents,
                       'author':{'name':c['author']['name'],'email':c['author']['email'],'date':c['author']['date']},
                       'committer':{'name':c['committer']['name'],'email':c['committer']['email'],'date':c['committer']['date']}}
              r=sess.post(f'{api}/git/commits',json=payload,timeout=30)
              if r.status_code != 201: raise RuntimeError(f'POST {old}: {r.status_code} {r.text[:500]}')
              n=r.json(); new=n['sha']
              if n['tree']['sha'] != c['tree']['sha']: raise RuntimeError(f'tree mismatch {old}')
              if n['author']['name'] != c['author']['name'] or n['author']['email'] != c['author']['email'] or instant(n['author']['date']) != instant(c['author']['date']): raise RuntimeError(f'author mismatch {old}')
              if n['committer']['name'] != c['committer']['name'] or n['committer']['email'] != c['committer']['email'] or instant(n['committer']['date']) != instant(c['committer']['date']): raise RuntimeError(f'committer mismatch {old}')
              subj=msg.splitlines()[0] if msg.splitlines() else ''
              if re.search(r'(?:\(#[0-9]+\)|(?:PR\s+)?#[0-9]+)$',subj,re.I) or subj.startswith('Merge pull request #'): raise RuntimeError(f'PR pollution {old}')
              if re.search(r'(?im)^Co-authored-by:\s*github-actions\[bot\]|^(?:PR|Pull Request):',msg): raise RuntimeError(f'trailer pollution {old}')
              mapping[old]=new; visiting.remove(old)
              oldsub=c['message'].splitlines()[0] if c['message'].splitlines() else ''
              rows.append((old,new,oldsub,subj,c['tree']['sha']))
              return new
          new_tip=rewrite(old_tip)
          if new_tip != expected: raise SystemExit(f'clean tip mismatch: got {new_tip}, expected {expected}')
          if len(rows) != 172: raise SystemExit(f'expected 172 rewritten commits, got {len(rows)}')
          rows.sort(key=lambda x:x[0])
          with open('/tmp/spark-final-audit/production-old-to-new.tsv','w',encoding='utf-8') as f:
              f.write('old_sha\tnew_sha\told_subject\tnew_subject\ttree_sha\n')
              f.write(f'{base}\t{base}\tBASE v0.5.3\tBASE v0.5.3\tUNCHANGED\n')
              for r in rows: f.write('\t'.join(r)+'\n')
              f.write(f"{os.environ['BAD_RELEASE_SHA']}\tDROPPED\tchore: release v0.6.0\tDROPPED\tDROPPED\n")
          with open('/tmp/spark-final-audit/mapping-summary.txt','w') as f:
              f.write(f'rewritten_commits={len(rows)}\nold_develop={old_tip}\nclean_develop={new_tip}\nrelease_commit={os.environ["BAD_RELEASE_SHA"]}->DROPPED\n')
          print(f'Validated complete mapping: {len(rows)} rewritten commits; {old_tip} -> {new_tip}')
          PY

      - name: Verify required final CI
        shell: bash
        run: |
          set -euo pipefail
          check_run() {
            id="$1"; label="$2"
            for _ in $(seq 1 180); do
              status=$(gh api "repos/$TARGET_REPO/actions/runs/$id" --jq .status)
              if [[ "$status" = completed ]]; then
                conclusion=$(gh api "repos/$TARGET_REPO/actions/runs/$id" --jq .conclusion)
                echo "$label=$conclusion" | tee -a /tmp/spark-final-audit/ci.txt
                test "$conclusion" = success
                return
              fi
              sleep 10
            done
            exit 1
          }
          check_run "$BUILD_RUN" build
          check_run "$PYTHON_RUN" python_attribution
          check_run "$IAT_RUN" windows_iat_hook_safety
          gh api --paginate "repos/$TARGET_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" --jq '.jobs[] | [.name,.status,.conclusion] | @tsv' | tee /tmp/spark-final-audit/build-jobs.tsv
          test "$(gh api --paginate "repos/$TARGET_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion != "success")] | length' | awk '{s+=$1} END{print s+0}')" = 0

      - name: Record real BDS applicability evidence
        shell: bash
        run: |
          set -euo pipefail
          spark_sha=$(gh api repos/ReallocAll/bds-test-lab/contents/reports/latest.json --jq .content | base64 -d | python -c 'import json,sys; print(json.load(sys.stdin)["spark_sha"])')
          [[ "$spark_sha" = "$CLEAN_DEV_SHA" || "$spark_sha" = "$FINAL_DEV_SHA" ]]
          old_tree=$(gh api "repos/$TARGET_REPO/git/commits/$OLD_DEV_SHA" --jq .tree.sha)
          clean_tree=$(gh api "repos/$TARGET_REPO/git/commits/$CLEAN_DEV_SHA" --jq .tree.sha)
          test "$old_tree" = "$clean_tree"
          {
            echo "bds_artifact_source_sha=$spark_sha"
            echo "clean_dev_sha=$CLEAN_DEV_SHA"
            echo "old_dev_tree=$old_tree"
            echo "clean_dev_tree=$clean_tree"
            echo 'maintenance_source_change=none'
            echo 'post-cleanup_change=.github/workflows/release.yml only'
          } | tee /tmp/spark-final-audit/bds-applicability.txt

      - name: Remove temporary lab branch
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/ReallocAll/bds-test-lab/git/ref/heads/ci/spark-phase2 >/dev/null 2>&1; then
            gh api --method DELETE repos/ReallocAll/bds-test-lab/git/refs/heads/ci/spark-phase2
          fi
          if gh api repos/ReallocAll/bds-test-lab/git/ref/heads/ci/spark-phase2 >/dev/null 2>&1; then exit 1; fi
          echo 'ci/spark-phase2=deleted' | tee /tmp/spark-final-audit/lab-cleanup.txt

      - name: Upload final audit
        uses: actions/upload-artifact@v4
        with:
          name: spark-final-maintenance-audit
          path: /tmp/spark-final-audit
          retention-days: 30
          if-no-files-found: error

      - name: Remove one-shot maintenance workflows
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/ReallocAll/bds-test-lab.git" lab-clean
          cd lab-clean
          git config user.name ReallocAll
          git config user.email '63277109+ReallocAll@users.noreply.github.com'
          for f in \
            .github/workflows/spark-repo-maintenance.yml \
            .github/workflows/spark-repo-finalize.yml \
            .github/workflows/spark-repo-phase2.yml \
            .github/workflows/spark-repo-phase3.yml \
            .github/workflows/spark-repo-phase4.yml \
            .github/workflows/spark-repo-final-audit.yml; do
            [[ -e "$f" ]] && git rm "$f" || true
          done
          git diff --cached --quiet && exit 1
          git commit -m 'ci: remove completed Spark maintenance workflows'
          git push origin HEAD:main
