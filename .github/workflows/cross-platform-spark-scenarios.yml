name: Spark Cross-Platform Player Scenarios

on:
  push:
    branches:
      - test/cross-platform-spark-scenarios
    paths:
      - ".github/workflows/cross-platform-spark-scenarios.yml"
      - "controller/cross_platform_fleet_validation.py"
      - "controller/fleet_spark_validation.py"
      - "controller/bot_validation.py"
      - "controller/run_test.py"
      - "controller/bstats.py"
      - "controller/verify_bstats_evidence.py"
      - "providers/artifact_provider.py"
      - "scenario-trigger.json"
  workflow_dispatch:
    inputs:
      spark_sha:
        description: "Exact ReallocAll/spark SHA to validate"
        required: false
        default: "c1ed938058ebfd3b417b50bc70c718e989eed60f"
      bot_ref:
        description: "Exact ReallocAll/bds-test-bot ref"
        required: false
        default: "a0a83240e9e8f12d4806ba31194fb1807d7b5dd1"
      profile_seconds:
        description: "Seconds per online Spark execution profile"
        required: false
        default: "30"

concurrency:
  group: spark-cross-platform-player-scenarios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.REPO_PAT }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_SPARK_SHA: ${{ github.event.inputs.spark_sha || 'c1ed938058ebfd3b417b50bc70c718e989eed60f' }}
  BOT_REF: ${{ github.event.inputs.bot_ref || 'a0a83240e9e8f12d4806ba31194fb1807d7b5dd1' }}
  PROFILE_SECONDS: ${{ github.event.inputs.profile_seconds || '30' }}

jobs:
  player-scenario:
    name: ${{ matrix.platform }} ${{ matrix.scenario }} ${{ matrix.count }} player(s)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            bot_name: bds-test-bot
            scenario: idle
            count: 1
          - platform: linux
            os: ubuntu-24.04
            bot_name: bds-test-bot
            scenario: idle
            count: 5
          - platform: linux
            os: ubuntu-24.04
            bot_name: bds-test-bot
            scenario: chunk-walk
            count: 1
          - platform: linux
            os: ubuntu-24.04
            bot_name: bds-test-bot
            scenario: chunk-walk
            count: 5
          - platform: windows
            os: windows-2022
            bot_name: bds-test-bot.exe
            scenario: idle
            count: 1
          - platform: windows
            os: windows-2022
            bot_name: bds-test-bot.exe
            scenario: idle
            count: 5
          - platform: windows
            os: windows-2022
            bot_name: bds-test-bot.exe
            scenario: chunk-walk
            count: 1
          - platform: windows
            os: windows-2022
            bot_name: bds-test-bot.exe
            scenario: chunk-walk
            count: 5

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout test lab
        uses: actions/checkout@v7

      - name: Checkout Bot at exact ref
        uses: actions/checkout@v7
        with:
          repository: ReallocAll/bds-test-bot
          ref: ${{ env.BOT_REF }}
          path: bot-src
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build exact Bot revision
        shell: bash
        env:
          BOT_NAME: ${{ matrix.bot_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd bot-src
          go mod download
          go test ./...
          go build -trimpath -o "../dist/${BOT_NAME}" ./cmd/bds-test-bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check psutil packaging

      - name: Require exact Spark artifact
        run: >-
          python -m controller.assert_spark_artifact
          --platform ${{ matrix.platform }}
          --expected-sha ${{ env.EXPECTED_SPARK_SHA }}

      - name: Run real-player Spark scenario
        run: >-
          python -m controller.cross_platform_fleet_validation
          --platform ${{ matrix.platform }}
          --bot dist/${{ matrix.bot_name }}
          --count ${{ matrix.count }}
          --scenario ${{ matrix.scenario }}
          --profile-seconds ${{ env.PROFILE_SECONDS }}

      - name: Verify bStats evidence before upload
        if: always()
        id: verify-bstats
        run: >-
          python -m controller.verify_bstats_evidence
          --result test-results.json
          --result fleet-spark-result.json

      - name: Add scenario evidence to summary
        if: always()
        shell: bash
        run: |
          if [[ -f fleet-spark-result.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet-spark-result.json").read_text())
          metrics = data.get("metrics") or {}
          mspt = metrics.get("mspt_10s") or {}
          tps = metrics.get("tps") or {}
          print(f"## {data.get('platform')} / {data.get('scenario')} / {data.get('bot_count')} player(s)")
          print()
          print(f"Status: **{data.get('status')}**")
          print(f"BDS: `{data.get('bds_version')}`")
          print(f"Spark profile: {data.get('spark_profile_viewer_url')}")
          print(f"TPS 10s: {tps.get('10s')}")
          print(f"MSPT 10s mean/p95/max: {mspt.get('mean')} / {mspt.get('p95')} / {mspt.get('max')}")
          print(f"Fleet online: {data.get('fleet_online_event')}")
          print(f"Fleet shutdown: {data.get('fleet_shutdown_event')}")
          PY
          fi >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scenario evidence
        if: ${{ always() && steps.verify-bstats.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: spark-cross-platform-${{ matrix.platform }}-${{ matrix.scenario }}-${{ matrix.count }}-${{ github.run_id }}
          path: |
            metadata.json
            bds.log
            endstone.log
            spark.log
            fleet-${{ matrix.platform }}-${{ matrix.count }}-${{ matrix.scenario }}.log
            test-results.json
            fleet-spark-result.json
            bstats-config.toml
            failure-diagnostics.txt
            work/${{ matrix.platform }}/bedrock_server/server.properties
            work/${{ matrix.platform }}/bedrock_server/version.txt
          if-no-files-found: warn
          retention-days: 14
